jr": "Могут устроиться на должность психолога в организациях здравоохранения; образования всех типов и видов, независимо от форм собственности и ведомственной подчиненности; городских и республиканских социальных службах, центрах занятости; центрах реабилитации и социальной адаптации педагогически запущ"}, {"c": "B051", "n": "Қоршаған орта", "s": "Био-Гео", "m": "Қазіргі жағдайда кәсіби қызметтің теориялық және практикалық міндеттерін шығармашылық шешуге қабілетті жаңа технологиялар мен еңбек талаптарына бейімделген базалық және бейіндеуші пәндер бойынша іргел", "j": "Табиғи ресурстар мен табиғатты пайдаланудың мемлекеттік басқару ұйымдарында, әкімдіктерде және басқа да мекемелерде; Экологиялық қызметтер мен ұйымдарда, республикалық табиғат қорғау ведомстволарында; Ғылыми-зерттеу институттарында, санитарлық-эпидемиологиялық станцияларда; Ұлттық саябақтарда, селек", "nr": "Окружающая среда", "mr": "Подготовка высокообразованных, квалифицированных специалистов, востребованных на рынке труда, способных работать на высокопрофессиональном уровне.", "jr": "Во всех организациях и предприятиях, которые используют природные ресурсы в производственном процессе (будь то вода, воздух, земля, лес и живые организмы) В управлении природных ресурсов и регулирования природопользованием; В департаменте экологии; В Казгидромете; В частных экологических организация"}, {"c": "B079", "n": "Орман шаруашылығы", "s": "Био-Гео", "m": "орман шаруашылығы, елді мекендерді абаттандыру және көгалдандыру саласында жоғары білікті мамандар даярлау және қалыптастыру.", "j": "Директор, орманшы, орманшының көмекшісі, орман екпелер инженері, орманды қорғау және қорғау инженері, фитопатолог, орман питомнигінің шебері, таксатор-инженер, орман инспекторы, көгалдандыру шебері, ландшафт дизайнері, флорист, интерьер көгалдандыру шебері қызметін атқара алады.", "nr": "Лесное хозяйство", "mr": "Развитие у обучающихся личностных качеств и формирование общекультурных и профессиональных компетенций, подготовка востребованных специалистов в области разработки и реализации мероприятий по многоцел", "jr": "Лесничий, помощник лесничего, инженер лесного хозяйства, инженер лесных культур, инженер по охране и защите леса, инженер-таксатор, лесной инспектор, мастер лесного питомника, мастер-озеленитель, инженер-фито патолог, начальник охотничье-производственных участков, ведущий специалист, главный специал"}, {"c": "B090", "n": "Әлеуметтік жұмыс", "s": "Био-Гео", "m": "Әлеуметтік жұмыс саласында әлеуметтік-басқарушылық, әлеуметтік-педагогикалық, әлеуметтік-психологиялық, әлеуметтік-оңалту қызметтерін сапалы атқаруға қабілетті, инновациялық технологияларды меңгерген ", "j": "ЖББ мектептер, колледждер, университеттер, денсаулық сақтау ұйымдары; Әлеуметтік-профилактикалық кеңес беру қызметі (медициналық,реабилитациялық,терапевтік) - денсаулық сақтау ұйымдары, кеңес беру орталықтары, емдеу-оңалту орталықтары; Ұйымдастырушылық-басқарушылық қызмет (әлеуметтік-тұрмыстық қы", "nr": "Социальная работа", "mr": "Подготовка квалифицированного специалиста владеющего инновационными технологиями, способным качественно оказывать социально-управленческие, социально-педагогические, социально-психологические, социаль", "jr": "Образовательная деятельность - (педагогическая, психологическая) - школы, колледжы, университеты, организации здравоохранения; Социально-профилактическая консультативная деятельность (медицинская, реабилитационная, терапевтическая) - организации здравоохранения, консультационные центры, лечебно-реаб"}, {"c": "B012", "n": "Химия мұғалімдерін даярлау", "s": "Био-Хим", "m": "Білім беру саласында еліміздің және әлемнің игілігі үшін озық білім мен құндылықтарды жасай, дамыта және тарата алатын көшбасшы ұстаздарды қалыптастыру.", "j": "Жұмыс орнына келер болсақ, әртүрлі оқу орындарында (мектептерде, гимназияларда, лицейлерде, колледждерде және т.б.) химия пәнінің мұғалімі болып жұмыс жасай аласыздар.", "nr": "Подготовка учителей химии", "mr": "Подготовка учителя химии, обладающего высокой социальной и гражданской ответственностью, способного осуществлять профессиональную деятельность в сфере педагогического образования.", "jr": "Образовательные учреждения: учителем химии в общеобразовательных школах, лицеях, гимназиях, колледжах, учебных заведениях технического и профессионального образования; Организация науки: лаборантом,  старшим лаборантом, инженером; Организация управления: инспектором, специалистом отдела департамента"}, {"c": "B013", "n": "Биология мұғалімдерін даярлау", "s": "Био-Хим", "m": "Білім беру саласында еліміздің және әлемнің игілігі үшін озық білім мен құндылықтарды жасай, дамыта және тарата алатын көшбасшы ұстаздарды қалыптастыру.", "j": "Жұмыс орнына келер болсақ, жалпы білім беретін және мамандандырылған орта мектептер, лицейлер, гимназиялар, колледждер, мектепке дейінгі мекемелер, оқу әдебиеттер баспасы, білім департаменттері, мұғалімдердің біліктілігін көтеретін мекемелер, биологиялық, денсаулық сақтау, биомедициналық бағыттағы", "nr": "Подготовка учителей биологии", "mr": "Подготовка конкурентоспособных специалистов в системе образования РК, обладающих фундаментальными знаниями, для осуществления педагогической деятельности в области преподавания биологии.", "jr": "Может трудоустроиться в общеобразовательные и специализированные средние школы, лицеи, колледжи, гимназии, департаменты образования, учреждения по повышению квалификации учителей, а также научно-исследовательские организации биологического, оздоровительного, медико-биологического профиля, издательс"}, {"c": "B050", "n": "Биологиялық және сабақтас ғылымдар", "s": "Био-Хим", "m": "Биология саласында іргелі және қолданбалы заманауи білімді меңгерген, ғылыми-өндірістік салалардағы кәсіби қызметке дайын биолог-мамандарды даярлау.", "j": "Химия өнеркәсібі орындарында, мамандандырылған зертханаларда, фармацевтикалық компанияларда, ғылыми-өндірістік компанияларда биохимиктер, биологтар, вирусологтар, микробиологтар болып жұмыс істей алады.", "nr": "Биологические и смежные науки", "mr": "Подготовить биологов-профессионалов, владеющих современными знаниями в области фундаментальной и прикладной биологии, готовых к профессиональной деятельности в научной и производственной сферах.", "jr": "Выпускники работают на предприятиях химической промышленности, профильных лабораториях, в фармацевтических компаниях, научно-производственных компаниях, на позициях биохимика, биолога, вирусолога, микробиолога."}, {"c": "B053", "n": "Химия", "s": "Био-Хим", "m": "Химия өндірісі мен ғылым саласындағы өзекті мәселелерді шешу үшін кадрларды даярлау.", "j": "«Химия» мамандығын бітірген түлектер аналитикалық, экологиялық, санитарлы-эпидемиологиялық, сертификациялық қызметтердің өндірістік зертханаларында, химиялық, мұнай-химиялық, экологиялық, металлургиялық, экспертті-криминал лабораторияларында, жалпы білім беретін мекемелерде (колледждер, ЖОО) химик-", "nr": "Химия", "mr": "Подготовка кадров для решения актуальных проблем в области химического производства и науки.", "jr": "Менеджером в производственной лаборатории; Инженером-химиком; Сотрудником научно-исследовательских институтов; Химиком-технологом; Лаборантом; Химиком-аналитиком; Учителем химии; Специалистом судебно-медицинской экспертизы."}, {"c": "B068", "n": "Азық-түлік өнімдерінің өндірісі", "s": "Био-Хим", "m": "Өмір салтына әсер ететін маңызды факторлардың бірі - дұрыс тамақтану. Тамақтану өнімдерінің сапасына жауапкершілік - жақсы мамандарға, яғни тамақ технологтарына жүктеледі.", "j": "Тамақ өнеркәсібі мен қоғамдық тамақтандыру кәсіпорындарындағы технологиялық процесті ұйымдастырушы; Тамақ өнеркәсібі ұйымдарындағы экономист-технолог; Қоғамдық тамақтану орындарында санитарлық нормаларды сақтау бойынша маман Диетолог (тамақ мөлшерін, калория мөлшерін және т.б. есептеу) болып жұмыс ж", "nr": "Производство продуктов питания", "mr": "Подготовка высококвалифицированных кадров, владеющих профессиональными навыками в области производства продуктов питания отвечающих современным требованиям рынка труда, а также способных решать произв", "jr": "Организатором технологического процесса на предприятиях пищевой промышленности и общественного питания; Экономист-технологом в организациях пищевой промышленности; Специалистом по соблюдение санитарных норм в местах общественного питания; Диетологом (расчет количества продуктов, калорийности и т.д.)"}, {"c": "B072", "n": "Фармацевтикалық өндіріс технологиясы", "s": "Био-Хим", "m": "Фармацевтикалық өндіріс орындарында, дәрілік заттарды өндірудің технологиялық процестерін ұйымдастыру және дәрілік заттардың айналасындағы заңнама бойынша мамандарды даярлау.", "j": "Фармацевтика кәсіпорындары мен әртүрлі меншік нысанындағы фармацевтикалық фабрикалардың дәрілік препараттарды өндіру салаларында; Фармацевтикалық субстанцияларды, парфюмерлік-косметикалық және биотехнологиялық өнімдерді өндіру жөніндегі кәсіпорындарда; Парфюмерлік-косметикалық бағытындағы кәсіпорынд", "nr": "Технология фармацевтического производства", "mr": "Подготовка специалистов в области организации технологических процессов на фармацевтическом производстве, производства лекарств и законодательства в сфере обращения лекарственных средств.", "jr": "Выпускники работают провизорами-технологами, техническими специалистами в фармацевтических компаниях, инженерами на производствах на фармацевтических предприятиях."}, {"c": "B077", "n": "Өсімдік шаруашылығы", "s": "Био-Хим", "m": "Ауыл шаруашылығы саласындағы мемлекеттік саясаттың негізгі бағыттарын, өндірістік-технологиялық, ғылыми мәселелер мен міндеттерді шығармашылықпен шешуге қабілетті, ауыл шаруашылығы дақылдарды өсіру жә", "j": "Жұмыс орнына келер болсақ, агроном, орта және кәсіптік оқу орындарының оқытушысы, шаруа және фермер қожалықтарының басшысы, ғылыми-зерттеу ұйымдарындағы агроном-технолог, агроном-селекционер болып жұмыс жасай аласыздар.", "nr": "Растениеводство", "mr": "Подготовка конкуренто способного  специалиста, способного творчески решать производственно-технологические, ор рчески решат", "jr": "Могут работать младшими научными сотрудниками, аналитиками, инженерами-механиками, программистами, ассистентами преподавателя."}, {"c": "B059", "n": "Коммуникациялар және коммуникациялық технологиялар", "s": "Физ-Мат", "m": "Ақпараттық және телекоммуникациялық жүйелерді басқару және өңдеу саласына, соның ішінде сандық аппараттарды өңдеу мен ғарыштық байланыс жүйелеріне қажетті мамандарды даярлауға бағытталған.", "j": "Телекоммуникациялық бизнес процестерін ұйымдастыру және экономиканың әртүрлі секторларында байланыс жүйелерін әзірлеушілер үшін байланыс операторлары, электроника мамандары, операторлар, менеджерлер ретінде жұмыс істейді. Жұмысқа орналасу нұсқалары: «Казахтелеком» АҚ, «Транстелеком» АҚ, СКТБ «Гранит", "nr": "Коммуникации и коммуникационные технологии", "mr": "Подготовка высококвалифицированных специалистов, в области телекоммуникаций обладающих теоретическими и практическими знаниями, умениями и навыками, необходимыми для их реализации в профессиональной д", "jr": "Выпускники по направлению ««Телекоммуникации» работают в качестве связистов, специалистов по электронике, операторов, менеджеров по организации бизнес-процессов телекоммуникации и разработчиков систем связи в различных отраслях экономики. Варианты трудоустройства: АО «Astel», АО «Казахтелеком», АО «"}, {"c": "B061", "n": "Материалтану және технологиялар", "s": "Физ-Мат", "m": "Заманауи ғылымды қажет ететін технологияларды пайдалану, әртүрлі қолданыстағы жабындарды және жаңа материалдарды, аспаптар мен құрылғыларды өндіріске енгізуге, жасауға мамандарды дайындауға арналған.", "j": "Техникалық аспаптарды жасау, әртүрлі қолданыстағы жиынтықтар мен жүйелерді құру, және ғылыми-зерттеу ұйымдарында және өндірістік зертханаларда жұмыс істей аласыздар. Болашақта дефектоскопист, материалдардың химиялық және спектрлік талдауы бойынша инженер, электрондық микроскоп бойынша инженер, матер", "nr": "Материаловедение и технологии", "mr": "Целью образовательной программы является обеспечение фундаментальной и практической подготовки обучающихся для решения научных и инженерных задач в различных областях технической физики и материаловед", "jr": "Выпускники работают в научно-исследовательских организациях и производственных лабораториях. Будущие профессии: дефектоскопист, инженер по химическому и спектральному анализу материалов, инженер по электронной микроскопии, инженер-испытатель материалов и покрытий, инженер-материаловед."}, {"c": "B062", "n": "Электр техникасы және энергетика", "s": "Физ-Мат", "m": "Энергетика және электр энергетикасы, жылу және электр желілерін жобалау және пайдалану, энергетикалық кешендердің технологиялық және техникалық жүйелерін басқару саласындағы мамандарды дайындау.", "j": "Өз қызметінде электр энергиясын пайдаланатын кез келген кәсіпорындар мен ұйымдарда; Энергия өндіруші кәсіпорындарда, басқару және қызмет көрсету аймақтық энергетикалық мұнай газ өндіретін және мұнай өңдейтін компанияларда, жобалау институттарында; Қызмет көрсету, қондырғыларды орнату, жөндеу-реттеу ", "nr": "Электротехника и энергетика", "mr": "Подготовка высококвалифицированных специалистов в области производства, транспортировки электро и тепловой энергии, владеющими современными навыками и умениями необходимыми для успешного трудоустройст", "jr": "Подготовка высококвалифицированных специалистов в области производства, транспортировки электро и тепловой энергии, владеющими современными навыками и умениями необходимыми для успешного трудоустройства и роста, обладающими широким кругозором и знаниями."}, {"c": "B063", "n": "Электр техникасы және автоматтандыру", "s": "Физ-Мат", "m": "Республиканың электрондық инженерия, электротехника саласы бойынша экономиканың барлық салаларына және де мемлекеттік басқару орындарына қажетті заманауи кәсіби мамандарды даярлауға бағытталған.", "j": "Автоматтандырылған және роботты процестерді қолданатын отандық және шетелдік компаниялардағы әр түрлі бөлімдерде және әр түрлі лауазымдарда (басқаруды қоса); Мемлекетті function checkShared(){
  const p=new URLSearchParams(location.search);
  const rid=p.get("r");
  if(rid){S.screen="loading";S.resultId=rid;render();loadShared(rid)}
}
async function loadShared(id){
  try{
    const r=await fetch(SHEETS_URL+"?type=get&id="+encodeURIComponent(id));
    const d=await r.json();
    if(d.success&&d.result){
      S.sharedData=d.result;S.scores=d.result.scores;
      S.user={name:d.result.name,phone:"",grade:d.result.grade};
      S.aiText=d.result.aiText||"";S.screen="result";render()
    }else{
      app().innerHTML=`<div class="error-card"><div style="font-size:48px;margin-bottom:16px">🔍</div><h2 style="font-family:'Inter',sans-serif;font-weight:900">${t('notFound')}</h2><p style="color:var(--muted);margin:12px 0 24px">${t('notFoundSub')}</p><button class="btn" onclick="restart()">${t('startBtn')}</button></div>`
    }
  }catch(e){app().innerHTML=`<div class="error-card"><h2 style="font-family:'Inter',sans-serif;font-weight:900">Ошибка</h2><button class="btn" onclick="restart()" style="margin-top:20px">${t('startBtn')}</button></div>`}
}

function render(){
  const a=app();
  switch(S.screen){
    case"welcome":rWelcome(a);initGrantCalc();initIOP();break;
    case"lang":rLang(a);break;
    case"register":rRegister(a);break;
    case"quiz":rQuiz(a);break;
    case"loading":rLoader(a);break;
    case"result":rResult(a);initCareerGuide(calcType());initSpecBrowser();initUniBrowser();initENTTable(calcType());initENTSearch();initGrantCalc();initIOP();break;
  }
  updateTopbarLang();
  window.scrollTo({top:0,behavior:'smooth'});
  try{sessionStorage.setItem('mbti_state',JSON.stringify(S))}catch(e){}
}
function updateTopbarLang(){
  var box=document.getElementById('topbar-lang');
  if(!box)return;
  box.querySelectorAll('button').forEach(function(b){
    b.classList.toggle('active',b.getAttribute('data-lang')===S.lang);
  });
}
function setLang(lang){
  if(S.lang===lang)return;
  S.lang=lang;
  render();
}

  if(phone.length<11){alert(isKz?'Телефон нөмірін толық енгізіңіз!':'Введите полный номер телефона!');return}
  if(!school){alert(isKz?'Мектепті жазыңыз!':'Укажите школу!');return}
  if(!grade){alert(isKz?'Сыныпты таңдаңыз!':'Выберите класс!');return}
  S.user={name,phone:$("rphone").value.trim(),school,grade};
  S.idx=0;S.scores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  S.screen="quiz";render();
}

// ── QUIZ ──
function rQuiz(a){
  if(S.idx>=QUESTIONS.length){finishTest();return}
  const q=QUESTIONS[S.idx];
  const pct=Math.round(S.idx/QUESTIONS.length*100);
  const dim=DIM_LABELS[S.lang][q.s]||q.s;
  const qText=S.lang==='kz'?q.kz:q.ru;
  const aText=S.lang==='kz'?q.kz_a:q.ru_a;
  const bText=S.lang==='kz'?q.kz_b:q.ru_b;
  a.innerHTML=`
    <div class="prog"><div class="prog-bar" style="width:${pct}%"></div></div>
    <div class="prog-info"><span>${dim}</span><span>${S.idx+1} / ${QUESTIONS.length}</span></div>
    <div class="card">
      <div class="q-dim">${dim}</div>
      <div class="q-text">${qText}</div>
      <div class="opts">
        <button class="opt" onclick="ans('a')"><span class="opt-let">А</span>${aText}</button>
        <button class="opt" onclick="ans('b')"><span class="opt-let">Б</span>${bText}</button>
      </div>
    </div>`;
}

function ans(choice){
  const q=QUESTIONS[S.idx];
  const pair=q.s; // "EI","SN","TF","JP"
  if(choice==='a') S.scores[pair[0]]++;
  else S.scores[pair[1]]++;
  S.idx++;
  if(S.idx>=QUESTIONS.length){finishTest();return}
  render();
}

// ── CALC TYPE ──
function calcType(){
  const s=S.scores;
  // Tie: I, N, F, P win
  return (s.E>s.I?'E':'I')+(s.S>s.N?'S':'N')+(s.T>s.F?'T':'F')+(s.J>s.P?'J':'P');
}

// ── FINISH TEST ──
function finishTest(){
  const type=calcType();
  const info=MBTI[type];
  // Показываем результат СРАЗУ — без ожидания сети
  S.screen="result";render();

  // Сохраняем в фоне
  const saveUrl=SHEETS_URL+"?type=save&name="+encodeURIComponent(S.user.name)+
    "&phone="+encodeURIComponent(S.user.phone)+
    "&school="+encodeURIComponent(S.user.school||'')+
    "&grade="+encodeURIComponent(S.user.grade||'')+
    "&lang="+S.lang+
    "&mbti="+encodeURIComponent(type)+
    "&scores="+encodeURIComponent(JSON.stringify(S.scores));

  // Фоновые запросы — не влияют на отображение
  fetch(saveUrl).then(r=>r.json()).then(sd=>{
    if(sd.id){
      S.resultId=sd.id;
      const fullUrl=SITE_URL+"?r="+sd.id;
      history.replaceState({},"",fullUrl);
      // Обновить все WA-кнопки с правильной ссылкой
      updateWAButtons(type,fullUrl);
    }
  }).catch(()=>{});
}

    {l:'J',r:'P',ln:isKz?'Жоспарлаушы':'Планирующий',rn:isKz?'Ізденуші':'Ищущий'}

  }).join('');
}

function getENTForType(type){
  var info=TYPES[type];if(!info)return[];
  var seen={};var results=[];
  info.entPairs.forEach(function(pair){
    var real1=SUBJ_MAP[pair.s1]||pair.s1;
    var real2=SUBJ_MAP[pair.s2]||pair.s2;
    ENT_DATA.forEach(function(d){
      if(seen[d.code])return;
      if((d.s1===real1&&d.s2===real2)||(d.s1===real2&&d.s2===real1)){
        seen[d.code]=true;
        results.push(d);
      }
    });
  });
  return results;
}

var SUBJ_KZ={
  'Биология':'Биология','География':'География','Химия':'Химия','Физика':'Физика',
  'Математика':'Математика','Информатика':'Информатика',
  'Английский язык':'Ағылшын тілі','Всемирная история':'Дүниежүзі тарихы',
  'ЧОП':'Құқық негіздері','Казахский язык':'Қазақ тілі','Русский язык':'Орыс тілі',
  'Казахская литература':'Қазақ әдебиеті','Русская литература':'Орыс әдебиеті',
  'Казахский/Русский язык':'Қазақ/Орыс тілі','Казахская/Русская литература':'Қазақ/Орыс әдебиеті',
  'Творческий экзамен':'Шығармашылық емтихан'
};
function localizeSubj(s){return S.lang==='kz'&&SUBJ_KZ[s]?SUBJ_KZ[s]:s;}
function getENTSubjectPairs(){
  var seen={};var pairs=[];
  ENT_DATA.forEach(function(d){
    var key=d.s1+' + '+d.s2;
    if(!seen[key]){seen[key]=true;pairs.push({key:key,s1:d.s1,s2:d.s2});}
  });
  return pairs.sort(function(a,b){return a.key.localeCompare(b.key);});
}
function renderGrantCalc(){
  var isKz=S.lang==='kz';
  var pairs=getENTSubjectPairs();
  var opts='<option value="">'+(isKz?'Пән комбинациясын таңдаңыз':'Выберите комбинацию предметов')+'</option>'+
    pairs.map(function(p){
      var lbl=localizeSubj(p.s1)+' + '+localizeSubj(p.s2);
      return '<option value="'+p.key+'">'+lbl+'</option>';
    }).join('');
  return '<div class="gc-wrap" id="grant-calc">'+
    '<div class="gc-title">🎯 '+(isKz?'Грантқа түсу мүмкіндігіңді анықта':'Калькулятор шансов на грант')+'</div>'+
    '<div class="gc-sub">'+(isKz?'Пәндерді таңда және ҰБТ балыңды енгіз — 2023–2025 жж. статистикасы бойынша мүмкіндігіңді көрсетеміз':'Выбери предметы и введи балл ЕНТ — покажем шансы по статистике 2023–2025 гг.')+'</div>'+
    '<div class="gc-form">'+
      '<div class="gc-field"><label>'+(isKz?'Бейіндік пәндер':'Профильные предметы')+'</label><select id="gc-pair">'+opts+'</select></div>'+
      '<div class="gc-field"><label>'+(isKz?'ҰБТ балы (50–140)':'Балл ЕНТ (50–140)')+'</label><input type="number" id="gc-score" min="50" max="140" placeholder="'+(isKz?'Мысалы: 110':'Например: 110')+'"></div>'+
    '</div>'+
    '<button class="gc-btn" onclick="calcGrant()">'+(isKz?'Есептеу':'Рассчитать')+'</button>'+
    '<div class="gc-results" id="gc-results"></div>'+
  '</div>';
}
function submitGcReg(){
  var isKz=S.lang==='kz';

function initGrantCalc(){
  var el=document.getElementById('grant-calc');
  if(!el)return;
  // placeholder-only init; enter key shortcut
  var inp=document.getElementById('gc-score');
  if(inp){inp.addEventListener('keydown',function(e){if(e.key==='Enter')calcGrant();});}
}
function calcGrant(){
  var isKz=S.lang==='kz';
  var pair=document.getElementById('gc-pair').value;
  var scoreStr=document.getElementById('gc-score').value;
  var out=document.getElementById('gc-results');
  // Требуем регистрацию
  if(!S.user||!S.user.name||!S.user.phone){
    out.innerHTML='<div class="gc-reg-warn">'+
      '<div class="gc-reg-icon">🔒</div>'+
      '<div class="gc-reg-title">'+(isKz?'Грантқа түсу мүмкіндігіңізді анықтау үшін жеке деректеріңізді толтырыңыз':'Заполните личные данные, чтобы узнать свои шансы на получение гранта')+'</div>'+
      '<input class="inp" id="gc-reg-name" placeholder="'+(isKz?'Аты-жөніңіз':'Ваше имя')+'" style="margin-bottom:8px">'+
      '<input class="inp" id="gc-reg-phone" placeholder="+7 (___) ___-__-__" type="tel" style="margin-bottom:8px" oninput="phoneMask(this)" maxlength="18">'+
      '<button class="gc-btn" onclick="submitGcReg()">'+(isKz?'Жалғастыру →':'Продолжить →')+'</button>'+
    '</div>';
    return;
  }
  if(!pair){out.innerHTML='<div class="gc-empty">'+(isKz?'Пәндер комбинациясын таңдаңыз':'Выберите комбинацию предметов')+'</div>';return;}
  var score=parseInt(scoreStr,10);
  if(isNaN(score)||score<50||score>140){out.innerHTML='<div class="gc-empty">'+(isKz?'Балыңды 50 мен 140 аралығында енгіз':'Введите балл от 50 до 140')+'</div>';return;}
  var specs=ENT_DATA.filter(function(d){return (d.s1+' + '+d.s2)===pair;});
  if(!specs.length){out.innerHTML='<div class="gc-empty">'+(isKz?'Мамандықтар табылмады':'Специальности не найдены')+'</div>';return;}
  var groups={high:[],mid:[],low:[]};
  specs.forEach(function(d){
    var years=[d.scores.y23,d.scores.y24,d.scores.y25];
    var okCount=0,hasCount=0;
    years.forEach(function(y){
      if(y&&y.min!=null){hasCount++;if(score>=y.min)okCount++;}
    });
    var level;
    if(hasCount===0){level='low';}
    else if(okCount===hasCount){level='high';}
    else if(okCount/hasCount>=0.5){level='mid';}
    else{level='low';}
    groups[level].push({d:d,years:years,score:score});
  });
  var lblHigh=isKz?'Жоғары мүмкіндік':'Высокий шанс';
  var lblMid=isKz?'Орташа мүмкіндік':'Средний шанс';
  var lblLow=isKz?'Төмен мүмкіндік':'Низкий шанс';
  var html='';
  html+='<div class="gc-counters">'+
    '<div class="gc-counter gc-high"><div class="gc-counter-num">'+groups.high.length+'</div><div class="gc-counter-lbl">'+lblHigh+'</div></div>'+
    '<div class="gc-counter gc-mid"><div class="gc-counter-num">'+groups.mid.length+'</div><div class="gc-counter-lbl">'+lblMid+'</div></div>'+
    '<div class="gc-counter gc-low"><div class="gc-counter-num">'+groups.low.length+'</div><div class="gc-counter-lbl">'+lblLow+'</div></div>'+
  '</div>';
  html+='<div class="gc-legend">'+
    '<div class="gc-legend-item"><span class="gc-legend-dot gc-d-high"></span>'+(isKz?'3/3 жылда жеткілікті':'достаточно в 3/3 годах')+'</div>'+
    '<div class="gc-legend-item"><span class="gc-legend-dot gc-d-mid"></span>'+(isKz?'2/3 жылда жеткілікті':'достаточно в 2/3 годах')+'</div>'+
    '<div class="gc-legend-item"><span class="gc-legend-dot gc-d-low"></span>'+(isKz?'0–1 жылда жеткілікті':'достаточно в 0–1 годах')+'</div>'+
    '<div class="gc-legend-item"><span class="gc-legend-dot gc-d-no"></span>'+(isKz?'деректер жоқ':'нет данных')+'</div>'+
  '</div>';
  function renderCards(arr,level){
    if(!arr.length)return '';
    var ttl=level==='high'?lblHigh:level==='mid'?lblMid:lblLow;
    return '<div class="gc-section">'+
      '<div class="gc-section-ttl gc-'+level+'">'+ttl+' · '+arr.length+'</div>'+
      arr.map(function(it){
        var chips=[['2023',it.years[0]],['2024',it.years[1]],['2025',it.years[2]]].map(function(y){
          if(!y[1]||y[1].min==null)return '<span class="gc-chip gc-chip-none">'+y[0]+': —</span>';
          var cls=it.score>=y[1].min?'gc-chip-ok':'gc-chip-no';
          return '<span class="gc-chip '+cls+'">'+y[0]+': '+y[1].min+'</span>';
        }).join('');
        var name=(isKz&&it.d.nameKz)?it.d.nameKz:it.d.name;
        return '<div class="gc-card gc-'+level+'">'+
          '<div class="gc-card-name">'+name+'</div>'+
          '<div class="gc-card-code">'+it.d.code+'</div>'+
          '<div class="gc-chips">'+chips+'</div>'+
        '</div>';
      }).join('')+
    '</div>';
  }
  html+=renderCards(groups.high,'high');
  html+=renderCards(groups.mid,'mid');
  html+=renderCards(groups.low,'low');
  out.innerHTML=html;
}

// ── PDF GENERATION ──
function genPDF(){
  var btn=document.querySelector('[onclick="genPDF()"]');
  if(btn){btn.disabled=true;btn.textContent=S.lang==='kz'?'Жүктелуде...':'Загрузка...';}
  var wrap=document.querySelector('.wrap');
  if(!wrap)return;
  var dpr=Math.max(3,window.devicePixelRatio||1);
  html2canvas(wrap,{scale:dpr,useCORS:true,backgroundColor:'#f0f4f8',scrollY:-window.scrollY,windowWidth:wrap.scrollWidth}).then(function(canvas){
    var{jsPDF}=window.jspdf;
    var imgW=canvas.width;var imgH=canvas.height;
    var pdfW=210;var pdfH=297;var margin=5;
    var contentW=pdfW-2*margin;
    var ratio=contentW/imgW;
    var scaledH=imgH*ratio;
    var pageContentH=pdfH-2*margin;
    var doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    var pages=Math.ceil(scaledH/pageContentH);
    for(var p=0;p<pages;p++){
      if(p>0)doc.addPage();
      var srcY=p*pageContentH/ratio;
      var srcH=Math.min(pageContentH/ratio,imgH-srcY);
      var tmpCanvas=document.createElement('canvas');
      tmpCanvas.width=imgW;tmpCanvas.height=Math.round(srcH);
      var ctx=tmpCanvas.getContext('2d');
      ctx.drawImage(canvas,0,Math.round(srcY),imgW,Math.round(srcH),0,0,imgW,Math.round(srcH));
      var pageImg=tmpCanvas.toDataURL('image/png');
      doc.addImage(pageImg,'PNG',margin,margin,contentW,srcH*ratio);
    }
    var type=calcType();
    var fileName='Aiplus_MBTI_'+type+'_'+(S.user.name||'result').replace(/\s+/g,'_')+'.pdf';
    doc.save(fileName);
    if(btn){btn.disabled=false;btn.textContent=S.lang==='kz'?'📄 PDF жүктеу':'📄 Скачать PDF';}
  }).catch(function(err){
    console.error('PDF error:',err);
    if(btn){btn.disabled=false;btn.textContent=S.lang==='kz'?'📄 PDF жүктеу':'📄 Скачать PDF';}
  });

// ── PHONE MASK ──
function phoneMask(el){
  var v=el.value.replace(/\D/g,'');
  if(v.startsWith('8'))v='7'+v.slice(1);
  if(!v.startsWith('7'))v='7'+v;
  v=v.slice(0,11);
  var d=v.slice(1);
  var r='+7';
  if(d.length>0)r+=' ('+d.slice(0,3);
  if(d.length>=3)r+=') '+d.slice(3,6);
  if(d.length>=6)r+='-'+d.slice(6,8);
  if(d.length>=8)r+='-'+d.slice(8,10);
  el.value=r;
}

// ── IOP MODULE v2 ──
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function specChance(sp,score){
  var y23=sp.scores.y23,y24=sp.scores.y24,y25=sp.scores.y25;
  var ok=0,has=0;
  [y23,y24,y25].forEach(function(yy){if(yy&&yy.min!=null){has++;if(score>=yy.min)ok++;}});
  if(has===0)return 'none';
  if(ok===has)return 'high';
  if(ok/has>=0.5)return 'mid';
  return 'low';
}

function iopStepBar(current){
  var h='<div class="iop-stepbar">';
  for(var i=1;i<=4;i++){
    var cls=i<current?'done':i===current?'active':'';
    h+='<div class="iop-snum '+cls+'">'+i+'</div>';
    if(i<4){h+='<div class="iop-sline'+(i<current?' done':'')+'"></div>';}
  }
  return h+'</div>';
}

function initIOP(){
  var sec=document.getElementById('iop-sec');
  if(!sec)return;
  if(!S.iopSpecs)S.iopSpecs=[];
  if(!S.iopStep)S.iopStep=1;
  if(!S.iopFilter)S.iopFilter='all';
  switch(S.iopStep){
    case 2:iopStep2(sec);break;
    case 3:iopStep3(sec);break;
    case 4:iopStep4(sec);break;
    default:iopStep1(sec);
  }
}

function iopGoStep2(){
  var isKz=S.lang==='kz';
  var name=((document.getElementById('iop-name')||{}).value||'').trim();
  var pair=(document.getElementById('iop-pair')||{}).value||'';
  var scoreRaw=(document.getElementById('iop-score')||{}).value||'';
  if(!name){alert(isKz?'Атыңызды енгізіңіз':'Введите ваше имя');return;}
  if(!pair){alert(isKz?'Пәндерді таңдаңыз':'Выберите предметы');return;}
  var score=parseInt(scoreRaw,10);
  if(isNaN(score)||score<50||score>140){alert(isKz?'Балыңды 50–140 аралығында енгіз':'Введите балл от 50 до 140');return;}
  S.iopName=name;S.iopPair=pair;S.iopScore=score;
  if(S.iopPairPrev!==pair)S.iopSpecs=[];
  S.iopPairPrev=pair;
  S.iopStep=2;S.iopFilter='all';
  iopStep2(document.getElementById('iop-sec'));
}

function iopStep2(sec){
  if(!sec)return;
  var isKz=S.lang==='kz';
  if(!S.iopSpecs)S.iopSpecs=[];
  var pair=S.iopPair||'';
  var score=S.iopScore||0;
  var filter=S.iopFilter||'all';
  var searchQ=(S.iopSearch||'').toLowerCase();
  var allSpecs=ENT_DATA.filter(function(d){return (d.s1+' + '+d.s2)===pair;});
  var counts={all:allSpecs.length,high:0,mid:0,low:0};
  allSpecs.forEach(function(sp){var c=specChance(sp,score);if(c==='high')counts.high++;else if(c==='mid')counts.mid++;else counts.low++;});
  var filtered=filter==='all'?allSpecs:allSpecs.filter(function(sp){
    var c=specChance(sp,score);
    return filter==='high'?c==='high':filter==='mid'?c==='mid':(c==='low'||c==='none');
  });
  if(searchQ)filtered=filtered.filter(function(sp){
    var nm=(isKz&&sp.nameKz?sp.nameKz:sp.name).toLowerCase();
    return nm.indexOf(searchQ)>=0||sp.code.toLowerCase().indexOf(searchQ)>=0;
  });
  var cnt=S.iopSpecs.length;
  var fcards=[
    {f:'all',lbl:isKz?'Барлығы':'Все',cnt:counts.all},
    {f:'high',lbl:isKz?'Жоғары мүмкіндік':'Высокая возм.',cnt:counts.high},
    {f:'mid',lbl:isKz?'Орташа мүмкіндік':'Средняя возм.',cnt:counts.mid},
    {f:'low',lbl:isKz?'Төмен мүмкіндік':'Низкая возм.',cnt:counts.low}
  ].map(function(fc){
    return '<button class="iop-fcard fc-'+fc.f+(filter===fc.f?' active':'')+'" onclick="iopSetFilter(\''+fc.f+'\')">'+
      '<div class="iop-fcard-dot"></div>'+
      '<div class="iop-fcard-cnt">'+fc.cnt+'</div>'+
      '<div class="iop-fcard-lbl">'+fc.lbl+'</div></button>';
  }).join('');
  var cards=filtered.map(function(sp){
    var isSel=S.iopSpecs.indexOf(sp.code)>=0;
    var isDis=!isSel&&cnt>=4;
    var ch=specChance(sp,score);
    var chLbl=ch==='high'?(isKz?'Грант алудың жоғары мүмкіндігі':'Высокая возможность гранта'):
              ch==='mid'?(isKz?'Грант алудың орташа мүмкіндігі':'Средняя возможность гранта'):
              ch==='low'?(isKz?'Грант алудың төмен мүмкіндігі':'Низкая возможность гранта'):'—';
    var y23=sp.scores.y23,y24=sp.scores.y24,y25=sp.scores.y25;
    var s23=y23?(y23.max+'/'+y23.min):'—';
    var s24=y24?(y24.max+'/'+y24.min):'—';
    var s25=y25?(y25.max+'/'+y25.min):'—';
    var scoreLbl=isKz?'Грантқа түсу балы (max/min)':'Баллы гранта (max/min)';
    var selUni=S.iopUnis&&S.iopUnis[sp.code]?S.iopUnis[sp.code]:null;
    var uniCardCls=selUni?' uni-selected':(isSel&&!selUni?' uni-missing':'');
    var uniList=getUniList(sp.code);
    var uniBtnTxt=selUni?selUni.name+'<span style="font-size:10px;color:#888;margin-left:6px">'+selUni.city+'</span>':(isKz?'Университетті таңдаңыз':'Выберите университет');

function getUniList(code) {
  // UNI_DATA-дан университеттерді алып, ENT_DATA min балын қосамыз
  var uniEntry = UNI_DATA.find(function(u){ return u.c === code; });
  if (!uniEntry || !uniEntry.u || !uniEntry.u.length) return [];
  var sp = ENT_DATA.find(function(d){ return d.code === code; });
  var globalMin = sp && sp.scores && sp.scores.y25 ? sp.scores.y25.min : null;
  return uniEntry.u.map(function(u) {
    return { name: u.n, city: u.c, min: globalMin };
  }).sort(function(a,b){
    var am = a.min || 999, bm = b.min || 999;
    return am - bm;
  });
}

function iopOpenUniDrop(code) {
  // Барлық басқа dropdown-дарды жаптырамыз
  document.querySelectorAll('.iop-uni-dropdown.open').forEach(function(el){
    if (el.dataset.code !== code) el.classList.remove('open');
  });
  var drop = document.querySelector('.iop-uni-dropdown[data-code="'+code+'"]');
  if (!drop) return;
  var isOpen = drop.classList.contains('open');
  if (isOpen) { drop.classList.remove('open'); return; }
  drop.classList.add('open');
  var inp = drop.querySelector('.iop-uni-search');
  if (inp) { inp.value = ''; inp.focus(); iopFilterUniList(code, ''); }
}

function iopFilterUniList(code, q) {
  var drop = document.querySelector('.iop-uni-dropdown[data-code="'+code+'"]');
  if (!drop) return;
  var list = drop.querySelector('.iop-uni-list');
  if (!list) return;
  var unis = getUniList(code);
  var lq = q.toLowerCase();
  var filtered = lq ? unis.filter(function(u){
    return u.name.toLowerCase().indexOf(lq) >= 0 || u.city.toLowerCase().indexOf(lq) >= 0;
  }) : unis;
  var selUni = S.iopUnis && S.iopUnis[code];
  if (!filtered.length) {
    list.innerHTML = '<div class="iop-uni-empty">Табылмады</div>';
    return;
  }
  list.innerHTML = filtered.map(function(u){
    var isSel = selUni && selUni.name === u.name;
    return '<div class="iop-uni-item'+(isSel?' selected':'')+'" onclick="iopSelectUni(\''+code+'\', \''+u.name.replace(/'/g,'\\&apos;')+'\', \''+u.city+'\', '+(u.min||0)+')">'+
      '<div class="iop-uni-radio'+(isSel?' sel':'')+'"></div>'+
      '<div class="iop-uni-name">'+u.name+'<div class="iop-uni-city">'+u.city+'</div></div>'+
      (u.min ? '<div class="iop-uni-min">'+u.min+'</div>' : '')+
    '</div>';
  }).join('');
}

function iopSelectUni(code, name, city, min) {
  if (!S.iopUnis) S.iopUnis = {};
  S.iopUnis[code] = { name: name, city: city, min: min };
  // Dropdown жабамыз
  var drop = document.querySelector('.iop-uni-dropdown[data-code="'+code+'"]');
  if (drop) drop.classList.remove('open');
  // Кнопканы жаңартамыз
  var btn = document.querySelector('.iop-uni-btn[data-code="'+code+'"]');
  if (btn) {
    btn.innerHTML = '<span>'+name+'<span style="font-size:10px;color:#888;margin-left:6px">'+city+'</span></span><span style="font-size:10px">&#x2713;</span>';
    btn.classList.add('has-val');
  }
  // Карточка стилін жаңартамыз
  var card = document.querySelector('.iop-scard[data-code="'+code+'"]');
  if (card) {
    card.classList.add('uni-selected');
    card.classList.remove('uni-missing');
  }
  // Жалғастыру кнопкасын жаңартамыз
  iopUpdateContinueBtn();
}

function iopUpdateContinueBtn() {
  if (!S.iopSpecs) return;
  var total = Math.min(S.iopSpecs.length, 4);
  var complete = countIopComplete();
  var goBtn = document.querySelector('.iop-chips-go');
  var goBtn2 = document.querySelector('.iop-nav .iop-btn:not(.iop-btn-out)');
  var isKz = S.lang === 'kz';
  // Счётчик жаңарту
  var cntEl = document.querySelector('.iop-step2-cnt');
  if (cntEl) cntEl.textContent = complete + ' / ' + total;
  var progEl = document.querySelector('.iop-prog-bar');
  if (progEl) progEl.style.width = Math.round(complete / (total||1) * 100) + '%';
  var disabled = complete < total;
  [goBtn, goBtn2].forEach(function(btn){
    if (!btn) return;
    if (disabled) {
      btn.setAttribute('disabled', '');
      btn.title = isKz ? total+' мамандық таңдаңыз және университет белгілеңіз' : 'Выберите '+total+' специальности и университеты';
    } else {
      btn.removeAttribute('disabled');
      btn.title = '';
    }
  });
}

function countIopComplete() {
  if (!S.iopSpecs || !S.iopSpecs.length) return 0;
  return S.iopSpecs.filter(function(code){
    return S.iopUnis && S.iopUnis[code] && S.iopUnis[code].name;
  }).length;
}

      '<td style="padding:5px;text-align:center;border:1px solid #d0dce8;font-size:9px">'+(y23?y23.max+'/'+y23.min:'—')+'</td>'+
      '<td style="padding:5px;text-align:center;border:1px solid #d0dce8;font-size:9px">'+(y24?y24.max+'/'+y24.min:'—')+'</td>'+
      '<td style="padding:5px;text-align:center;border:1px solid #d0dce8;font-size:9px;font-weight:bold">'+(y25?y25.max+'/'+y25.min:'—')+'</td>'+
      '<td style="padding:5px;text-align:center;border:1px solid #d0dce8;font-size:9px;max-width:120px">'+
        (S.iopUnis&&S.iopUnis[sp.code]?'<div style="font-weight:600;line-height:1.3">'+escHtml(S.iopUnis[sp.code].name)+'</div>'+
        '<div style="font-size:8px;color:#666">'+escHtml(S.iopUnis[sp.code].city)+'</div>':'—')+
      '</td>'+
    '</tr>';
  }).join('');
  var aiplusBadge='<div style="position:absolute;bottom:10px;right:16px;z-index:3;'+
    'background:rgba(20,50,90,.82);border-radius:8px;padding:5px 13px;display:flex;align-items:center;gap:4px">'+
    '<span style="font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:900;color:#faa318;letter-spacing:.5px">Ai</span>'+
    '<span style="font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:900;color:#fff;letter-spacing:.5px">Plus</span>'+
    '<span style="font-family:Arial,Helvetica,sans-serif;font-size:9px;color:rgba(255,255,255,.7);margin-left:3px">ent.aiplus.kz</span>'+
    '</div>';
  var p2='<div style="'+PS+'width:1123px;height:794px;position:relative;overflow:hidden">'+
    '<img src="'+imgBg+'" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:fill" crossorigin="anonymous">'+
    nameInPill+aiplusBadge+
    '<div style="position:absolute;top:28px;left:30px;right:30px;z-index:1">'+

      (isKz?'ҰБТ СТАТИСТИКАЛЫҚ МӘЛІМЕТТЕР':'АНАЛИЗ СТАТИСТИКИ ЕНТ')+'</div>'+
    '<div style="height:1px;background:#1565C0;opacity:.3;margin-bottom:6px"></div>'+
    '</div>'+
    '<div style="position:absolute;top:62px;left:30px;right:30px;bottom:20px;z-index:1">'+
    '<div style="font-size:8px;color:#3C3C50;text-align:center;margin-bottom:8px">'+
      (isKz?'Оқушы: ':'Оқушы: ')+escHtml(name)+' | ҰБТ: '+score+' | '+escHtml(S.iopPair||'')+' | '+dateStr+'</div>'+
    '<table style="width:100%;border-collapse:collapse;font-family:Arial,sans-serif">'+
    '<thead><tr>'+
    '<th rowspan="2" style="background:#1565C0;color:#fff;padding:6px;font-size:8px;border:1px solid #0d47a1;width:120px">'+(isKz?'Мамандық':'Специальность')+'</th>'+
    '<th rowspan="2" style="background:#1565C0;color:#fff;padding:6px;font-size:7px;border:1px solid #0d47a1;width:180px">'+(isKz?'Ең жоғары балл жинаған 100 оқушы таңдаған ТОП-3 университет':'ТОП-3 ВУЗ (выбор 100 лучших учеников)')+'</th>'+
    '<th colspan="3" style="background:#1565C0;color:#fff;padding:6px;font-size:8px;border:1px solid #0d47a1">'+(isKz?'Бөлінген грант саны':'Выделено грантов')+'</th>'+
    '<th colspan="3" style="background:#1565C0;color:#fff;padding:6px;font-size:7px;border:1px solid #0d47a1">'+(isKz?'Грантқа түсудің max/min балдары':'max/min баллы гранта')+'</th>'+
    '<th rowspan="2" style="background:#1565C0;color:#fff;padding:6px;font-size:7px;border:1px solid #0d47a1">'+(isKz?'Таңдалған университет':'Выбранный ВУЗ')+'</th>'+
    '</tr><tr>'+
    ['2023','2024','2025','2023','2024','2025'].map(function(h){
      return '<th style="background:#1976D2;color:#fff;padding:5px;font-size:8px;border:1px solid #0d47a1">'+h+'</th>';
    }).join('')+
    '</tr></thead><tbody>'+tableRows+'</tbody></table>'+

      '<b>'+(isKz?'Сіздің балыңыз: ':'Ваш балл: ')+score+'</b>'+
      ' &nbsp;<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#1B5E20;vertical-align:middle"></span>=жоғары'+
      ' &nbsp;<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#E65100;vertical-align:middle"></span>=орташа'+

    '</div>'+
    '</div></div>';

  var specCards=specs.map(function(sp,i){
    var sd=specDatas[i];
    var nm=escHtml(isKz&&sp.nameKz?sp.nameKz:sp.name);
    var maqsat=escHtml(sd?(isKz?sd.m:sd.mr)||'—':'—');
    var jumys=escHtml(sd?(isKz?sd.j:sd.jr)||'—':'—');
    return '<div style="display:flex;gap:10px;margin-bottom:8px;background:rgba(255,255,255,.93);border-radius:10px;padding:10px 12px;border-left:4px solid #1565C0">'+
      '<div style="background:#1565C0;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex-shrink:0;margin-top:1px">'+(i+1)+'</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="font-size:12px;font-weight:bold;color:#1565C0;margin-bottom:4px">'+nm+
          '<span style="font-size:9px;color:#888;font-weight:normal;margin-left:8px">'+sp.code+'</span></div>'+
        '<div>'+
          '<div style="font-size:8px;font-weight:bold;color:#1565C0;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px">'+(isKz?'ЖҰМЫС ОРНЫ':'МЕСТО РАБОТЫ')+'</div>'+
          '<div style="font-size:9px;color:#333;line-height:1.5">'+jumys+'</div>'+
        '</div>'+
      '</div></div>';
  }).join('');
  var p3='<div style="'+PS+'width:1123px;height:794px;position:relative;overflow:hidden">'+
    '<img src="'+imgBg+'" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:fill" crossorigin="anonymous">'+
    nameInPill+aiplusBadge+
    '<div style="position:absolute;top:28px;left:30px;right:30px;z-index:1">'+
    '<div style="font-size:13px;font-weight:bold;color:#1565C0;text-align:center;margin-bottom:4px">'+
      (isKz?'ТАҢДАЛҒАН МАМАНДЫҚТАР ТУРАЛЫ АҚПАРАТ':'ИНФОРМАЦИЯ О ВЫБРАННЫХ СПЕЦИАЛЬНОСТЯХ')+'</div>'+
    '<div style="height:1px;background:#1565C0;opacity:.3;margin-bottom:6px"></div>'+
    '</div>'+
    '<div style="position:absolute;top:62px;left:30px;right:30px;bottom:20px;z-index:1">'+
    specCards+
    '</div></div>';

  // БЕТ 4: Құттықтау сөзі
  var p4='<div style="'+PS+'width:1123px;height:794px;position:relative;overflow:hidden">'+
    '<img src="'+imgCongrats+'" style="width:100%;height:100%;object-fit:fill;display:block" crossorigin="anonymous">'+
    nameInPill+'</div>';

  var pages=[p1,p2,p3,p4];
  var doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  var sc=Math.min(Math.max(window.devicePixelRatio||2,2),3);

  function renderPage(i){
    if(i>=pages.length){
      doc.save(fname);
      if(dlBtn){dlBtn.disabled=false;dlBtn.innerHTML=isKz?'&#128229; PDF жүктеу — 4 таңдау жоспары':'&#128229; Скачать PDF — 4 таңдау жоспары';}
      if(status){status.textContent=isKz?'&#10003; PDF сәтті жасалды!':'&#10003; PDF успешно создан!';}
      return;
    }
    var div=document.createElement('div');
    div.style.cssText='position:fixed;left:-9999px;top:0;width:1123px;';
    div.innerHTML=pages[i];
    document.body.appendChild(div);
    html2canvas(div,{scale:sc,useCORS:true,logging:false,backgroundColor:null,allowTaint:false})
      .then(function(canvas){
        document.body.removeChild(div);
        if(i>0)doc.addPage();
        doc.addImage(canvas.toDataURL('image/png'),'PNG',0,0,297,210);
        if(status)status.textContent=(isKz?'Бет ':'Стр. ')+(i+1)+'/'+pages.length+'...';
        renderPage(i+1);
      }).catch(function(e){
        if(document.body.contains(div))document.body.removeChild(div);
        console.error('html2canvas p'+i,e);
        renderPage(i+1);
      });
  }
  renderPage(0);
}

function restart(){
  history.pushState({},"",location.pathname);
  try{sessionStorage.removeItem('mbti_state')}catch(e){}
  S={screen:"welcome",lang:S.lang,idx:0,scores:{E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0},user:{},resultId:null,aiText:"",sharedData:null};
  render();
}

// ── INIT ──
checkShared();
if(S.screen!=="loading")render();
