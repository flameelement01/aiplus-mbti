<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Aiplus — Профориентация MBTI × ЕНТ 2026</title>
<meta name="description" content="Бесплатный профориентационный тест MBTI. 70 вопросов, 16 типов личности, профессии + вузы РК с проходными баллами ЕНТ 2025.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#f0f4f8;--dark:#1472c2;--card:#ffffff;--accent:#faa318;--accent2:#f1ac3f;
  --muted:#777;--border:rgba(0,0,0,.08);--radius:18px;
  --shadow:0 2px 20px rgba(0,0,0,.06);--dark-bg:#193b53;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--dark);font-family:'Inter',sans-serif;
  min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;
  font-size:15px;line-height:1.6;letter-spacing:.01em}

/* TOPBAR */
.topbar{background:var(--dark-bg);color:#fff;padding:10px 20px;display:flex;
  align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.logo{display:flex;align-items:center;gap:8px}
.logo img{height:40px;transform:rotate(270deg)}
.badge{background:var(--accent);color:#000;font-size:10px;font-weight:700;
  padding:4px 11px;border-radius:20px;letter-spacing:.4px}
.topbar-right{display:flex;align-items:center;gap:10px}
.lang-switch{display:inline-flex;background:rgba(255,255,255,.1);border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.lang-switch button{background:transparent;color:rgba(255,255,255,.75);border:none;padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.3px;transition:all .15s;font-family:inherit}
.lang-switch button.active{background:var(--accent);color:#000}
.lang-switch button:not(.active):hover{background:rgba(255,255,255,.08);color:#fff}

/* CONTAINER */
.wrap{max-width:780px;margin:0 auto;padding:20px 14px 80px}

/* PROGRESS */
.prog{height:4px;background:rgba(0,0,0,.07);border-radius:4px;margin:16px 0 4px}
.prog-bar{height:4px;background:var(--accent);border-radius:4px;transition:width .4s ease}
.prog-info{font-size:11px;color:var(--muted);font-weight:600;display:flex;
  justify-content:space-between;margin-bottom:14px}

/* BUTTONS */
.btn{background:var(--dark);color:#fff;border:none;padding:17px 40px;
  border-radius:50px;font-family:'Inter',sans-serif;font-size:14px;font-weight:800;
  cursor:pointer;transition:transform .2s,box-shadow .2s;display:inline-block;text-align:center}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(20,114,194,.3)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-outline{background:transparent;border:2px solid var(--dark);color:var(--dark);
  padding:14px 32px;border-radius:50px;font-family:'Inter',sans-serif;font-size:13px;
  font-weight:700;cursor:pointer;transition:all .2s}
.btn-outline:hover{background:var(--dark);color:#fff}
.btn-accent{background:var(--accent);color:#000;border:none;padding:16px 36px;
  border-radius:50px;font-family:'Inter',sans-serif;font-size:14px;font-weight:800;cursor:pointer}

/* CARDS */
.card{background:var(--card);border-radius:var(--radius);padding:36px 28px;
  border:1px solid var(--border);box-shadow:var(--shadow)}

/* INPUT */
.inp{width:100%;padding:15px 18px;background:#f0ede5;border:2px solid transparent;
  border-radius:12px;font-family:'Inter',sans-serif;font-size:15px;color:var(--dark);
  margin-bottom:10px;transition:border .2s}
.inp:focus{outline:none;border-color:var(--dark);background:#fff}

/* WELCOME */
.hero{padding:44px 0 28px;text-align:center}
.hero-tag{display:inline-flex;align-items:center;gap:6px;background:var(--dark-bg);
  color:#fff;font-size:10px;font-weight:700;padding:6px 14px;
  border-radius:20px;letter-spacing:1px;text-transform:uppercase;margin-bottom:22px}
.hero-title{font-family:'Inter',sans-serif;font-size:clamp(20px,4.5vw,38px);
  font-weight:900;line-height:1.15;letter-spacing:-1px;margin-bottom:18px;white-space:nowrap}
.hero-title .hl{color:#fff;background:var(--dark);padding:2px 14px;
  border-radius:10px;display:inline-block}
.hero-sub{font-size:15px;color:var(--muted);line-height:1.7;max-width:440px;
  margin:0 auto 20px}
.hero-slogan{font-family:'Inter',sans-serif;font-size:clamp(12px,2.5vw,14px);font-weight:600;
  color:var(--muted);line-height:1.6;max-width:500px;margin:0 auto 30px;letter-spacing:.3px}

.stats{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:30px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:11px 18px;text-align:center;min-width:80px}
.stat b{font-family:'Inter',sans-serif;font-size:22px;font-weight:900;display:block}
.stat small{font-size:10px;color:var(--muted);font-weight:600}

.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;margin-top:32px}
.trust-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:18px;text-align:left}
.trust-card .ic{font-size:20px;margin-bottom:8px}
.trust-card h4{font-size:13px;font-weight:700;margin-bottom:3px}
.trust-card p{font-size:11px;color:var(--muted);line-height:1.6}
.trust-item{font-size:11px;color:var(--dark);font-weight:600;padding:4px 0 4px 14px;
  position:relative;line-height:1.4}
.trust-item::before{content:'•';position:absolute;left:2px;color:var(--accent);font-weight:900}

.why{background:var(--dark-bg);color:#fff;border-radius:18px;padding:24px;margin:20px 0}
.why h3{font-family:'Inter',sans-serif;font-size:16px;font-weight:800;
  margin-bottom:14px;color:var(--accent)}
.why-item{display:flex;align-items:flex-start;gap:9px;font-size:12px;
  line-height:1.6;color:#bbb;margin-bottom:8px}
.why-dot{width:5px;height:5px;background:var(--accent);border-radius:50%;
  flex-shrink:0;margin-top:6px}

/* LANGUAGE SELECT */
.lang-wrap{text-align:center;padding:60px 0}
.lang-title{font-family:'Inter',sans-serif;font-size:28px;font-weight:900;margin-bottom:8px}
.lang-sub{color:var(--muted);font-size:14px;margin-bottom:32px}
.lang-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.lang-btn{background:var(--card);border:2px solid var(--border);border-radius:16px;
  padding:28px 40px;cursor:pointer;transition:all .2s;text-align:center;min-width:160px}
.lang-btn:hover{border-color:var(--dark);transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(0,0,0,.1)}
.lang-btn .flag{font-size:36px;margin-bottom:8px}
.lang-btn .lbl{font-family:'Inter',sans-serif;font-size:16px;font-weight:800}

/* REGISTER FORM */
.reg-card{max-width:440px;margin:0 auto}
.reg-tag{display:inline-block;background:#e6f4d7;color:#2d7d46;font-size:10px;
  font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:14px}
.reg-title{font-family:'Inter',sans-serif;font-size:24px;font-weight:900;
  letter-spacing:-.5px;margin-bottom:6px}
.reg-sub{color:var(--muted);margin-bottom:22px;font-size:13px;line-height:1.6}
.privacy{font-size:10px;color:var(--muted);margin-top:10px;text-align:center}

/* QUESTION */
.q-dim{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:2px;margin-bottom:8px}
.q-text{font-family:'Inter',sans-serif;font-size:clamp(17px,3vw,21px);font-weight:700;
  line-height:1.45;margin-bottom:26px;letter-spacing:-.2px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:#f0ede5;border:2px solid transparent;border-radius:13px;
  padding:16px 20px;text-align:left;cursor:pointer;font-family:'Inter',sans-serif;
  font-size:15px;font-weight:500;color:var(--dark);transition:all .18s;
  display:flex;align-items:center;gap:11px;line-height:1.5}
.opt:hover{border-color:var(--dark);background:#fff;transform:translateX(4px)}
.opt:active{background:var(--dark);color:#fff}
.opt-let{display:flex;align-items:center;justify-content:center;background:var(--dark);
  color:#fff;border-radius:8px;width:28px;height:28px;font-size:11px;
  font-weight:900;flex-shrink:0}

/* LOADER */
.loader{text-align:center;padding:80px 20px}
.spinner{width:44px;height:44px;border:4px solid rgba(0,0,0,.1);
  border-top-color:var(--dark);border-radius:50%;animation:spin .8s linear infinite;
  margin:0 auto 22px}
@keyframes spin{to{transform:rotate(360deg)}}
.loader h2{font-family:'Inter',sans-serif;font-size:18px;font-weight:800;margin-bottom:5px}
.loader p{color:var(--muted);font-size:13px}

/* RESULT */
.result{animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.share-bar{background:var(--dark-bg);border-radius:14px;padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex-wrap:wrap;margin-bottom:16px}
.share-bar .lbl{color:#fff;font-size:12px;font-weight:600;flex:1;min-width:140px}
.share-bar .lbl span{color:var(--accent)}
.share-btns{display:flex;gap:7px;flex-wrap:wrap}
.btn-sm{border:none;padding:8px 14px;border-radius:20px;font-size:11px;
  font-weight:700;cursor:pointer;transition:opacity .2s;white-space:nowrap}
.btn-copy{background:var(--accent);color:#000}
.btn-wa{background:#25D366;color:#fff}
.btn-pdf{background:#E74C3C;color:#fff}

/* MBTI SLIDE */
.slide{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);
  box-shadow:0 6px 32px rgba(0,0,0,.08);margin-bottom:16px}
.slide-hdr{padding:12px 22px;display:flex;justify-content:space-between;
  align-items:center;font-size:10px;font-weight:700;letter-spacing:1px;color:#fff}
.slide-body{display:flex;background:#fff;flex-wrap:wrap}
.slide-l{flex:0 0 240px;padding:26px 22px;background:#fafafa;
  border-right:1px solid var(--border)}
.slide-r{flex:1;min-width:240px;padding:26px 22px}
.mbti-big{font-family:'Inter',sans-serif;font-size:62px;font-weight:900;
  line-height:1;letter-spacing:-3px;margin-bottom:4px}
.mbti-name{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:12px;border-bottom:1px solid var(--border);
  padding-bottom:12px}
.mbti-desc{font-size:12px;line-height:1.7;color:#555;margin-bottom:10px}
.mbti-extra{font-size:12px;line-height:1.7;color:#444;background:#f0f4f8;border-left:3px solid var(--accent);padding:12px 14px;border-radius:0 10px 10px 0;margin-bottom:14px}
.trait-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trait{background:#fff;border:1px solid var(--border);border-radius:9px;padding:10px}
.trait .en{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.trait .ru{font-size:11px;color:var(--dark);margin-top:2px;font-weight:600}
.trait .sub{font-size:9px;color:var(--muted);margin-top:1px}

.pro-label{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:1px;
  color:#fff;padding:6px 12px;border-radius:7px;display:inline-block;margin-bottom:8px}
.pro-list{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pro-item{font-size:11px;color:#555;font-weight:600;padding:5px 8px;
  background:#f5f2eb;border-radius:5px}

.bars{margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.bars-title{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:8px}

/* SECTION CARDS */
.sec{background:var(--card);border-radius:var(--radius);padding:22px;
  border:1px solid var(--border);margin-bottom:16px;box-shadow:var(--shadow)}
.sec-title{font-family:'Inter',sans-serif;font-size:17px;font-weight:800;
  letter-spacing:-.3px;margin-bottom:3px}
.sec-sub{font-size:12px;color:var(--muted);margin-bottom:14px}

.oblig{background:#eef7e3;border:1px solid #c0e8a0;border-radius:11px;
  padding:12px 14px;margin-bottom:14px;font-size:12px}
.oblig b{color:#2d7d46}

.pair{border:2px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;
  transition:border-color .2s}
.pair.top{border-color:var(--dark);background:#fafafa}
.pair-hdr{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.pair-tag{font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px}
.pair-tag.main{background:var(--dark);color:#fff}
.pair-tag.alt{background:#eee;color:#666}
.pair-subj{font-size:13px;font-weight:700}
.pair-plus{font-size:14px;color:#bbb}
.pair-prof{font-size:11px;color:#666;padding-left:2px}

/* UNI CARDS */
.uni{border:1px solid var(--border);border-radius:12px;padding:14px;
  margin-bottom:8px;transition:box-shadow .2s}
.uni:hover{box-shadow:0 4px 16px rgba(0,0,0,.06)}
.uni-top{display:flex;justify-content:space-between;align-items:flex-start;
  gap:10px;flex-wrap:wrap}
.uni-name{font-weight:700;font-size:14px}
.uni-city{font-size:11px;color:var(--muted);margin-top:2px}
.score-pills{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill-t{background:#fff3d0;color:#7a4800}
.pill-g{background:var(--dark);color:#fff}
.uni-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.uni-tag{font-size:10px;background:#f0f0f0;color:#555;padding:3px 8px;
  border-radius:20px;font-weight:600}
.uni-tip{font-size:11px;color:var(--muted);margin-top:7px;padding-top:7px;
  border-top:1px solid var(--border)}

/* SCALE */
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
  gap:7px;margin-top:12px}
.zone{border-radius:9px;padding:10px;text-align:center}
.zone b{font-family:'Inter',sans-serif;font-size:15px;font-weight:900;display:block}
.zone small{font-size:10px;font-weight:600}
.z-red{background:#ffe8e0;color:#c03000}
.z-orange{background:#fff3d0;color:#7a4800}
.z-green{background:#e0f5e8;color:#006030}
.z-blue{background:#e0eeff;color:#003090}

/* AI */
.ai{background:var(--dark-bg);color:#fff;border-radius:var(--radius);padding:22px;
  margin-bottom:16px}
.ai-hdr{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.ai-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;
  animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ai h3{font-family:'Inter',sans-serif;font-size:15px;font-weight:800}
.ai-body{font-size:13px;line-height:1.8;color:#ccc;white-space:pre-wrap}

/* CTA */
.cta{background:var(--accent);border-radius:var(--radius);padding:24px;
  text-align:center;margin-bottom:16px}
.cta h2{font-family:'Inter',sans-serif;font-size:20px;font-weight:900;
  letter-spacing:-.5px;margin-bottom:6px}
.cta p{font-size:13px;color:#333;margin-bottom:16px;line-height:1.6}
.cta a{background:var(--dark-bg);color:#fff;text-decoration:none;
  padding:14px 28px;border-radius:50px;font-family:'Inter',sans-serif;
  font-size:12px;font-weight:800;display:inline-block;transition:transform .2s}
.cta a:hover{transform:translateY(-2px)}

.disclaimer{font-size:11px;color:#888;padding:12px;background:#f0ede5;
  border-radius:9px;line-height:1.7}

.error-card{background:var(--card);border-radius:var(--radius);padding:36px;
  text-align:center;border:1px solid var(--border)}

@media(max-width:580px){
  .slide-l{flex:0 0 100%;border-right:none;border-bottom:1px solid var(--border)}
  .mbti-big{font-size:48px}
  .card{padding:24px 16px}
  .share-bar{flex-direction:column;align-items:flex-start}
}

/* CAREER GUIDE */
.pro-card{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden}
.pro-card-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;cursor:pointer;background:#fafafa}
.pro-card-name{font-size:14px;font-weight:700}
.pro-card-arrow{font-size:12px;color:var(--muted)}
.pro-card-body{padding:14px 18px;border-top:1px solid var(--border)}
.pro-card-section{margin-bottom:14px;font-size:12px;line-height:1.7}
.pro-sec-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;
  margin-bottom:6px;color:var(--dark);border-bottom:1px solid var(--border);padding-bottom:4px}
.pro-line{color:#444;margin-bottom:6px;padding-left:8px;border-left:2px solid var(--border)}
.pro-line b{color:#222;font-weight:700}
.strengths-list{margin-top:10px}
.str-item{font-size:13px;line-height:1.7;color:#444;margin-bottom:10px;padding-left:10px;
  border-left:3px solid var(--accent)}
.str-item b{color:#222;font-weight:700}
/* MBTI REF TABLE */
.mbti-ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:12px}
.mbti-ref-item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:10px 14px}
.mbti-ref-code{font-weight:900;font-size:14px;letter-spacing:.5px}
.mbti-ref-name{font-size:12px;color:#555;font-weight:600}
/* SPEC BROWSER */
.spec-subj-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.spec-subj-btn{padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);
  font-size:12px;font-weight:600;cursor:pointer;transition:.2s;text-align:center}
.spec-subj-btn:hover,.spec-subj-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.spec-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.spec-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;
  cursor:pointer;transition:.2s;font-size:12px}
.spec-item:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.spec-item-code{font-weight:800;color:var(--accent);font-size:11px}
.spec-item-name{font-weight:600;color:var(--dark);margin-top:2px}
/* SPEC POPUP */
.spec-popup-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);
  z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.spec-popup{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:80vh;
  overflow-y:auto;padding:28px;position:relative}
.spec-popup-close{position:absolute;top:12px;right:16px;background:none;border:none;
  font-size:24px;cursor:pointer;color:#999;line-height:1}
.spec-popup h3{font-size:18px;font-weight:800;color:var(--dark);margin-bottom:4px}
.spec-popup .spec-code{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:12px}
.spec-popup .spec-section{margin-bottom:14px}
.spec-popup .spec-section-title{font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
.spec-popup .spec-section-text{font-size:13px;line-height:1.7;color:#444}
/* UNI BROWSER */
.uni-browser-search{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;
  font-size:13px;margin-bottom:12px;font-family:'Inter',sans-serif}
.uni-browser-search:focus{outline:none;border-color:var(--dark)}
.uni-browser-list{max-height:420px;overflow-y:auto}
.uni-browser-item{padding:10px 14px;border:1px solid var(--border);border-radius:10px;
  margin-bottom:6px;cursor:pointer;transition:.2s;background:#fff}
.uni-browser-item:hover{border-color:var(--accent);background:#fffaf0}
.uni-browser-item .ub-code{font-size:11px;color:var(--accent);font-weight:700}
.uni-browser-item .ub-name{font-size:13px;font-weight:600;color:var(--dark)}
.uni-detail-back{background:none;border:none;color:var(--dark);font-weight:700;font-size:13px;

    strengths_kz:'Табандылық, тәуелсіздік, өршілдік. Олар өз қалауларын нақты біледі және бұл оларға энергияларын қажетсіз жұмсамауға көмектеседі. Олар бір нәрсеге қызығушылық танытқанда, толығымен процеске беріліп, нәтижеге жету үшін қажетті дағдылар мен білімді алады.\nІзденімпаздық. Бұл қабілет оларға белгілі бір көзқарастармен шектелмей, кеңінен қарауға, жаңа, әдеттен тыс идеяларды іздеуге мүмкіндік береді. Егер пікірлері ұтымдылық пен фактілерге қайшы екенін көрсе, олар оны өзгертуге дайын.\nКөпқырлы болу және хабардарлық. Олар жаңа нәрселерді оңай қабылдайды, әртүрлі мәселелерді болжамдарға емес, фактілер мен зерттеулерге негіздей отырып, шешуді ұнатады. Бұл олардың өзіне және шеберлігіне деген қосымша сенімділігін арттырады. Сондықтан олар өздерін білімнің көптеген салаларында жайлы сезініп, табысты болып келеді.\n2.ІNTP\nЛогикасы мен аналитикалық ойлау қабілеті дамыған. Осы қабілеттердің арқасында олар басқалар жіберіп алған маңызды кішкентай тұстарды, заңдылықтар және байланыстарды байқап қалады.\nАқиқатқа жетуге талпыну. Оларға әр нәрсенің мәнін түсініп, адамдарға сенімді ақпарат беру маңызды. Бұл тұлғалар ағат пікір мен жалған ақпаратқа қарсы нағыз күрескерлер.\nШығармашылықтан тыс ойлау. Олар аса жарқын қиялға ие және көптеген адамдардың ойына келе бермейтін бірегей идеяларды оңай ойлап табады. Мұндай ерекше ойлау қабілеті көбінесе инновациялық жетістіктерге жол ашады.\nӘлемге ашық болу және қызығушылық таныту. Бұл типтегі тұлғалар түрлі салаларда жаңа білім мен сезімдерді іздеумен болады. Бүгін химиялық талдау саласына, ертең гүл өсіру, ал бір аптадан кейін ән айтуға қызығушылық танытады. Олардың қызығушылығы тек өздеріне қолайлы дұрыс мағынаға сәйкес шектеледі.',strengths_ru:'Настойчивость, независимость, целеустремленность. Они точно знают, чего хотят, и это помогает им не тратить свою энергию без надобности. Когда их что-то интересует, они полностью отдаются процессу и приобретают необходимые навыки и знания для достижения результатов.\nЛюбознательность. Эта способность позволяет им смотреть широко, искать новые, необычные идеи, не ограничиваясь определенными точками зрения. Они готовы изменить свое мнение, если посчитают, что оно противоречит рациональности и фактам.\nРазноcторонность и осведомленность. Они легко принимают новое, любят решать различные проблемы, основываясь на фактах и исследованиях, а не на предположениях. Это придает им дополнительную уверенность в себе и в своем мастерстве. Поэтому они чувствуют себя комфортно и бывают успешны во многих сферах образования.',

    desc_ru:"Вы активная и целеустремлённая личность. Способны стратегически анализировать потенциал и придумывать творческие решения.",
    desc_kz:"Сіз белсенді және мақсатқа ұмтылғыш тұлғасыз. Әлеуетті стратегиялық талдап, шығармашылық шешім таба аласыз.",
    extra_kz:"Сіз мүмкіндіктерді іздеуде сыртқы ортаны зерттейтін тапсырмаларды орындауға бағытталған әлеуметтік, белсенді, мақсаты зор тұлғасыз. Содан кейін шығармашылық шешімдер немесе бар мәселелерді реттеу үшін оны талдап және потенциалды стратегиялық тұрғыдан қарастыра аласыз, сізден керемет өнертапқыш шығады. Өмірлік жағдайларға ерекше тәсілді қолданасыз және интеллектуалды пікірталастарға қуана-қуана қатысасыз.",
    extra_ru:"",
    strengths_kz:'Білімге құштарлық. Шығармашыл неғұрлым көп ақпарат білетін болса, соғұрлым өзін сенімді ұстайды. Сондықтан мұндай типтегі адамдар жаңа нәрсені үйрену мүмкіндігін жібермейді. Олар оны ешқашан қолданбайтын болса да, оларды үйрену және білім қорын толықтыру ісінің өзі қызықтырады.\nОлар бастарынан сөз асырмайды. Шығармашыл адамдар алғыр ақылға ие, сондықтан олар әңгімені тез меңгеріп алады. Олар жинақталған білім мен идеяларды оңды қолданып, қажетті көзқарасты қорғай алады.\nОй-талқыларға шығармашылық түрде қатысу. Мәселелерге әртүрлі қырынан қарау және күтпеген шешімдерді табу – бұл тұлғаларға ерекше рахат күй сыйлайды. Олар әртүрлі ақпараттардан құрастырылған жүйені жұмыс істету үшін өздерінің барлық білімдерін және заттарға ашық көзқарастарын шеберлікпен біріктіре алады.\nХаризма және тапқырлық. Олар орнымен сөйлей біледі және сөйлегенді жақсы көреді. Олар өздерінің білімі мен икемді ақыл-ойына сүйене отырып, кез-келген әңгімені бар ынтасымен қолдай алады.',strengths_ru:'Склонность к знаниям. Чем больше информации знает эта творческая личность, тем увереннее он будет. Поэтому люди этого типа не упускают возможности узнать что-то новое. Даже если они никогда им не воспользуются, они заинтересованы в обучении и расширении своей базы знаний.\nОни знают себе цену. Творческие люди обладают быстрым умом, поэтому могут быстро усвоить разговор или историю. Они умеют использовать накопленные знания и идеи в хорошем ключе и отстаивать нужную точку зрения.\nТворческое участие в дискуссиях. Рассматривать проблемы под разными углами и находить неожиданные решения доставляет этим людям особое удовольствие. Они могут умело объединить все свои знания и широту взглядов, чтобы заставить систему работать на основе различной информации.\nХаризма и остроумие. Они умеют говорить уместно и любят говорить. Благодаря своим знаниям и гибкому уму они могут с энтузиазмом поддержать любую беседу.',

    desc_ru:"Вы расчётливая личность, нацеленная на результат. Любите организовывать людей и ресурсы для достижения целей.",
    desc_kz:"Сіз нәтижеге бағытталған тұлғасыз. Адамдар мен ресурстарды ұйымдастырып, мақсатқа жетуді жақсы көресіз.",
    extra_kz:"Сіз тапсырмаларды орындау және мақсаттарға жету үшін өзіңізден және айналаңыздағы адамдардан тек жақсы нәтижені талап ететін мақсатты түрде есептейтін адамсыз. Сізге жауапкершілікті өз мойныңызға алу және ресурстарды ұйымдастыру ұнайды. Жиі көшбасшылық позицияларға ұмтыласыз. Аналитикалық және объективті ойлайсыз, интеллектуалды пікірталасты ұнатасыз, сонымен қатар талапшылсыз.",
    extra_ru:"",
    strengths_kz:'Күші және ішкі тірегі. Істері дұрыс жүрмегенде ешқашан мойымайды. Олар қиындықтардан қорықпайды. Керісінше, оларды өсу мүмкіндігі ретінде қабылдап, мақсатқа жету жолындағы барлық кедергілерді қуана жеңеді.\nӨзіне сенімі. Олар әрқашан өздеріне сенімді, өздерінің күшті жақтарына, көшбасшылық қабілеттеріне және кез келген тапсырманы жеңе алатынына шын жүректен сенеді.\nТиімділік. Олардың сөздік қорында «жалқаулық, қасақана, қисынсыз» деген сөздер жоқ. Олар үшін ешқандай пайдасы жоқ, мақсатқа жеткізбейтін бос әрекеттерге күш жұмсамау маңызды.\nСтратегиялық ойлау. Олар барлық алдағы істерді елестете алады, осылайша мақсатқа жеткізер ең қолайлы бағытты құрады. Сонымен қатар, олар әр кезеңді тексеріп, жобаны алға жылжыту үшін туындаған мәселелерді тез шешеді.\nХаризма, беделділік. Бұл типтегі адамдар шабыттандырып, жігерлендіріп, ортақ мақсатқа жетелей алады. Оларға сенім артады, олардан күш-қуат алып, жігерленеді, соңынан ереді, ал бұл жалғыз өзі қол жеткізе алмайтын өршіл мақсаттарға жетуге көмектеседі.',strengths_ru:'Сила и внутренняя опора. Они никогда не унывают, когда что-то идет не так. Они не боятся трудностей. Напротив, они воспринимают их как возможность для роста и с радостью преодолевают все препятствия на пути к цели.\nУверенность в себе. Они всегда уверены в себе, искренне верят в свои силы, лидерские способности и возможность преодолеть любую задачу.\nЭффективность. Слов «лень, умышленно, иррациональность» нет в их лексиконе. Им важно не тратить силы на бесполезные занятия, не приносящие никакой пользы.\nСтратегическое мышление. Они могут представить себе все предстоящие дела, тем самым создавая наиболее подходящий путь к цели. Кроме того, они проверяют каждый этап и быстро решают возникающие проблемы для продвижения проекта вперед.\nХаризма, авторитет. Люди этого типа способны вдохновлять, воодушевлять и вести к общей цели. Им доверяют, черпают из них силы, поощряют их, следует за ними, и это помогает личностям такого типа достичь амбициозных целей, которых нельзя достичь в одиночку.',

    desc_kz:"Сіз қамқорлық пен шабыт беретін адамсыз. Әлемді жақсартуға ұмтыласыз, өз құндылықтарыңызға адалсыз.",
    extra_kz:"Сіз сабырлы, қамқор және әлемді жақсартуға ұмтылатын шабыттандырушысыз. Бірқатар негізгі құндылықтарды ұстанасыз, сыртқы және ішкі жан үйлесімділігін табуға тырысасыз. Нәтижесінде сіз өзінің мансабында, қарым-қатынасында және жұмысында идеалист болып көрінесіз.",
    extra_ru:"Спокойный, заботливый и вдохновляющий характер, стремящийся сделать мир лучше. Приверженность ряду ключевых ценностей направляет к поиску гармонии во внешней и внутренней жизни. Будучи идеалистом в карьере, отношениях и работе, этот тип личности обладает глубоким пониманием того, что движет окружающими, благодаря чему по своей природе вдохновляет и мотивирует людей.",
    strengths_kz:'Мықты тұстары.\nШығармашылық пен құмарлық. Олардың ақыл-ойы стандартқа сай емес ойлардың, идеялардың және армандардың сарқылмас қайнар көзі. Сондықтан олар көбінесе шығармашылық арқылы өзін-өзі танытады және өз дүниелерінің сұлулығын адамдармен ықыласпен бөліседі.\nЖомарттық. Олар басқалардың есебінен жетістікке жетуді ұнатуы өте сирек. Идеологтарға айналадағы өмірді әдемі еткісі келетіндер жатады. Айналадағы адамдарды қолдауға және жалпы әлемді жақсартуға өз үлесін қосу қажеттілігін сезінеді.\nТөзімділік. Жаңа нәрселерге ашық және басқалардың пікірлерін оңай қабылдайды. Олар қателіктер мен айыптауларды іздеуден гөрі жанашырлық пен төзімділік танытуды қалайды.\nЭмпатия және адал ниеттілік. Бұл тұлғалар басқа адамдардың эмоцияларын жақсы сезінеді және әрқашан қамқорлық көрсетуге тырысады. Тіпті біреуге зиян тигіземін деген ойдың өзі оларға ауыр.\nИдеалист. Олар өздеріне ыңғайсыз болса да, ар-ұжданына сай әрекет етуге тырысады. Олар үшін бастысы - айналасындағы әлемді жақсарту үшін саналы және мақсатты болу.',strengths_ru:'Творчество и страсть. Их ум – неиссякаемый источник нестандартных мыслей, идей и мечтаний. Поэтому они часто выражают себя через творчество и охотно делятся с людьми красотой своего мира.\nЩедрость. Им редко нравится добиваться успеха за счет других. Идеологи – это те, кто хочет сделать жизнь вокруг себя красивой. Чувствуют необходимость внести свой вклад в поддержку людей вокруг и улучшение мира в целом.\nГибкость. Открыт ко всему новому и с готовностью принимает мнение других. Они предпочитают проявлять сострадание и терпимость, а не искать недостатки и вину.\nЭмпатия и честные намерения. Эти личности чувствительны к эмоциям других людей и всегда стараются проявить заботу. Даже мысль о причинении вреда кому-то ранит их.\nИдеалист. Они стараются поступать по совести, даже если им это неудобно. Для них главное – быть осознанными и целеустремленными для улучшения окружающего мира.',

    traits:[{en:"INTROVERSION",ru:"Интроверсия",kz:"Интроверт",sub_ru:"Заряжаетесь в уединении",sub_kz:"Сіз жеке өмірде қуат аласыз."},{en:"INTUITION",ru:"Интуитивный",kz:"Интуитивті",sub_ru:"Теории и грандиозные идеи",sub_kz:"Сізге мүмкіндіктер, теориялар, жаңа идеялар ұнайды."},{en:"FEELING",ru:"Чувствующий",kz:"Сезімтал",sub_ru:"Решения на основе ценностей",sub_kz:"Сіз құндылықтар мен адамдарға бағытталған шешімдер қабылдайсыз."},{en:"JUDGING",ru:"Планирующий",kz:"Жоспарлаушы",sub_ru:"Организованны и планируете",sub_kz:"Сіз ұйымшылсыз, белгілі бір кестені ұстанғанды қалайсыз."}],
    desc_ru:"Вы проницательный человек, понимающий сложность взаимоотношений. Желаете посвятить себя делу, которое важно.",
    desc_kz:"Сіз тереңнен ойлайтын адамсыз, қарым-қатынастың күрделілігін түсінесіз. Өзіңізге маңызды іске адал боласыз.",
    extra_kz:"Сіз қарым-қатынастың күрделілігін және адамдардың мінез-құлық ерекшеліктерін түсінетін көреген және жарқын адамсыз. Сіздің іс-әрекетіңіз әлемді жақсартқанын шын жүректен қалайсыз. Сіз адамдардың әлеуетін көтермелеп, дамытқыңыз келеді.",
    extra_ru:"",
    strengths_kz:'Мақсаттылық. Таңдаған іске деген құштарлық олардың жеке басының негізі. Белгілі бір мақсат пен ұзақ мерзімді стратегия болса, олардың мақсатқа қарай ұмтылысын тоқтату құр бекер.\nАдал ниеттілік. Олар басқалардың есебінен табысқа жетуге ұмтылмайды және жалпыға ортақ игілік жолында жеке пайданы көздемейді.\nЖақсы кеңесшілер. Басқалардың мәселелерінің шешімін табуға жан тәнімен кіріседі. Олардың жанашырлық сезімі қатты дамыған және жарқын қиялға ие, бұл оларға үлкен пайда келтіруге және керемет нәтижелерге қол жеткізуге көмектеседі.\nАлғырлық. Олар заттардың түпкі мәнін көре алады, сондықтан олар адамдардың сезімдері мен қажеттіліктерін жақсы түсінеді.\nАдалдық және өзіне деген сенімділік. Олар өз пікірлеріне нық сенеді және оларды басқаларға таратады. Аудиторияны өз идеализммен шабыттандыра алатын жақсы спикерлер.',strengths_ru:'Целеустремленность. Страсть к выбранному делу – основа их личности. Если есть конкретная цель и долгосрочная стратегия, останавливать их стремление на пути к цели бессмысленно.\nБлагие намерения. Они не стремятся добиться успеха за счет других и не ставят личную выгоду выше общего блага.\nХорошие советчики. Они со всей душой пытаются найти решение проблем других людей. У них сильно развито чувство сопереживания и яркое воображение, которое помогает им приносить большую пользу и достигать отличных результатов.\nХваткость. Они видят суть вещей, поэтому хорошо понимают чувства и потребности людей.\nЧестность и уверенность в себе. Они твердо верят в свое мнение и распространяют его для других. Они хорошие ораторы, способные вдохновить аудиторию своим идеализмом.',

    desc_ru:"Вы энергичный человек, полный энтузиазма. Воспринимаете жизнь как приключение и остро чувствуете людей.",
    desc_kz:"Сіз қуатты, ынталы адамсыз. Өмірді шытырман оқиға ретінде қабылдайсыз, адамдарды терең сезінесіз.",
    extra_kz:"Сіз өмірді қызықты мүмкіндіктерге толы шытырман оқиға деп қабылдайсыз. Жігерлі, ынта мен шабытқа толы ақылды және болашағы зор адамсыз. Адамдардың қалай ойлайтынын анық сезесіз және олардың мүдделері, қажеттіліктері мен тілектерін жиі оңай анықтайсыз. Сіз өзіңізді жиі көшбасшы болып жүретін және өзіңіз сенетін іске айналаңыздағы адамдарды жинай аласыз.",
    extra_ru:"Восприятие жизни как захватывающего приключения, насыщенного возможностями – главная черта этого типа личности. Энергичность, энтузиазм и вдохновение позволяют легко находить общий язык с людьми. Проницательность и перспективное мышление помогают остро чувствовать чужие интересы, потребности и желания. Способность сплотить людей вокруг идеи, в которую есть вера, часто выводит представителей этого типа в лидеры движений.",
    strengths_kz:'Байқампаз және қиялшыл. Бұл тұлғалар әрбір бөлшекке дейін мән беріп, бәрі кездейсоқ емес деп санайды. Әрбір әрекет, әрбір көңіл-күй үлкен жүйенің бөлігі деп, олар ештеңені назардан тыс қалдырмауға тырысады.\nӘуесқойлық. Олар жаңа сезімдерді сезінуі, бұл жайлы айтылғандардан да күшті. Сондықтан, бұл үшін жайлылық аймағыңнан шығу керек болса да, мұндай мүмкіндік туа қалса, оны бірден пайдаланады.\nДосқа адалдық пен қарым-қатынас. Олар кез келген адаммен тіл табыса алады. Әрқашан адамның жағдайын түсінуге дайын тұрады.\nҚайраттылық мен ынталылық. Энтузиасттар қарым-қатынасқа қатты мән береді және өз идеяларын басқалармен жасырмай бөліседі. Бұл оларға жаңа таныстар тауып, олардың тәжірибелері мен пікірлерін тыңдап, кері байланыс алуға мүмкіндік береді.',strengths_ru:'Наблюдательный и мечтательный. Эти личности обращают внимание на каждую деталь и верят, что все не случайно. Они полагают, что каждое действие, каждое настроение – часть большой системы и стараются ничего не упускать из виду.\nУвлеченность. Тот факт, как они испытывают новые чувства, сильнее того, что они об этом говорят. Поэтому, даже если для этого им придется выйти из зоны комфорта, если появится такая возможность, они немедленно ею воспользуются.\nВерное отношение к другу. Они могут ужиться с кем угодно. Они всегда готовы понять ситуацию человека.\nСмелость и энтузиазм. Энтузиасты ценят общение и открыто делятся своими идеями с другими. Это позволяет им знакомиться с новыми людьми, узнавать их опыт и мнения, а также получать обратную связь.',

    desc_kz:"Сіз адамдардың қажеттіліктерін тереңінен сезінесіз, тамаша тәлімгер боласыз.",
    extra_kz:"Сіз адамдарды шабыттандыруға қабілетті, туа біткен көшбасшы және дипломатсыз. Адамдардың эмоциялық күйін тез сезіп, олардың әлеуетін ашуға бағытталған орта құруға ұмтыласыз. Ортақ мақсат жолында адамдарды біріктіру — сіздің басты қасиетіңіз. Жауапкершілікті сезінесіз және айналаңыздағылардың дамуына шынайы ниетпен қолдау көрсетесіз.",
    extra_ru:"Вы чутко улавливаете мысли, побуждения и потребности людей. Вы пользуетесь знаниями, поощряя и пробуждая в них лучшее. Зачастую воспринимая не только сказанное, вы становитесь хорошим советчиком. Вы четко осознаете, что важно и для вас, поэтому без колебаний выскажете свою личную позицию.",
    strengths_kz:'Сенімділік. Осы типтегі адамдарға сенуге болады. Олар істі соңына дейін жеткізіп, ешкімнің көңілін қалдырмау үшін қолдан келгеннің бәрін жасайды.\nХаризма және сүйкімділік. Көпшіліктің сүйіктілері. Олар аудиторияны қалай қызықтыратынын біледі және олардың көңіл-күйлерін реттей отырып, өзінің мәнеріне әкеледі.\nКөшбасшылық. Туа біткен қатынас құру дағдылары мен алғыр ақыл-ой оларға басшылық лауазымдарды атқаруға және пікірлес адамдар мен олардың жанкүйерлеріне жетекшілік етуге мүмкіндік береді.\nАльтруизм. Мұндай адамдар көбінесе жақсылық жасауға ұмтылып тұрады. Олар адамдарды бір араға жинап та әлемді жақсартуға болатынына сенеді.\nТөзімділік. Бұл тұлғалар - әр жағдайды байсалды бағалайтын және сұрақтарға жауап болмаған кезде адал мойындайтын командалық ойыншылар. Сондықтан басқа адамдардың пікірімен келіспесе де, оларды тыңдай алады.',strengths_ru:'Уверенность. Вы можете доверять таким людям. Они сделают все возможное, чтобы довести дело до конца и никого не подвести.\nХаризма и обаяние. Любимец большинства. Они умеют вовлекать аудиторию и передавать ей свое настроение, настраивая их чувства и ощущения.\nЛидерство. Врожденные коммуникативные навыки и острый ум позволяют им занимать лидерские позиции и вести за собой единомышленников и своих поклонников.\nАльтруизм. Такие люди часто стремятся делать добро. Они верят, что объединение людей может сделать мир лучше.\nВыносливость. Эти личности – командные игроки, которые спокойно оценивают любую ситуацию и честно признаются, когда на вопросы нет ответов. Поэтому, даже если они не согласны с мнением других людей, могут их выслушать.',

    traits:[{en:"INTROVERSION",ru:"Интроверсия",kz:"Интроверт",sub_ru:"Заряжаетесь в уединении",sub_kz:"Сіз жеке өмірде қуат аласыз."},{en:"SENSING",ru:"Сенсорик",kz:"Сенсорик",sub_ru:"Практичность и реализм",sub_kz:"Сіз тәжірибелі және саналы көзқараспен ерекшеленесіз."},{en:"THINKING",ru:"Мыслящий",kz:"Ойшыл",sub_ru:"Логичные решения",sub_kz:"Сіз логикалық және объективті шешімдер қабылдайсыз."},{en:"PERCEIVING",ru:"Ищущий",kz:"Ізденістегі адам",sub_ru:"Спонтанны и открыты",sub_kz:"Сіз жаңа мүмкіндіктерге қол созасыз."}],
    desc_ru:"Вы молчаливый наблюдатель, верящий в эффективность. Любите решать проблемы на ходу. Гибкий и приспосабливающийся.",
    desc_kz:"Сіз тыңдайтын бақылаушысыз, тиімділікке сенесіз. Мәселелерді тез шешуді ұнатасыз. Икемді адамсыз.",
    extra_kz:"Сіз күш-жігердің тиімділігіне сенетін үнсіз бақылаушысыз. Мәселелерді шешуді ұнатасыз және ең аз күш жұмсау әдісі арқылы көп жұмысты тиімді бітіруді ұнатасыз. Икемді және бейімделгішсіз, өзгерістер мен дағдарыстарды оңай жеңе алатын адамсыз. Дәстүрлі саясаттар мен процедуралар сізге ұнамайды және сіз тиімділікке қол жеткізу үшін оларды айналып өтуге тырысасыз.",
    extra_ru:"Молчаливый наблюдатель, верящий в эффективность усилий. Умение решать проблемы «на ходу» при минимальных затратах ресурсов – сильная сторона этого типа. Гибкость и легкость в адаптации к изменениям и кризисным ситуациям позволяют обходить традиционные процедуры, мешающие достижению поставленных целей.",
    strengths_kz:'Қайраттылық. Көңілді және ынталы осы типтегі тұлғалар қызықты жобаларға көп ойланбастан белсенді кірісіп, жандарын салады.\nОптимизм. Олар бүгінмен өмір сүреді және өмірден бәрін кейін емес, дәл қазір алуға тырысады.\nШығармашыл. Механика мен инженерлік жүйелерге қатысты мәселе болса, сарапшыларда сирек тапқырлық оянады. Жаңа идеялар оларға жүйелі түрде келіп, оны ынтамен жүзеге асырады.\nЛогика және икемділік. Сарапшылар бұл қасиеттерді өте икемді біріктіре алады, бұл жаңа жағдайға тез бейімделуге көмектеседі.\nҚауіпті жағдайларда төзімділік. Қолмен жұмыс істеуге, механизмге және күрделі инженерлік құрылымдарға деген сүйіспеншілігіне байланысты бұл типтегі адамдарға кейде физикалық қауіп бар. Олар мұны түсінеді және оны табиғи тәртіп ретінде қабылдайды, сондықтан олар жағдайды тез бақылауға алады.',strengths_ru:'Храбрость. Веселые и увлеченные личности этого типа активно, не задумываясь, занимаются интересными проектами и вкладывают в них душу.\nОптимизм. Они живут настоящим и стараются получить от жизни все прямо сейчас, а не потом.\nКреативность. Когда дело касается механики и инженерных систем, эксперты проявляют редкую изобретательность. К ним регулярно приходят новые идеи, и они с энтузиазмом их реализуют.\nЛогика и гибкость. Эксперты могут очень гибко сочетать эти качества, что помогает быстро адаптироваться к новой ситуации.\nВыносливость к опасным ситуациям. Из-за любви к ручному труду, машинам и сложным инженерным сооружениям этот тип людей иногда бывает физически уязвим. Они это понимают и принимают как естественный порядок вещей, поэтому быстро берут ситуацию под контроль.',

    traits:[{en:"INTROVERSION",ru:"Интроверсия",kz:"Интроверт",sub_ru:"Заряжаетесь в уединении",sub_kz:"Сіз жеке өмірде қуат аласыз."},{en:"SENSING",ru:"Сенсорик",kz:"Сенсорик",sub_ru:"Практичность и реализм",sub_kz:"Сіз тәжірибелі және саналы көзқараспен ерекшеленесіз."},{en:"FEELING",ru:"Чувствующий",kz:"Сезімтал",sub_ru:"Решения на основе ценностей",sub_kz:"Сіз құндылықтар мен адамдарға бағытталған шешімдер қабылдайсыз."},{en:"PERCEIVING",ru:"Ищущий",kz:"Ізденістегі адам",sub_ru:"Спонтанны и открыты",sub_kz:"Сіз жаңа мүмкіндіктерге қол созасыз."}],
    desc_ru:"Вы чуткий и добрый человек, наслаждающийся настоящим моментом. Скромны и избегаете лишнего внимания.",
    desc_kz:"Сіз сезімтал және мейірімді адамсыз, қазіргі сәтті бағалайсыз. Кішіпейілсіз.",
    extra_kz:"Сіз қазіргі уақытта өмірден ләззат алатын жанашыр, мұқият, мейірімді жансыз. Кішіпейілсіз, жиі қатты назардан аулақ болғыңыз келеді. Адамдардың бойынан көріне бермейтін қасиеттерді байқайтын үнсіз жансыз. Сіз бостандыққа терең ұмтыласыз және де сізге тәуелсіздікке кедергі келтіретін барлық қиындықтардан арылу үшін қолыңыздан келгенді жасайсыз.",
    extra_ru:"Чуткость, внимательность, доброта и умение наслаждаться жизнью в настоящем моменте – ключевые черты этого типа личности. Скромность часто побуждает избегать лишнего внимания, превращая в молчаливого наблюдателя, который замечает в людях многое из того, что скрыто от других. Глубокое стремление к свободе заставляет делать все возможное, чтобы освободиться от факторов, ограничивающих независимость.",
    strengths_kz:'Табиғи сүйкімділік. Жеке тұлғаның бұл типіндегі адамдар еркін, мейірімді және өз ұстанымдарын біреуге мойындатуға бейім емес. Бұл қасиеттердің үйлесімі оларды тартымды және басқалардың көз алдында қызықты тұлға ете түседі.\nСезімталдық. Адамдардың сезімдерін жақсы түсінеді және осы қасиетін қарым-қатынаста тепе-теңдікті сақтау және ренішті азайту үшін пайдаланады.\nАйналасындағылардың эмоциялары мен сезімдерін олар шығармашылығында сәтті пайдаланады, адамдардың жүректеріне жол тауып, идеяларын іске асырады. Бір нәрсеге қызықса оған бар жанын салады, қалған әлем олар үшін сол сәтте мүлде жоқ сияқты.\nҚызығушылық пен жаңа ой. Қандай да бір мақсатты жүзеге асырмас бұрын, олар шынымен де жарқын нәтиже шығатынына көз жеткізеді. Өзінің қандай да бір нәрсеге шығармашылық көзқарасының арқасында осы типтегі адамдар басқалар көре алмайтын жолын көре алады және жобаны алға жылжытатын идеяларды ұсына алады.\nШығармашылық және өзін-өзі көрсету. Кез-келген істі таңғажайып әдемі ету үшін олар бар жанын салады. Бұл сахнада ойнау ма, мәтін құру ма немесе статистикалық диаграммалар сызу ма, маңызды емес.',strengths_ru:'Природное очарование. Люди этого типа личности свободны, дружелюбны и не склонны к навязыванию своей позиции кому-либо. Сочетание этих качеств делает их привлекательными и интересными в глазах окружающих.\nЧувствительность. Хорошо понимает чувства людей и использует это качество для поддержания баланса в отношениях и уменьшения обид. Они успешно используют в своем творчестве эмоции и чувства окружающих, находят путь к сердцам людей и реализуют свои идеи. Когда их что-то интересует, они вкладывают в это всю свою душу, и всего остального мира для них в этот момент словно не существует.\nЛюбопытство и новое мышление. Прежде чем реализовать какую-либо цель, они убеждаются, что будет действительно яркий результат. Благодаря своему творческому подходу ко всему, этот тип людей может видеть то, что не видят другие, и предлагать идеи, которые продвигают проект вперед.\nТворчество и самовыражение. Они вкладывают всю душу, чтобы сделать любую работу потрясающе красивой. Неважно, играет ли он на сцене, создает текст или чертит статистические диаграммы.',

    extra_kz:"Сіз қазіргі уақытпен өмір сүретін, ойын-сауықты сүйетін, жігерлі адамсыз. Жұмыста да, жұмыстан тыс уақытта да уақытты жақсы өткізгенді ұнатасыз. Көңілді мінезіңіз сізді әріптестеріңіздің арасында ерекше қылып көрсетеді. Икемді және оңай бейімделгіш бола тұра, сіз өзіңізді шектемейтін ережедегі рөлдерді қалайсыз. Процестерді жетілдіру туралы және барлығын қалай тиімдірек жасауға болатыны туралы жиі ойланасыз.",
    extra_ru:"Веселый, энергичный и непринужденный характер позволяет жить настоящим моментом. Умение хорошо проводить время, даже в рабочей обстановке, делает этот тип привлекательным среди коллег. Гибкость и легкость в адаптации помогают избегать ограничений, накладываемых жесткими правилами. Постоянный поиск путей совершенствования процессов и стремление к повышению эффективности – ключевые приоритеты.",
    strengths_kz:'Бірегейлік және энергияға толы болуы. Тәуекелді жақсы көретін және ұқыпты осы типтегі адамдар эксперименттерден қорықпайды және жақсы идеялар ұсынады немесе басқа ешкім ойламайтын шешімдер табады.\nҰтымдылық және ептілік. Кәсіпкерлер білімге құмар және философияға қызығушылық танытады. Мұнда олар жаңа идеялар іздеуге шабыт табады, кейінірек оларды қызықты жобаларда жүзеге асырады немесе қолданады.\nАлғырлық және байқампаздық. Олардың көздерінен ештеңе жасырын қалмайды. Тіпті тым кішкентай өзгерістерді байқайды және өз мақсаттары үшін немесе бизнес үшін пайдаланады.\nТурашылдық. Бизнесмендер нақты және іс бойынша сөйлескенді жөн көреді. Қажет емес жерлерде қиындату, алыстан орағыту - олардың стилі емес. Олар бәрін қалай бар солай қабылдайды.\nБейімділік. Олар өздерінің артықшылықтары мен мықты тұстарын қолдана алады, сондықтан тез сөйлесіп кетеді және өздерін сенімді сезінеді.\nБұл көбінесе оларды көшбасшы етеді, дегенмен бизнесмендер арнайы құрмет, атақ іздемейді.',strengths_ru:'Уникальность и полнота энергии. Любящие риск и осторожные люди этого типа не боятся экспериментов и придумывают хорошие идеи или находят решения, до которых еще никто не додумался.\nВыигрышность и ловкость. Предприниматели увлечены знаниями и интересуются философией. Здесь они находят вдохновение для поиска новых идей, которые впоследствии реализуют или используют их в интересных проектах.\nПредприимчивость и внимательность. Ничто не скрыто от их глаз. Даже самые незначительные изменения замечаются и используются в своих целях или для бизнеса.\nПрямолинейность. Бизнесмены предпочитают общаться четко и по делу. Устраивать сложности в простых делах, говорить намеками - не в их стиле. Они принимают положение дел как оно есть.\nРасположенность. Они умеют использовать свои преимущества и сильные стороны, поэтому быстро коммуницируют и чувствуют себя уверенно. Это часто делает их лидерами, хотя особых почестей и званий бизнесмены не ищут.',
    desc_ru:"Вы энергичный человек, живущий настоящим. Гибкий и легко адаптируемый, думаете о совершенствовании процессов.",
    desc_kz:"Сіз қуатты адамсыз, қазіргі сәтте өмір сүресіз. Икемді, процестерді жетілдіруді ойлайсыз.",

  ESFP:{name:"Artisan Entertainer",ru:"РАЗВЛЕКАТЕЛЬ",kz_name:"МОТИВАТОР",color:"#b8860b",
    traits:[{en:"EXTROVERSION",ru:"Экстраверсия",kz:"Экстраверсия",sub_ru:"Знакомитесь с новыми людьми",sub_kz:"Жаңа адамдармен танысасыз"},{en:"SENSING",ru:"Сенсорик",kz:"Сенсорик",sub_ru:"Практичность и реализм",sub_kz:"Сіз тәжірибелі және саналы көзқараспен ерекшеленесіз."},{en:"FEELING",ru:"Чувствующий",kz:"Сезімтал",sub_ru:"Решения на основе ценностей",sub_kz:"Сіз құндылықтар мен адамдарға бағытталған шешімдер қабылдайсыз."},{en:"PERCEIVING",ru:"Ищущий",kz:"Ізденістегі адам",sub_ru:"Спонтанны и открыты",sub_kz:"Сіз жаңа мүмкіндіктерге қол созасыз."}],
    desc_ru:"Вы жизнерадостный и энергичный человек, вносящий лёгкость во всё. Тактичны и чувствительны к нуждам других.",
    desc_kz:"Сіз көңілді және қуатты адамсыз, бәріне жеңілдік әкелесіз. Басқалардың қажеттілігін сезінесіз.",
    extra_kz:"Сіз ойын-сауықты сүйетін, көңілді және жігерлі адамсыз. Өмір беретін барлық нәрселерден ләззат ала отырып, сіз барлық істеріңізге жеңіл әрі көңілді қарайсыз. Сондай-ақ басқа адамдардың қажеттіліктеріне мейіріммен қарайсыз. Сондықтан сіз өз құрдастарыңыздың арасында жиі құрметке ие жансыз. Жұмыста шектеу болып көрінетін ережелерсіз, тек тәуелсіздік және еркіндіктен рахат аласыз.",
    extra_ru:"Вы – любящий веселье, жизнерадостный и энергичный человек. Желая насладиться всем, что дарит жизнь, вы привносите легкость и веселье во все, что делаете. Вы также тактичны, теплы и чувствительны к нуждам других людей. Поэтому вы зачастую пользуетесь популярностью среди своих сверстников. Вы наслаждаетесь независимостью и свободой в работе без правил, которые кажутся вам сковывающими.",
    strengths_kz:'Бірегейлігі. Олар көпшіліктен ерекшеленуді ұнатады және оны шебер, талғампаз және қайталанбас эстетикамен жасайды. Кез-келген шектеулер, кедергілер және іш пыстыратын ережелер ұнамайды.\nЭстетика және ойын-сауық. Олар ұйымдастыра алатын шоулар уақытша құбылыс немесе ойын емес. Бұл олардың шынайы өмірі. Олар өздерінің барлық таланттары мен дағдыларын мінез-құлқында, жеке іс-әрекеттерінде және сөздерінде көрсетеді.\nӨмірге деген махаббат. Сезімге келгенде ештеңеден бас тартпайды және жаңа нәрсені сезіну үшін жайлы өмірден оңай бас тартады. Ұқыптылық. Әлем сезіну, істеп көру және әрекет ету үшін жаралған.\nАдамдардың бұл типі «егер былай істегенде, қалай болар еді» деген тақырыпта ойланбайды. Олар жай барып, оны іс жүзінде тексереді.\nБақылаушылық. Осы жерде және дәл қазіргі сәтпен өмір сүруге деген ұмтылысының арқасында олар айналада болып жатқанның бәрін байқайды.\nКішкентай нәрселер, өзгерістер, нюанстар – ештеңе олардың көзінен тыс қалмайды.\nТіл табысу. Шоумендер адамдарды жақсы көреді және олардың ортасында мүмкіндігінше көп уақыт өткізуге тырысады. Тез тіл табысу, ерекше ақыл-ойы және нәзік әзілі оларды ортаның жарқын жұлдызына айналдырады.',strengths_ru:'Уникальность. Им нравится выделяться из толпы и делать это умело, элегантно и с неповторимой эстетикой. Любые ограничения, препятствия и скучные правила им не нравятся.\nЭстетика и развлечение. Шоу, которые они могут организовать, — это не временное явление и не игра. Это их настоящая жизнь. Все свои таланты и умения они проявляют в своем поведении, личных действиях и словах.\nЛюбовь к жизни. Они ни от чего не отказываются, когда дело касается чувств, и легко отказываются от комфортной жизни, чтобы испытать что-то новое. Бережность. Для них мир предназначен для того, чтобы его можно было чувствовать, пробовать и действовать. Этот тип людей не задумывается на тему «а что, если бы я сделал это». Они просто идут и проверяют это на практике.\nВнимательность. Благодаря своему желанию жить здесь и в настоящем моменте, они замечают все, что происходит вокруг них. Мелочи, изменения, нюансы – ничто не ускользает от их глаз.\nУмение находить общий язык. Шоумены любят людей и стараются как можно больше времени проводить в их окружении. Быстрая коммуникация, уникальный интеллект и мягкий юмор делают их душой компании.',

  ISTJ:{name:"Guardian Inspector",ru:"АДМИНИСТРАТОР",kz_name:"ӘКІМШІ",color:"#1a6b8a",
    traits:[{en:"INTROVERSION",ru:"Интроверсия",kz:"Интроверт",sub_ru:"Заряжаетесь в уединении",sub_kz:"Сіз жеке өмірде қуат аласыз."},{en:"SENSING",ru:"Сенсорик",kz:"Сенсорик",sub_ru:"Практичность и реализм",sub_kz:"Сіз тәжірибелі және саналы көзқараспен ерекшеленесіз."},{en:"THINKING",ru:"Мыслящий",kz:"Ойшыл",sub_ru:"Логичные решения",sub_kz:"Сіз логикалық және объективті шешімдер қабылдайсыз."},{en:"JUDGING",ru:"Планирующий",kz:"Жоспарлаушы",sub_ru:"Организованны и планируете",sub_kz:"Сіз ұйымшылсыз, белгілі бір кестені ұстанғанды қалайсыз."}],
    desc_ru:"Вы спокойны, ответственны и надёжны. Настойчивы в выполнении задач. Добросовестно выполняете обязанности.",
    desc_kz:"Сіз байсалды, жауапты және сенімдісіз. Міндеттерді адалдықпен орындайсыз.",
    extra_kz:"Сіз сабырлы, жауапты және сенімдісіз, фактілерге аса құрметпен қарайсыз. Тапсырмаларды орындау барысында табандысыз және барлық тапсырманың толық орындалуы үшін қолыңыздан келгенше тырысасыз. Әдетте сіз кез келген ұйымдасқан ұйымдарға тірек бола аласыз. Отбасыңызға және ұйымға адалсыз, өз міндеттеріңізді адал орындайтындықтан олар сізге сенім арта алады.",
    extra_ru:"",
    strengths_kz:'Жауапкершілікпенмақсаттылық. Егермұндайтиптегі адамдар бірдеңеге уәде берсе, олар қажетті нәтиже беру үшін бәрін жасайды. Өзгелердің алдындағы міндеттерін орындау олар үшін өмір мен өлім мәселесі.\nАдалдық пен турашылдық. Бұлар олардың жеке басының негізін құрайтын қасиеттер. Олар үшін нақты жағдайлар маңызды, сондықтан жасырын фактілер, уәде беретін өтірік пен шиеленіскен жайттар оларды қызықтырмайды. Мұның бәрін олар түп тамырымен жоюға тырысады. Басқаларға шағымдану әлсіздіктің көрінісі болып санайды және ешқашан өздері де шағымданбайды.\nСабырлылық және өзін-өзі ұстай білу. Барлық қиындықтарды табанды және мызғымай қарсы алады. Кез келген жағдайда логикалық және ұтымды шешімдер қабылдай алады. Сонымен бірге олар басқа адамдардың ойлары мен идеяларын тиімді деп санаған жағдайда, ескеріп те үлгереді. Олар нақты негізделген сынды сабырмен қабылдап, өз пікірлерін дәл осы ұстаныммен білдіреді.\nОлар барлық нәрседе тәртіп болғанын қалайды. Олар сәттілікке жеткізетін құрамдас бөліктердің бірі – не және қалай болатынын бәрі білетін сауатты ұйымдастыру деп санайды. Олар нәтижелерге тезірек жетуге және күтпеген сәтсіздіктерді болдырмайтын нақты нұсқауларды, сенімділікті және ережелерді бағалайды.\nЖан-жақтылық. Алғыр ақыл-ойының, фактілер мен білімге деген сүйіспеншілігінің арқасында олар мүлдем басқа мәселелердің шешімін және қиын жағдайлардан шығудың жолын оңай табады.',strengths_ru:'Ответственность и целеустремленность. Если люди этого типа что-то обещают, они сделают все, чтобы получить желаемый результат. Выполнение своих обязательств перед другими является для них вопросом жизни и смерти.\nЧестность и прямота. Именно эти качества составляют основу их личности. Для них важны реальные ситуации, поэтому их не интересуют скрытые факты, ложные обещания и напряженные ситуации. Все это они пытаются искоренить. Они считают жалобы других признаком слабости и никогда не жалуются сами.\nТерпеливость и самоконтроль. Все трудности преодолеваются упорством и решительностью. Эти люди способны принимать логичные и выигрышные решения в любой ситуации. При этом им удается учитывать мысли и идеи других людей, если они считают их полезными. Они спокойно воспринимают обоснованную критику и высказывают свое мнение в соответствии со своими принципами.\nОни хотят порядка во всем. Они считают, что одна из составляющих успеха – грамотная организация, где каждый знает, что и как делать. Они ценят четкие инструкции, определенность и правила, которые помогают им быстрее достичь результатов и избежать неожиданных неудач.\nРазносторонность. Благодаря быстрому уму, любви к фактам и знаниям они легко находят решения совершенно разных проблем и выход из сложных ситуаций.',

  ISFJ:{name:"Guardian Protector",ru:"ЗАЩИТНИК",kz_name:"ҚОРҒАУШЫ",color:"#1a6b8a",

    extra_kz:"Сіз әрқашан қолдаушы, сенімді, өз өміріңізде маңызды деп санайтын адамдарға адалсыз. Көбінесе басқа адамдардың қажеттіліктерін өз қажеттіліктеріңізден жоғары қоясыз, жақын адамдарыңыздың бар жағдайын қамтамасыз ету үшін қолыңыздан келгенді жасайсыз. Сенімді және жауапкершілігі мол бола отырып, кез-келген табысты ұйымның арқа сүйер тірегі болып табыласыз. Сіз кесте, мерзім және мәліметтер туралы жақсы білесіз.",
    extra_ru:"",
    strengths_kz:'Сенімділік пен жауапкершілік. Бұл типтегі адамдар бизнеске келгенде өте мұқият және ізденімпаз. Жұмысында нәтижеге жету үшін қажетті икемділікті таныта біледі. Олар бәрі жоғары деңгейде және одан да асып түскенін қалайды. Сондықтан олар көбінесе күткенді болжап, талап етілгеннен көп нәрсені жасайды.\nЕңбекқорлық пен құлшыныс. Олар жақсы қиялға, тапқырлыққа және сенімділікке ие. Алдарында жақсы мақсат тұрса, лайықты нәтижеге жетуде барлық күштерін салады. Олар идеяларға немесе өздері жұмыс істейтін компанияларға эмоционалды түрде берілуге бейім.\nМейірімділік және қолдау. Олар әрқашан өз білімдерімен, тәжірибелерімен бөлісуге және қажет болса адамдарға уақыт бөлуге дайын. Жанашырлық пен тілектестік сезімдерімен өздеріне жүгінген адамдарға қолдау көрсетуге және көмектесуге тырысады. Бұл жағдайда ешқандай айыптамай, түсінуді жөн көреді.\nТәжірибелік сезгіштік. Ұқыптылық пен шоғырлануды қажет ететін күнделікті істер және басқа да тапсырмаларды өте жақсы орындайды. Олар істерінде үйлесімділік пен қамқорлық көрсетеді, өйткені өз әрекеттерінің басқаларға қаншалықты пайдалы екенін біледі.',strengths_ru:'Уверенность и ответственность. Люди этого типа очень осторожны и любознательны, когда дело касается бизнеса. Они способны продемонстрировать необходимую гибкость для достижения результатов в своей работе. Они хотят, чтобы все было на высшем уровне и даже выше. Поэтому они часто предвосхищают ожидания и делают больше, чем требуется.\nТрудолюбие и усердие. У них хорошее воображение, остроумие и уверенность. Если перед ними стоит благая цель, они приложат все усилия для достижения достойного результата. Они, как правило, эмоционально привязаны к идеям или компаниям, в которых работают .\nДоброта и поддержка. Они всегда готовы поделиться своими знаниями, опытом и провести время с людьми, если это необходимо. Они стараются с чувством сострадания и желанием поддержать помочь людям, которые обращаются к ним. В этом случае он предпочитает разбираться, не предъявляя     extra_ru:"",
    strengths_kz:'Ерік-жігер. Бұл типтегілер өз принциптеріне сенімді және оларды соңына дейін қорғайтын болады.\nТапсырмаға толығымен берілу. Менеджерлер қиындықтардан қорықпайды. Істі аяғына дейін жеткізу – абыройлы іс. Олар алға қойған мақсатының дұрыс және пайдалы екеніне сенімді болса, оларға ештеңе кедергі болмайды.\nСенімділік пен адалдық. Бұл типтегі адамдар өз жұмысында әрқашан жауапкершілік, тұрақтылық танытып, қауіпсіздік қамтамасыз етеді. Олар бұл қасиеттерді ең маңызды деп санайды және егер уәде берген болса, әрқашан уәдесінде тұрады.\nТәртіп пен ережелерді бағалайды. Олар ретсіз жерден жүйе құра алады, ал болжау мүмкін емес жерде – сенімді, қауіпсіз жайлы орта орната алады.\nКеремет ұйымдастырушылар. Шындық пен белгіленген стандарттарға деген сүйіспеншілік менеджерлерді сенімді және дана көшбасшыларға айналдырады. Олар процеске қатысушылар арасында міндеттер мен жауапкершіліктерді әділ және объективті түрде бөледі, бұл жұмысты тиімді ұйымдастыруға көмектеседі.',strengths_ru:'Сила воли. Люди этого типа уверены в своих принципах и будут отстаивать их до конца.\nПолная отдача делу. Менеджеры не боятся трудностей. Довести дело до конца – почетное дело. Если они уверены, что их цель правильная и полезная, их ничто не остановит.\nУверенность и честность. Люди этого типа всегда проявляют ответственность, стабильность и уверенность в своей работе. Эти качества они считают самыми важными и если дают обещание, то всегда сдерживают свое обещание.\nЦенит дисциплину и правила. Они могут создать систему из хаоса и создать безопасную, надежную среду в непредсказуемом месте.\nОтличные организаторы. Любовь к истине и установленным стандартам делают менеджеров уверенными и мудрыми лидерами. Они справедливо и объективно распределяют задачи и ответственность между участниками процесса, что помогает эффективно организовать работу.',

    ru: [
      {name:'Менеджер',where:'Бизнес и корпорации: Головные офисы международных компаний и транснациональных корпораций.\nПроизводство: Руководящие органы (аппарат управления) заводов, фабрик и крупных строительных холдингов.\nГосударственный аппарат: Акиматы, министерства, ведомства и национальные государственные холдинги.',what:'Стратегическое управление (Топ-менеджер): Определение вектора развития компании, разработка масштабных стратегий и принятие ключевых управленческих решений.\nРегламентация процессов (Главный специалист, руководитель проекта): Мониторинг ежедневных темпов работы, внедрение стандартов и контроль операционной деятельности.\nКонтроль качества и рисков (Менеджер по качеству, риск-менеджер): Обеспечение соответствия продукта стандартам и предварительный расчет рисков для предотвращения убытков компании.\nУправление кадрами (HR-менеджер): Отбор сильных специалистов в команду, контроль трудовой дисциплины и обеспечение соблюдения корпоративных правил.\nФинансы и предпринимательство (Финансовый менеджер, предприниматель): Эффективное распределение бюджета, поиск путей увеличения прибыли и системное развитие частного бизнеса.'},
      {name:'Финансист',where:'Финансовые институты: Банки, страховые компании и инвестиционные фонды.\nПредприятия: Отделы экономики и планирования в частных фирмах и крупных организациях.\nГосударственный сектор: Финансовые управления государственных учреждений и ведомств.\nКонсалтинг: Инвестиционные центры, предоставляющие консультации физическим и юридическим лицам.',what:'Банковское и страховое дело (Специалист банковского дела): Управление кредитами и депозитами, либо расчет рисков и регулирование договоров в страховых компаниях.\nБухгалтерский учет и аудит (Бухгалтер): Ведение всей приходно-расходной документации, подготовка налоговой отчетности и контроль за соблюдением финансового законодательства.\nСтратегическое планирование (Сотрудник отдела планирования): Планирование будущего бюджета предприятия, расчет путей минимизации расходов и увеличения прибыли.\nАнализ рынка (Маркетолог-аналитик в крупных компаниях): Определение цен на товары, финансовый анализ рыночного спроса и повышение конкурентоспособности компании.\nИнвестиционное консультирование: Обоснование наиболее эффективных способов хранения или вложения средств в проекты на основе научных и фактических данных.'},
      {name:'Юрист',where:'Правоохранительная и судебная система: Суды, прокуратура, органы внутренних дел.\nГосударственный аппарат: Органы государственной власти, исполнительные и представительные органы (акиматы, маслихаты).\nБизнес и финансы: Государственные и частные предприятия, банки, страховые и аудиторские компании.\nПравовая помощь: Адвокатура и образовательные организации.',what:'Обеспечение правопорядка: Контроль за соблюдением законности и порядка, защита безопасности личности, общества и государства.\nПравоохранительная деятельность: Борьба с преступностью и правонарушениями, контроль за исполнением наказаний и проведение работы по правовому воспитанию в обществе.\nРазработка правовых норм: Участие в подготовке новых законопроектов и контроль за их правильной реализацией на практике.\nЗащита предпринимательства: Проверка законности контрактов в сфере бизнеса, правовое решение ситуаций в банковском и страховом секторах.\nАдвокатская и консультационная деятельность: Защита прав граждан в суде и предоставление профессиональных консультаций по правовым вопросам.'},
      {name:'Логист',where:'Транспортно-экспедиторские комплексы: Крупные логистические центры и международные грузоперевозки.\nПроизводственные предприятия: Машиностроительные заводы, ремонтные компании и промышленные объекты.\nТехнические службы: Инженерно-технические центры и предприятия по эксплуатации транспортной техники.\nНаучно-проектные центры: Проектно-конструкторские бюро и инженерные департаменты.',what:'Планирование и контроль движения: Составление графиков движения транспортных ресурсов и непрерывный мониторинг их работы.\nОптимизация маршрутов: Определение путей доставки грузов, поиск способов сокращения транспортных расходов и экономии времени.\nУскорение процессов: Контроль за тем, чтобы грузы не задерживались на складах или станциях, и максимальное ускорение процесса перевозки.\nВедение контрактов: Заключение выгодных соглашений с транспортными компаниями и партнерами.\nТехническое управление: Координация работы по технической готовности транспорта, его ремонту и эксплуатации (в роли инженера-механика).'},
      {name:'Дипломат',where:'Государственные и правительственные учреждения: Министерство иностранных дел, посольства и консульства.\nНеправительственные и частные предприятия: Компании и фонды, работающие с международными проектами и зарубежными инвестициями.',what:'Международное сотрудничество: Профессиональное консультирование по вопросам укрепления межгосударственных и межкорпоративных связей.\nГеополитический анализ: Участие в формировании внешней политики на основе глубокого анализа региональных и геополитических процессов.\nКоординация проектов: Сопровождение и контроль реализации международных экономических, социальных и политических программ.\nВедение переговоров: Заключение соглашений со строгим соблюдением дипломатического протокола для защиты интересов государства или компании.\nПредставительская деятельность: Установление партнерских отношений с иностранными делегациями и продвижение имиджа страны на мировой арене.'},
      {name:'Специалист в сфере образования',where:'Образовательные центры и академии: Частные учебные заведения, центры подготовки к тестированиям (и языковые школы.\nУниверситеты и колледжи: Административные департаменты, отделы профориентации и международного сотрудничества.\nМинистерство и управления образования: Государственные органы, курирующие образовательную политику и стандарты.\nEdTech-проекты: Онлайн-платформы и компании, разрабатывающие цифровые образовательные решения.',what:'Академическое управление: Организация и систематизация учебного процесса, разработка академических календарей и контроль нагрузки преподавателей.\nПрофориентология и консультирование: Помощь учащимся в выборе карьерного пути, анализ рынка образовательных грантов и содействие в поступлении в вузы.\nРазработка методических стандартов: Внедрение новых образовательных программ и контроль соответствия обучения государственным и международным стандартам.\nСтратегическое планирование (Директор центра/декан): Управление бюджетом образовательного учреждения, развитие инфраструктуры и масштабирование проектов.\nМониторинг качества образования: Проведение аттестаций, анализ успеваемости студентов и работа над повышением рейтинга учебного заведения.'},
    ],
    kz: [
      {name:'Басқарушы',where:'Бизнес пен корпорациялар: Халықаралық компаниялардың бас кеңселері.\nӨндіріс: Зауыттар мен құрылыс компанияларының басқармалары.\nМемлекеттік аппарат: Әкімдіктер, министрліктер мен мемлекеттік холдингтер.',what:'Стратегиялық басқару (Топ-менеджер): Компанияның бағытын анықтайды, үлкен жоспарлар құрады және басты шешімдерді қабылдайды.\nПроцестерді реттеу (Бас маман, жоба жетекшісі): Күнделікті жұмыс қарқынын қадағалайды.\nСапа мен тәуекелді бақылау (Сапа менеджері, риск-менеджер): Өнімнің стандартқа сай болуын және компанияның шығынға ұшырамауын алдын ала есептейді.\nКадрларды басқару (HR менеджер): Ұжымға мықты мамандарды іріктеп, олардың еңбек тәртібі мен компания ережелерін сақтауын қамтамасыз етеді.\nҚаржы мен кәсіпкерлік (Қаржы менеджері, кәсіпкер): Компанияның бюджетін тиімді жұмсап, табысты арттыру жолдарын қарастырады. Жеке кәсібін жүйелі түрде дамытады.'},
      {name:'Қаржыгер',where:'Қаржы институттары: Банктер, сақтандыру компаниялары және инвестициялық қорлар.\nКәсіпорындар: Жеке кәсіпорындар мен ірі ұйымдардың экономика және жоспарлау бөлімдері.\nМемлекеттік сектор: Мемлекеттік мекемелердің қаржылық басқармалары.\nКонсалтинг: Жеке және заңды тұлғаларға кеңес беретін инвестициялық орталықтар.',what:'Банк пен сақтандыру ісі (банктегі қаржы қызметкері): Несиелерді, депозиттерді басқару немесе сақтандыру компанияларында тәуекелдерді есептеп, келісімшарттарды реттеу.\nБухгалтерлік есеп және аудит (бухгалтер): Мекеменің барлық кіріс-шығыс құжаттарын жүргізу, салық есептілігін дайындау және қаржылық заңдылықтардың сақталуын қадағалау.\nСтратегиялық жоспарлау (жоспарлау бөлімінің қызметкері): Кәсіпорынның алдағы бюджетін жоспарлау, шығындарды қалай азайтып, табысты қалай арттыру керектігін есептеу.\nНарықты талдау (ірі ұйымдардағы маркетолог): Тауардың бағасын белгілеу, нарықтағы сұранысты қаржылық тұрғыдан талдау және компанияның бәсекеге қабілеттілігін арттыру.\nИнвестициялық кеңес беру: Қаржыны қайда сақтау немесе қай жобаға салу тиімді екенін ғылыми және нақты деректермен дәлелдеп, кеңес беру.'},
      {name:'Заңгер',where:'Құқық қорғау және сот жүйесі: Сот, прокуратура, ішкі істер органдары.\nМемлекеттік аппарат: Мемлекеттік билік, атқарушы және өкілетті органдар (әкімдіктер, мәслихаттар).\nБизнес және қаржы: Мемлекеттік және мемлекеттік емес кәсіпорындар, банктер, сақтандыру және аудиторлық компаниялар.\nҚұқықтық көмек: Адвокатура және білім беру ұйымдары.',what:'Құқықтық тәртіпті қамтамасыз ету: Заңдылық пен тәртіптің сақталуын қадағалау, жеке адамның, қоғам мен мемлекеттің қауіпсіздігін қорғау.\nҚұқық қорғау қызметі: Қылмыспен және құқық бұзушылықтармен күресу, кінәлілерге жазаның орындалуын бақылау және қоғамда құқықтық тәрбие жұмыстарын жүргізу.\nҚұқықтық нормаларды әзірлеу: Жаңа заң жобаларын дайындауға қатысу және олардың іс жүзінде дұрыс жүзеге асырылуын қадағалау.\nКәсіпкерлікті қорғау: Бизнес саласындағы келісімшарттардың заңдылығын тексеру, банк және сақтандырулардағы ситуацияларды құқықтық жолмен шешу.\nАдвокаттық және кеңес беру: Азаматтардың құқықтарын сотта қорғау және оларға құқықтық мәселелер бойынша кәсіби кеңес беру.'},
      {name:'Логист',where:'Көлік-экспедиторлық кешендер: Ірі логистикалық орталықтар мен жүк тасымалдау компаниялары.\nӨндірістік кәсіпорындар: Машина жасау зауыттары, жөндеу компаниялары мен өндіріс орындары.\nТехникалық қызметтер: Инженерлік-техникалық орталықтар мен көлік техникасын іске қосу кәсіпорындары.\nҒылыми-жобалау орталықтары: Жобалау-конструкторлық бюролар мен инженерлік бөлімдер.',what:'Қозғалысты жоспарлау және бақылау: Көлік ресурстарының жүру кестесін құру және олардың жұмыс барысын үздіксіз қадағалау.\nМаршрутты оңтайландыру: Жүктердің жеткізілу жолдарын анықтау, тасымал шығындарын азайту және уақытты үнемдеу амалдарын табу.\nПроцестерді жеделдету: Жүктердің қоймаларда немесе станцияларда тұрып қалмауын қадағалап, тасымалдау процесін барынша жылдамдату.\nКелісімшарттар жүргізу: Көлік компанияларымен және серіктестермен тиімді келісімдер жасасу.\nТехникалық басқару: Инженер-механик ретінде көлік техникасының жұмысқа дайындығын, оларды жөндеу және пайдалану жұмыстарын үйлестіру.'},
      {name:'Дипломат',where:'Мемлекеттік және үкіметтік мекемелер: Сыртқы істер министрлігі, елшіліктер мен консулдықтар.\nХалықаралық ұйымдар: Біріккен Ұлттар Ұйымы сияқты ірі құрылымдар.\nҮкіметтік емес және жеке кәсіпорындар: Халықаралық жобалармен жұмыс істейтін компаниялар.',what:'Халықаралық ынтымақтастық: Мемлекетаралық немесе компанияаралық байланыстарды нығайту бойынша кәсіби кеңестер беру.\nГеосаяси талдау: Аймақтану және геосаясат мәселелерін зерттей отырып, тиімді сыртқы саясатты қалыптастыруға қатысу.\nЖобаларды үйлестіру: Халықаралық деңгейдегі түрлі экономикалық, әлеуметтік және саяси жобалардың жүзеге асырылуын қадағалау.\nКеліссөздер жүргізу: Ресми хаттамаларды сақтай отырып, мемлекеттің немесе компанияның мүддесін қорғайтын келісімдер жасасу.\nӨкілдік қызмет: Шетелдік серіктестермен байланыс орнатып, елдің имиджін халықаралық деңгейде ілгерілету.'},
      {name:'Білім саласы маманы',where:'Мемлекеттік білім беру мекемелері: Мектептер, лицейлер, гимназиялар және балабақшалар (директор, оқу ісінің меңгерушісі қызметінде).\nЖоғары және кәсіби оқу орындары: Университеттер мен колледждер (декан, кафедра меңгерушісі немесе әкімшілік басқарушы).\nБасқару және бақылау органдары: Білім бөлімдері, басқармалар және білім сапасын бақылайтын мемлекеттік департаменттер.\nЖеке және халықаралық білім орталықтары: Халықаралық мектептер, академиялар және оқу курстарының менеджмент бөлімі.',what:'Оқу үдерісін ұйымдастыру: Оқу жоспарларын бекіту, білім беру стандарттарының сақталуын қадағалау және сабақ кестесін жүйелеу.\nКадрларды басқару: Оқытушылар құрамын іріктеу, олардың жұмыс сапасын тексеру және ұжымдағы еңбек тәртібін бақылау.\nСапаны бақылау: Оқушылар мен студенттердің білім деңгейін талдау, емтихандар мен тестілеулердің әділ өтуін қамтамасыз ету.\nДаму стратегиясын құру: Оқу орнының материалдық базасын жақсарту, жаңа технологияларды енгізу және білім сапасын арттыру жоспарларын жасау.\nӘдістемелік жұмыс: Оқулықтар мен бағдарламалардың сапасын сараптау және оқытудың ең тиімді әдістерін енгізу.'},
    ]

      {name:'Аналитик',where:'Финтех и Банки: Департаменты оценки рисков, кредитного скоринга и прогнозирования финансовых рынков. Маркетинговые и консалтинговые агентства: Центры исследования рыночных трендов и стратегического консультирования крупного бизнеса. IT-компании и ритейл: Отделы продуктовой аналитики и оптимизации продаж.',what:': Сбор и обработка данных: Аккумулирование информации из различных источников и приведение е е в удобный для анализа вид. Прогнозирование: Расчет будущих показателей компании с помощью математических моделей и алгоритмов. Поддержка принятия решений: Подготовка рекомендаций, основанных на конкретных данных, для снижения расходов и увеличения прибыли бизнеса. Сотрудник правоохранительных органов'},

      {name:'Инженер',where:'Өндіріс және зауыттар: Машина жасау, металлургия, тамақ өнеркәсібі немесе жеңіл өнеркәсіп кәсіпорындарында. Мұнай-газ және энергетика: Энергия көздерін өндіру, өңдеу және тасымалдаумен айналысатын ірі компанияларда. Құрылыс және инфрақұрылым: Ғимараттарды, көпірлерді және жолдарды жобалау мен салумен айналысатын бюроларда. IT және Робототехника: Автоматтандырылған жүйелерді, роботтарды және смарт-құрылғыларды жасап шығару орталықтарында.',what:'Техникалық қызмет көрсету: Қондырғылар мен машиналардың дұрыс жұмыс істеуін қадағалау, ақауларды анықтау және оларды жөндеу. Процестерді оңтайландыру: Өндіріс тиімділігін арттыру, шығындарды азайту және жаңа технологияларды енгізу. Есептеу және талдау: Құрылымдардың беріктігін, қауіпсіздігін және техникалық сипаттамаларын математикалық тұрғыдан есептеу. Сапаны бақылау: Дайын өнімнің немесе құрылыстың мемлекеттік стандарттарға және техникалық тала'},
      {name:'Логист',where:'Көлік-экспедиторлық компаниялар: Халықаралық және ішкі жүк тасымалымен (әуе, теміржол, авто, теңіз) айналысатын кәсіпорындарда. Қойма және дистрибьюторлық орталықтар: Ірі сауда желілері мен интернет-дүкендердің логистикалық хабтарында. Өндірістік кәсіпорындар: Зауыттар мен фабрикалардың шикізат жеткізу және дайын өнімді тарату бөлімдерінде. Кедендік брокерлік кеңселер: Тауарларды шекарадан өткізу және кедендік рәсімдеумен айналысатын мекемелерде.',what:'Маршруттарды жоспарлау: Жүкті жеткізудің ең жылдам әрі ең арзан жолдарын (оптималды схемаларын) құру. Тасымалды ұйымдастыру: Көлік иелерімен келіссөздер жүргізу, жүргізушілердің жұмысын үйлестіру және жүктің уақытылы жетуін бақылау. Құжаттамамен жұмыс: Жүк құжаттарын, келісімшарттарды және халықаралық тасымалға қажетті рұқсат қағаздарын рәсімдеу. Жеткізу тізбегін бақылау: Тауар өндірушіден соңғы тұтынушыға жеткенге дейінгі барлық процестің үзіліс'},
