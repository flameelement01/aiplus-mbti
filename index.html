    ru: [
      {name:'Предприниматель',where:'Собственный стартап или компания: Создание личного бизнеса в сфере производства, торговли, IT или услуг. Инвестиционная деятельность: Финансирование перспективных проектов и содействие их росту. Маркетплейсы и экосистемы: Управление собственным магазином на крупных торговых площадках. Франчайзинг: Развитие бизнеса по готовой модели известных мировых брендов.',what:': Стратегическое планирование: Разработка бизнес-плана, расчет финансовой модели и определение вектора развития компании. Формирование команды: Поиск сильных специалистов, их мотивация и объединение вокруг общей цели. Маркетинг и продажи: Продвижение продукта на рынке, выстраивание отношений с клиентами и поиск путей увеличения прибыли. Управление рисками: Оперативное принятие решений в условиях кризиса и адаптация бизнеса к переменчивым рыночным'},
      {name:'Профессиональный спортсмен',where:'Профессиональные спортивные клубы: Командные или индивидуальные клубы по футболу, баскетболу, хоккею, теннису и другим видам спорта. Национальные сборные: Защита чести страны на международной арене . Спортивные федерации: Участие в соревнованиях различного уровня и проектах по развитию массового спорта. Спортивный консалтинг и академии: Тренерская деятельность или амбассадорство после завершения активной карьеры.',what:': Регулярные тренировки: Постоянное совершенствование физической подготовки, выносливости и технического мастерства. Участие в соревнованиях: Выступление на турнирах и чемпионатах с целью достижения высоких результатов и установления рекордов. Стратегическая подготовка: Изучение тактики соперников и разработка плана победы совместно с тренерским штабом. Режим и восстановление: Строгое соблюдение графика питания, сна и процедур по восстановлению о'},
      {name:'Военнослужащий',where:'Пограничная служба: Подразделения по охране государственной границы и обеспечению безопасности рубежей. Национальная гвардия: Подразделения по охране общественного порядка и защите важных государственных объектов. Подразделения специального назначения: Элитные части, выполняющие особо сложные и опасные задания. Военное образование и наука: Преподавательская или научно-исследовательская деятельность в военных академиях и институтах.',what:': Боевая подготовка: Овладение оружием и техникой, проведение тактических учений и поддержание высокого уровня физической формы. Охрана безопасности страны: Несение боевого дежурства по защите суверенитета и территориальной целостности государства. Участие в чрезвычайных ситуациях: Помощь пострадавшим при природных или техногенных катастрофах и обеспечение безопасности в зонах ЧС. Исполнение устава: Соблюдение воинской дисциплины, выполнение прик'},
      {name:'Маркетолог',where:'Рекламные и PR-агентства: Центры по разработке креативных идей и рекламных кампаний для различных брендов. Международные бренды: Департаменты по адаптации глобальных маркетинговых стратегий под местный рынок. Фриланс и частный консалтинг: Оказание услуг по развитию бренда для индивидуальных предпринимателей и стартапов. E-commerce и ритейл: Управление продажами и продвижением товаров на онлайн-платформах и в торговых сетях.',what:': Исследование рынка: Анализ предпочтений потребителей, действий конкурентов и последних рыночных трендов. Рекламные кампании: Организация проектов по продвижению товаров в социальных сетях, поисковых системах или традиционных медиа. Анализ результатов: Проверка эффективности рекламы с помощью цифр (метрик) и контроль за целевым использованием бюджета.'},
      {name:'Менеджер проектов',where:'Технологические стартапы и IT: Департаменты по выводу инновационных продуктов на рынок с нуля. Международные консалтинговые агентства: Проекты по реструктуризации и стратегическому развитию крупных корпораций. Инвестиционные и финансовые группы: Проекты по открытию и расширению новых бизнес-направлений. Государственные стратегические реформы: Управление масштабными программами модернизации и национальными проектами развития.',what:': Стратегическое видение: Разработка дорожной карты проекта с учетом не только текущих результатов, но и его долгосрочного влияния на рынок. Мобилизация команды: Быстрое выявление сильных сторон сотрудников, их вовлечение и вдохновение на достижение амбициозных целей. Системная оптимизация: Поиск «узких мест» в бизнес-процессах и внедрение новых решений для повышения эффективности и скорости работы. Переговоры и влияние: Ведение переговоров на вы'},
      {name:'Логист',where:'Транспортно-экспедиторские комплексы: Крупные логистические центры и международные грузоперевозки. Производственные предприятия: Машиностроительные заводы, ремонтные компании и промышленные объекты. Технические службы: Инженерно-технические центры и предприятия по эксплуатации транспортной техники. Научно-проектные центры: Проектно-конструкторские бюро и инженерные департаменты.',what:'Планирование и контроль движения: Составление графиков движения транспортных ресурсов и непрерывный мониторинг их работы. Оптимизация маршрутов: Определение путей доставки грузов, поиск способов сокращения транспортных расходов и экономии времени. Ускорение процессов: Контроль за тем, чтобы грузы не задерживались на складах или станциях, и максимальное ускорение процесса перевозки. Ведение контрактов: Заключение выгодных соглашений с транспортным'},
    ],
    kz: [
      {name:'Кәсіпкер',where:'Өз стартабыңыз немесе компанияңыз: Өндіріс, сауда, IT немесе қызмет көрсету саласында жеке бизнесіңізді құру. Инвестициялық қызмет: Перспективалы жобаларды қаржыландырып, олардың өсуіне ықпал ету. Экосистемалар: Маркетплейстерде өз дүкеніңізді басқару.',what:'Стратегиялық жоспарлау: Бизнес-жоспар құру, қаржылық модельді есептеу және даму бағытын айқындау. Команда жинау: Мықты мамандарды тауып, оларды ортақ мақсатқа жұмылдыру және ынталандыру. Маркетинг және сату: Өнімді нарыққа таныту, клиенттермен қарым-қатынас орнату және табысты арттыру жолдарын іздеу. Тәуекелдерді басқару: Дағдарыс кезінде жедел шешім қабылдау және бизнесті өзгермелі жағдайларға бейімдеу.'},
      {name:'Кәсіби спортшы',where:'Кәсіби спорт клубтары: Футбол, баскетбол, хоккей және т.б. командалық немесе жеке клубтарда. Ұлттық құрамалар: Халықаралық аренада (Олимпиада, Әлем чемпионаттары) ел намысын қорғау. Спорттық федерациялар: Түрлі деңгейдегі жарыстарға қатысу және спортты дамыту жобаларында.',what:'Тұрақты жаттығулар: Күнделікті физикалық дайындықты және техникалық шеберлікті шыңдау. Жарыстарға қатысу: Турнирлерде, чемпионаттарда барын салып, жоғары нәтижелер мен рекордтарға қол жеткізу. Стратегиялық дайындық: Қарсыластардың тактикасын зерттеу және бапкермен бірге жеңіс жоспарын құру.'},
      {name:'Әскери қызметкер',where:'Қарулы Күштердің түрлері: Құрлық әскерлері, Әуе қорғанысы күштері немесе Әскери-теңіз күштерінде. Шекара қызметі: Мемлекеттік шекараны күзету және қауіпсіздікті қамтамасыз ету бөлімдерінде. Ұлттық ұлан: Қоғамдық тәртіпті сақтау және маңызды мемлекеттік нысандарды қорғау бөлімшелерінде. Арнайы мақсаттағы бөлімдер: Аса күрделі және қауіпті тапсырмаларды орындайтын элиталық бөлімшелерде. Әскери білім және ғылым: Әскери академиялар мен институттарда ',what:'Жауынгерлік дайындық: Қару-жарақты меңгеру, тактикалық жаттығулар өткізу және физикалық дайындықты жоғары деңгейде ұстау. Ел қауіпсіздігін күзету: Мемлекеттің егемендігі мен аумақтық тұтастығын қорғау бойынша жауынгерлік кезекшілікте тұру. Төтенше жағдайларға қатысу: Табиғи немесе техногендік апаттар кезінде зардап шеккендерге көмектесу және қауіпсіздікті қамтамасыз ету.'},
      {name:'Маркетолог',where:'Жарнама және PR агенттіктері: Көптеген брендтерге креативті идеялар мен жарнамалық науқандар дайындайтын орталықтарда. Халықаралық брендтер: Әлемдік деңгейдегі компаниялардың маркетингтік стратегиясын жергілікті нарыққа бейімдеу бөлімдерінде. Фриланс және жеке консалтинг: Жеке кәсіпкерлер мен стартаптарға брендті дамыту бойынша қызмет көрсету.',what:'Нарықты зерттеу: Тұтынушылардың талғамын, бәсекелестердің қадамдарын және нарықтағы соңғы трендтерді талдау. Брендті дамыту: Өнімнің имиджін қалыптастыру, логотиптен бастап компанияның сөйлеу мәнеріне дейін жоспарлау. Жарнамалық науқандар: Әлеуметтік желілерде (SMM), Google-да немесе дәстүрлі медиада тауарды таныту бойынша жобалар ұйымдастыру. Нәтижені талдау: Жарнаманың тиімділігін сандармен (метрикалармен) тексеру және бюджетті тиімді жұмсауды '},
      {name:'Жоба менеджері',where:'Технологиялық стартаптар мен IT: Инновациялық өнімдерді нөлден бастап нарыққа шығару бөлімдері. Халықаралық консалтингтік агенттіктер: Ірі компаниялардың жұмысын қайта құру және дамыту жобалары. Инвестициялық және қаржылық топтар: Жаңа бизнес-бағыттарды ашу және кеңейту жобалары. Мемлекеттік стратегиялық реформалар: Ел көлеміндегі ауқымды өзгерістер мен жаңғырту бағдарламаларын басқару.',what:'Стратегиялық көрініс: Жобаның тек бүгінгі нәтижесін емес, оның болашақтағы әсерін есептеп, стратегиялық жоспар құру. Команданы жұмылдыру: Әр адамның мықты тұсын тез байқап, оларды ортақ мақсатқа бағыттау және шабыттандыру. Жүйелі оңтайландыру: Баяу жұмыс істейтін процестерді тауып, оларды жылдам әрі тиімді ететін жаңа шешімдер енгізу. Келіссөздер мен билік: Тапсырыс берушілермен, серіктестермен жоғары деңгейде келіссөз жүргізіп, ең тиімді шарттар'},
      {name:'Логист',where:'Көлік-экспедиторлық компаниялар: Халықаралық және ішкі жүк тасымалымен (әуе, теміржол, авто, теңіз) айналысатын кәсіпорындарда. Қойма және дистрибьюторлық орталықтар: Ірі сауда желілері мен интернет-дүкендердің логистикалық хабтарында. Өндірістік кәсіпорындар: Зауыттар мен фабрикалардың шикізат жеткізу және дайын өнімді тарату бөлімдерінде. Кедендік брокерлік кеңселер: Тауарларды шекарадан өткізу және кедендік рәсімдеумен айналысатын мекемелерде.',what:'Маршруттарды жоспарлау: Жүкті жеткізудің ең жылдам әрі ең арзан жолдарын (оптималды схемаларын) құру. Тасымалды ұйымдастыру: Көлік иелерімен келіссөздер жүргізу, жүргізушілердің жұмысын үйлестіру және жүктің уақытылы жетуін бақылау. Құжаттамамен жұмыс: Жүк құжаттарын, келісімшарттарды және халықаралық тасымалға қажетті рұқсат қағаздарын рәсімдеу. Жеткізу тізбегін бақылау: Тауар өндірушіден соңғы тұтынушыға жеткенге дейінгі барлық процестің үзіліс'},
    ]
  },
  ISTP: {
    ru: [
      {name:'Инженер',where:'Производство и заводы: Предприятия машиностроения, металлургии, пищевой или легкой промышленности. Нефтегазовый сектор и энергетика: Крупные компании по добыче, переработке и транспортировке энергоносителей. Строительство и инфраструктура: Бюро по проектированию и возведению зданий, мостов и дорог. IT и Робототехника: Центры разработки автоматизированных систем, роботов и смарт-устройств.',what:': Техническое обслуживание: Контроль исправности оборудования и машин, выявление неисправностей и проведение ремонтных работ. Оптимизация процессов: Повышение эффективности производства, сокращение затрат и внедрение новых технологий. Расчеты и анализ: Математический расчет прочности, безопасности и технических характеристик конструкций. Контроль качества: Надзор за соответствием готовой продукции или строительства государственным стандартам и те'},
      {name:'Финансовый менеджер',where:'Корпоративный сектор: Финансовые департаменты крупных и средних компаний – от производственных заводов до IT-холдингов. Инвестиционные компании и фонды: Отделы управления капиталом, размещения активов и анализа портфельных инвестиций. Банки и кредитные организации: Оценка рисков, корпоративное кредитование и казначейство. Консалтинговые и аудиторские фирмы: Оказание услуг по финансовому моделированию и налоговой оптимизации для клиентов.',what:': Финансовое планирование и бюджетирование: Прогнозирование доходов и расходов компании, создание бюджетных моделей и контроль их исполнения. Инвестиционный анализ: Расчет эффективности новых проектов и обоснование целесообразности направления капитала. Финансовая отчетность и анализ: Подготовка управленческих отчетов на основе бухгалтерских данных для принятия стратегических решений. Управление ликвидностью: Контроль денежных потоков для обеспеч'},
      {name:'Дизайнер-проектировщик в строительстве',where:'Архитектурные и проектные бюро: Отделы разработки концепций жилых комплексов, общественных зданий и производственных объектов. Строительные компании: Сфера авторского надзора и подготовка проектно-сметной документации. Департаменты урбанистики и градостроительства: Учреждения по благоустройству городской среды, планированию парков и общественных пространств. Студии дизайна интерьера: Работа над масштабными проектами перепланировки и реконструкции',what:': Эскизное проектирование: Формирование общей идеи, стиля и композиционного решения объекта, предложение концепции согласно требованиям клиента. Разработка технических чертежей: Подготовка архитектурных планов, разрезов и схем инженерных сетей в профессиональных программах . Подбор материалов и технологий: Выбор оптимальных решений с учетом технических характеристик (прочность, теплоизоляция, экологичность) материалов. Авторский надзор: Контроль '},

      {name:'Специалист в сфере медицины',where:'Государственные и частные поликлиники и больницы: Терапевтические, педиатрические отделения и службы скорой помощи.\nДиагностические центры: Прием пациентов, проведение консультаций и первичных обследований.\nРеабилитационные центры: Учреждения для восстановления пациентов после операций или длительных заболеваний.\nСанатории и медицинские пункты: Пункты оказания первой помощи в школах, на заводах или в зонах отдыха.',what:'Прием и осмотр пациентов: Выслушивание жалоб, постановка диагноза и разработка индивидуального плана лечения.\nЭмоциональная поддержка: Разъяснение ситуации пациенту и его близким, оказание моральной поддержки и создание атмосферы спокойствия.\nВыполнение лечебных процедур: Назначение медикаментов, выполнение инъекций, обработка ран и регулярный мониторинг состояния больного.\nПрофилактическая работа: Пропаганда здорового образа жизни, организация вакцинации и консультирование по вопросам предупреждения заболеваний.'},
      {name:'Социальный работник',where:'Государственные органы социальной защиты: Отделы социальной защиты населения, центры по выплате пенсий и пособий.\nРеабилитационные и кризисные центры: Учреждения по оказанию помощи жертвам бытового насилия и людям с ограниченными возможностями.\nБлаготворительные фонды: Международные и местные волонтерские организации, фонды гуманитарной помощи.\nДома престарелых и детские интернаты: Специализированные учреждения, где требуется ежедневная забота и поддержка.',what:'Консультирование и поддержка: Выслушивание проблем людей, находящихся в трудной жизненной ситуации, помощь в получении психологических и юридических консультаций.\nОформление документов: Оказание содействия нуждающимся в подготовке документов для получения государственных пособий, выплат и льгот.\nУлучшение бытовых условий: Помощь одиноким пожилым людям или людям с инвалидностью в доставке продуктов, медикаментов и решении повседневных задач.\nОрганизация общественных мероприятий: Проведение благотворительных марафонов, праздничных вечеров и программ социальной адаптации.'},
      {name:'Специалист отдела кадров (HR)',where:'Крупные компании и холдинги: HR-департаменты в любой сфере (банки, производство, торговые сети).\nРекрутинговые агентства: Специализированные центры по поиску и подбору квалифицированных кадров.\nIT и креативная индустрия: Отделы развития корпоративной культуры в современных офисах.\nГосударственные учреждения: Подразделения по управлению государственными служащими и кадровому учету.',what:'Подбор и интервьюирование: Рассмотрение резюме кандидатов, проведение собеседований и отбор наиболее подходящих специалистов.\nАдаптация: Знакомство новых сотрудников с коллективом и помощь в их быстрой интеграции в рабочие процессы.\nДокументация и законодательство: Заключение трудовых договоров, издание приказов и контроль за соблюдением трудового кодекса.\nРазрешение конфликтов: Регулирование недопониманий внутри коллектива и налаживание эффективной связи между сотрудниками и руководством.'},
      {name:'Юрист',where:'Государственные правоохранительные органы: Суды, прокуратура, органы юстиции и департаменты внутренних дел.\nАдвокатские конторы и нотариат: Центры оказания правовой помощи гражданам и легализации документов.\nМеждународные организации: Учреждения, занимающиеся защитой прав человека или международными договорами.',what:'Правовое консультирование: Разъяснение требований законодательства гражданам и компаниям, оказание профессиональной правовой помощи.\nПодготовка документов: Разработка контрактов, исковых заявлений, приказов и других документов, имеющих юридическую силу.\nНадзор за соблюдением законодательства: Проверка всех действий компании или учреждения на соответствие законам государства.\nРазрешение споров: Ведение переговоров, урегулирование конфликтов в досудебном или судебном порядке.'},
      {name:'Экономист',where:'Государственный и частный сектор: Экономические отделы государственных учреждений и крупных частных предприятий.\nФинансовые институты: Банки, страховые компании и инвестиционные фонды.\nИнвестиционный консалтинг: Специализированные фонды, предоставляющие консультации физическим и юридическим лицам.\nПроизводственная и коммерческая среда: Департаменты маркетинга и стратегического планирования крупных организаций.',what:'Стратегическое планирование (Сотрудник отдела планирования): Расчет вектора развития предприятия, оптимизация расходов и проектирование путей достижения максимальной прибыли.\nАнализ рынка (Маркетолог-аналитик): Исследование спроса и предложения, формирование ценовой политики и разработка стратегий по увеличению рыночной доли компании.\nФинансовые операции (Специалист банка / Бухгалтер): Ведение сложных финансовых расчетов, управление активами и контроль соответствия всей отчетности законодательным нормам.\nИнвестиционный анализ: Расчет эффективности вложений в инвестиционных фондах и профессиональное управление рисками.'},
    ],
    kz: [
      {name:'Мұғалім',where:'Мектепке дейінгі және мектеп мекемелері: Балабақшалар, бастауыш және орта мектептер, лицейлер мен гимназиялар.\nАрнаулы және жоғары оқу орындары: Колледждер мен университеттер (оқытушы, куратор, эдвайзер).\nҚосымша білім беру орталықтары: Тіл үйрету курстары, дамыту орталықтары және шығармашылық үйірмелер.',what:'Оқыту және тәрбиелеу: Пән бойынша білім берумен қатар, оқушылардың бойында адамгершілік, жауапкершілік және этика құндылықтарын қалыптастыру.\nӘдістемелік жұмыс: Сабақ жоспарларын құру, көрнекі құралдар дайындау және оқушылардың жетістіктерін жүйелі түрде бағалау.'},
      {name:'Медицина саласы',where:'Мемлекеттік және жеке емханалар мен ауруханалар: Терапиялық, педиатриялық және жедел жәрдем бөлімдері.\nДиагностикалық орталықтар: Пациенттерді қабылдау, кеңес беру және алдын ала тексеру жүргізу орындары.\nОңалту орталықтары: Операциядан кейінгі немесе ұзақ сырқаттан кейін қалпына келтіру мекемелері.\nСанаторийлер мен медициналық пункттер: Мектептердегі, зауыттардағы немесе демалыс орындарындағы алғашқы көмек көрсету пункттері.',what:'Пациенттерді қабылдау және қарау: Сырқаттың белгілерін тыңдау, диагноз қою және емдеу жоспарын ұсыну.\nЭмоционалды қолдау: Пациент пен оның туыстарына жағдайды түсіндіру, оларды тыныштандыру және моральдық демеу беру.\nЕмдеу процедураларын орындау: Дәрі-дәрмектерді тағайындау, инъекциялар жасау, жарақаттарды өңдеу және науқастың жағдайын тұрақты бақылау.\nПрофилактикалық жұмыс: Халық арасында салауатты өмір салтын насихаттау, екпе жұмыстарын ұйымдастыру және аурудың алдын алу бойынша кеңес беру.'},
      {name:'Әлеуметтік жұмыс',where:'Мемлекеттік әлеуметтік қорғау органдары: Халықты әлеуметтік қорғау бөлімдері, зейнетақы төлеу орталықтары.\nОңалту және дағдарыс орталықтары: Тұрмыстық зорлық-зомбылық құрбандарына, мүмкіндігі шектеулі жандарға көмек көрсету мекемелері.\nҚайырымдылық қорлары: Халықаралық және жергілікті волонтерлік ұйымдар, гуманитарлық көмек көрсету қорлары.\nҚарттар үйлері мен балалар интернаттары: Күнделікті қамқорлық пен қолдауды қажет ететін арнайы мекемелер.',what:'Кеңес беру және қолдау: Қиын жағдайдағы адамдардың мәселесін тыңдап, оларға психологиялық және құқықтық кеңес алуға көмектесу.\nҚұжаттарды реттеу: Мұқтаж жандарға мемлекеттік жәрдемақылар, төлемақылар мен жеңілдіктер алу үшін қажетті құжаттарды дайындауға жәрдемдесу.\nТұрмыстық жағдайды жақсарту: Жалғызбасты қарттарға немесе мүгедектігі бар адамдарға азық-түлік, дәрі-дәрмек жеткізу және күнделікті тіршілігіне көмектесу.\nҚоғамдық іс-шаралар ұйымдастыру: Қайырымдылық марафондарын, мерекелік кештерді және әлеуметтік бейімдеу бағдарламаларын өткізу.\nМүдделерді қорғау: Мемлекеттік органдар мен басқа да мекемелерде өз қамқорлығындағы адамдардың құқықтары мен мүдделерін қорғау.'},
      {name:'Кадр бөлімі маманы',where:'Ірі компаниялар мен холдингтер: Кез келген саланың (банктер, өндіріс, сауда желілері) HR департаменттерінде.\nРекрутингтік агенттіктер: Мамандарды іздеу және іріктеумен айналысатын мамандандырылған орталықтарда.\nIT және креативті индустрия: Заманауи кеңселерде корпоративтік мәдениетті дамыту бөлімдерінде.\nМемлекеттік мекемелер: Мемлекеттік қызметкерлерді басқару және кадрлық есеп жүргізу бөлімдерінде.',what:'Іріктеу және сұхбат: Үміткерлердің түйіндемелерін қарастыру, сұхбат жүргізу және ең лайықты мамандарды таңдау.\nБейімдеу: Жаңа қызметкерлерді ұжыммен таныстыру және олардың жұмысқа тез үйреніп кетуіне көмектесу.\nҚұжаттама және заңнама: Еңбек келісімшарттарын жасау, бұйрықтар шығару және еңбек заңдылықтарының сақталуын қадағалау.\nМәселелерді шешу: Ұжым ішіндегі түсініспеушіліктерді реттеу және қызметкерлер мен басшылық арасында байланыс орнату.'},
      {name:'Құқық саласы',where:'Мемлекеттік құқық қорғау органдары: Сот, прокуратура, әділет органдары және ішкі істер департаменттері.\nАдвокаттық кеңселер мен нотариат: Азаматтарға құқықтық көмек көрсету және құжаттарды заңдастыру орталықтары.\nХалықаралық ұйымдар: Адам құқықтарын қорғау жөніндегі немесе халықаралық келісімшарттармен айналысатын мекемелер.',what:'Құқықтық кеңес беру: Азаматтар мен компанияларға заң талаптарын түсіндіру және құқықтық көмек көрсету.\nҚұжаттарды дайындау: Келісімшарттар, талап арыздар, бұйрықтар және басқа да заңдық күші бар құжаттарды әзірлеу.\nЗаңнаманы қадағалау: Компанияның немесе мекеменің барлық іс-әрекеттерінің мемлекет заңдарына сәйкестігін тексеру.\nДауларды шешу: Келіссөздер жүргізу, кикілжіңдерді сотқа дейін немесе сот арқылы реттеу.'},
      {name:'Экономист',where:'Мемлекеттік және жеке сектор: Мемлекеттік мекемелердегі экономикалық бөлімдер мен ірі жеке кәсіпорындар.\nҚаржы институттары: Банктер, сақтандыру компаниялары және инвестициялық қорлар.\nИнвестициялық консалтинг: Жеке және заңды тұлғаларға кеңес беретін мамандандырылған қорлар.\nӨндірістік және коммерциялық орта: Ірі ұйымдардың маркетингтік және стратегиялық жоспарлау бөлімдері.',what:'Стратегиялық жоспарлау (Жоспарлау бөлімінің қызметкері): Кәсіпорынның даму бағытын есептеу, шығындарды оңтайландыру және максималды пайдаға жету жолдарын сызу.\nНарықты талдау (Ірі ұйымдардағы маркетолог): Сұраныс пен ұсынысты зерттеу, баға саясатын қалыптастыру және компанияның нарықтағы үлесін арттыру стратегияларын жасау.\nҚаржылық операциялар (Банктегі қаржы қызметкері, Бухгалтер): Күрделі қаржылық есептерді жүргізу, активтерді басқару және барлық есептіліктің заңға сәйкестігін бақылау.\nИнвестициялық талдау: Инвестициялық қорларда капиталды қайда салу тиімді екенін есептеу және тәуекелдерді басқару.'},
    ]

    ru: [
      {name:'Врач',where:'Государственные больницы и поликлиники: Отделения общей терапии, хирургии, педиатрии и другие специализированные подразделения. Служба скорой медицинской помощи: В составе бригад по оказанию экстренной помощи. Реабилитационные центры: Учреждения по восстановлению здоровья пациентов после операций или тяжелых заболеваний. Частные медицинские клиники: Диагностические центры и многопрофильные медицинские офисы.',what:': Прием и диагностика пациентов: Опрос жалоб, осмотр и назначение анализов для выявления причин заболевания. Составление плана лечения: Выписка лекарственных препаратов, назначение процедур или принятие решения о хирургическом вмешательстве. Медицинские манипуляции: Проведение инъекций, перевязок, оказание первой помощи и работа с медицинским оборудованием. Профилактика и консультирование: Обучение пациентов основам здорового образа жизни, правил'},
      {name:'Историк',where:'Научно-исследовательские институты и архивы: Изучение древних документов, хранение и анализ данных государственного значения. Музеи и галереи: Консервация экспонатов, организация выставок и проведение экскурсий. Образовательные учреждения: Преподавание в школах, колледжах и университетах, руководство научными проектами. Археологические экспедиции: Участие в раскопках и определение исторической ценности найденных артефактов.',what:': Анализ источников: Изучение рукописей, мемуаров, археологических находок и проверка их подлинности. Реконструкция событий: Сбор исторических фактов для воссоздания точного облика определенной эпохи или личности. Экспедиции и командировки: Посещение мест, имеющих историческое значение, сбор древних артефактов, легенд и преданий. Экспертиза: Разъяснение исторических причин современных политических или социальных явлений и составление прогнозов. С'},
      {name:'Бухгалтер',where:'Частные и государственные компании: В финансовых отделах любых учреждений – от малого бизнеса до крупных корпораций. Аутсорсинговые компании: В специализированных бухгалтерских центрах, которые ведут учет сразу нескольких фирм. Налоговые и аудиторские службы: В налоговых органах или аудиторских фирмах, проверяющих финансовую чистоту компаний.',what:': Ведение финансовой отчетности: Регистрация всех доходов и расходов компании, контроль кассовых и банковских операций. Налоговая отчетность: Своевременный расчет налогов и подача деклараций и отчетов в государственные органы. Инвентаризация: Проверка наличия имущества компании, постановка его на баланс или списание. Начисление заработной платы: Расчет выплат сотрудникам, налоговых отчислений и социальных платежей. HR-менеджер'},
      {name:'HR-менеджер',where:'Крупные компании и холдинги: HR-департаменты в любых отраслях (банки, производство, торговые сети). Рекрутинговые агентства: Специализированные центры по поиску и подбору квалифицированного персонала. IT и креативные индустрии: Отделы по развитию корпоративной культуры в современных технологических компаниях. Государственные учреждения: Департаменты управления персоналом и кадрового учета государственных служащих.',what:': Подбор и интервью: Рассмотрение резюме кандидатов, проведение собеседований и выбор наиболее подходящих специалистов. Адаптация: Знакомство новых сотрудников с коллективом и помощь в их скорейшем вхождении в рабочий процесс. Документация и законодательство: Заключение трудовых договоров, издание приказов и контроль за соблюдением трудового законодательства. Решение конфликтов: Регулирование недопониманий внутри коллектива и налаживание эффектив'},
      {name:'Социальный работник',where:'Государственные органы социальной защиты: Отделы социальной защиты населения, центры по выплате пенсий и пособий. Реабилитационные и кризисные центры: Учреждения по оказанию помощи жертвам бытового насилия и людям с ограниченными возможностями. Благотворительные фонды: Международные и местные волонтерские организации, фонды гуманитарной помощи. Дома престарелых и детские интернаты: Специализированные учреждения, где требуется ежедневная забота и ',what:': Консультирование и поддержка: Выслушивание проблем людей, находящихся в трудной жизненной ситуации, помощь в получении психологических и юридических консультаций. Оформление документов: Оказание содействия нуждающимся в подготовке документов для получения государственных пособий, выплат и льгот. Улучшение бытовых условий: Помощь одиноким пожилым людям или людям с инвалидностью в доставке продуктов, медикаментов и решении повседневных задач. Орг'},
      {name:'Фармацевт',where:'Аптеки и аптечные сети: Точки консультирования потребителей и продажи лекарственных средств. Фармацевтические заводы и лаборатории: Центры производства, контроля качества и разработки новых медицинских препаратов. Склады лекарственных средств: Крупные хабы по управлению логистикой, хранению и распределению медикаментов. Медицинское представительство: Продвижение продукции международных фармацевтических компаний и взаимодействие с врачами.',what:': Отпуск лекарственных средств: Выдача рецептурных и безрецептурных препаратов, разъяснение порядка их применения. Фармацевтическое консультирование: Предоставление профессиональной информации о составе, побочных эффектах и взаимодействии лекарств. Контроль качества и хранения: Строгий контроль сроков годности, температурного режима хранения и подлинности препаратов. Управление товарооборотом: Заказ, приемка и ведение учета лекарственных средств.'},

    kz: [
      {name:'Дәрігер',where:'Мемлекеттік ауруханалар мен емханалар: Жалпы терапия, хирургия, педиатрия және басқа да мамандандырылған бөлімдерде. Жедел жәрдем қызметі: Шұғыл медициналық көмек көрсету бригадаларында. Оңалту орталықтары: Операциядан немесе ауыр дерттен кейін пациенттердің денсаулығын қалпына келтіру мекемелерінде.',what:'Науқастарды қабылдау және диагностика: Шағымдарды тыңдау, қарап-тексеру және аурудың себебін анықтау үшін талдаулар (анализдер) тағайындау. Емдеу жоспарын құру: Дәрі-дәрмектерді жазып беру, процедураларды тағайындау немесе хирургиялық араласу туралы шешім қабылдау. Медициналық манипуляциялар: Егу (инъекция), таңғыш салу, алғашқы көмек көрсету және медициналық аппараттармен жұмыс істеу. Профилактика және кеңес беру: Аурулардың алдын алу, салауатты'},
      {name:'Тарих шы',where:'Ғылыми-зерттеу институттары мен мұрағаттар: Көне құжаттарды зерттеу, мемлекеттік маңызы бар деректерді сақтау және талдау. Музейлер мен галереялар: Жәдігерлерді қорғау, көрмелер ұйымдастыру және экскурсия жүргізу. Білім беру мекемелері: Мектептерде, колледждерде және университеттерде ұстаздық ету немесе ғылыми жобаларға жетекшілік ету. Археологиялық экспедициялар: Қазба жұмыстарына қатысу және табылған заттардың тарихи құндылығын анықтау.',what:'Дереккөздерді талдау: Қолжазбаларды, естеліктерді, археологиялық табыстарды зерттеп, олардың шынайылығын тексеру. Оқиғаларды жаңғырту: Тарихи фактілерді жинақтай отырып, белгілі бір кезеңнің немесе тұлғаның нақты бейнесін жасап шығу. Экспедициялар мен іссапарлар: Тарихи маңызы бар жерлерге бару, көне жәдігерлер мен аңыз-әпсаналарды жинау. Сараптама жасау: Қазіргі саяси немесе әлеуметтік құбылыстардың тарихи себептерін түсіндіру және болжам жасау.'},
      {name:'Бухгалтер',where:'Жеке және мемлекеттік компаниялар: Кез келген мекеменің (шағын бизнестен бастап ірі корпорацияларға дейін) қаржы бөлімінде. Аутсорсингтік компаниялар: Бір уақытта бірнеше фирманың есебін жүргізетін мамандандырылған бухгалтерлік орталықтарда. Салық және аудит қызметтері: Салық органдарында немесе компаниялардың қаржылық тазалығын тексеретін аудиторлық фирмаларда.',what:'Қаржылық есеп жүргізу: Компанияның барлық кірістері мен шығыстарын тіркеу, кассалық және банктік операцияларды бақылау. Салықтық есеп беру: Салықтарды дер кезінде есептеу және мемлекеттік органдарға декларациялар мен есептерді өткізу. Инвентаризация: Компания мүлкінің бар-жоғын тексеру және оларды балансқа қою немесе есептен шығару.'},
      {name:'Кадр бөлімі маманы',where:'Ірі компаниялар мен холдингтер: Кез келген саланың (банктер, өндіріс, сауда желілері) HR департаменттерінде. Рекрутингтік агенттіктер: Мамандарды іздеу және іріктеумен айналысатын мамандандырылған орталықтарда. IT және креативті индустрия: Заманауи кеңселерде корпоративтік мәдениетті дамыту бөлімдерінде. Мемлекеттік мекемелер: Мемлекеттік қызметкерлерді басқару және кадрлық есеп жүргізу бөлімдерінде.',what:'Іріктеу және сұхбат: Үміткерлердің түйіндемелерін қарастыру, сұхбат жүргізу және ең лайықты мамандарды таңдау. Бейімдеу: Жаңа қызметкерлерді ұжыммен таныстыру және олардың жұмысқа тез үйреніп кетуіне көмектесу. Құжаттама және заңнама: Еңбек келісімшарттарын жасау, бұйрықтар шығару және еңбек заңдылықтарының сақталуын қадағалау. Мәселелерді шешу: Ұжым ішіндегі түсініспеушіліктерді реттеу және қызметкерлер мен басшылық арасында байланыс орнату.'},
      {name:'Әлеуметтік қызметкер',where:'Мемлекеттік әлеуметтік қорғау органдары: Халықты әлеуметтік қорғау бөлімдері мен жұмыспен қамту орталықтарында. Оңалту және дағдарыс орталықтары: Қиын жағдайға тап болған жандарға, тұрмыстық зорлық-зомбылық құрбандарына көмек көрсету мекемелерінде. Қарттар үйі мен балалар үйлері: Ерекше күтімді қажет ететін жандарға қолдау көрсету орындарында. Үкіметтік емес ұйымдар (ҮЕҰ) және қайырымдылық қорлары: Халықаралық және жергілікті гуманитарлық жобалар',what:'Мұқтаж жандарға көмек: Жалғызбасты қарттарға, мүмкіндігі шектеулі жандарға және аз қамтылған отбасыларға күнделікті өмірде қолдау көрсету. Құқықтық және әлеуметтік кеңес: Азаматтарға мемлекеттік жәрдемақылар, жеңілдіктер мен тұрғын үй алу жолдары туралы ақпарат беру. Психологиялық қолдау: Қиын өмірлік жағдайда жүрген адамдарды тыңдау, оларға мотивация беру және эмоционалдық күйін жақсартуға көмектесу. Жағдайды мониторингтеу: Тұрмысы төмен отбасыл'},
      {name:'Фармацевт',where:'Дәріханалар мен дәріхана желілері: Тұтынушыларға кеңес беру және дәрі-дәрмектерді сату нүктелерінде. Фармацевтикалық зауыттар мен зертханалар: Дәрілік заттарды өндіру, сапасын тексеру және жаңа препараттарды жасап шығару орталықтарында. Дәрі-дәрмек қоймалары: Препараттарды сақтау және тарату логистикасын басқаратын ірі хабтарда. Медициналық өкілдіктер: Халықаралық фармацевтикалық компаниялардың өнімдерін нарыққа таныту және дәрігерлермен жұмыс іс',what:'Дәрілік заттарды босату: Рецепт бойынша немесе рецептсіз берілетін дәрілерді беру және олардың қолдану тәртібін түсіндіру. Фармацевтикалық кеңес: Клиенттерге дәрілердің құрамы, жанама әсерлері және өзара әрекеттесуі туралы кәсіби мәлімет беру. Сапаны бақылау және сақтау: Дәрілердің жарамдылық мерзімін, сақтау температурасын және түпнұсқалығын қатаң қадағалау. Тауар айналымын басқару: Дәрілік заттарға тапсырыс беру, қабылдап алу және есепке алу жұ'},

      {name:'Тренер',where:'Профессиональные спортивные клубы и академии: Подготовка спортсменов к соревнованиям высокого уровня и разработка командной тактики. Фитнес-центры и оздоровительные комплексы: Проведение индивидуальных и групповых программ, улучшение физической формы клиентов , Специализированные спортивные школы: Формирование навыков у детей и подростков, отбор талантливого спортивного резерва. Корпоративный сектор: Организация программ физического благополучия ',what:': Программирование тренировочного процесса: Составление долгосрочных и краткосрочных планов на основе физических особенностей (возраст, здоровье, цели) человека. Техническое и тактическое обучение: Контроль правильности выполнения сложных упражнений, обеспечение техники безопасности и постановка спортивных элементов. Мониторинг и анализ: Систематическое измерение показателей (динамики), анализ антропометрических данных и корректировка нагрузок. К'},

      {name:'Графикалық дизайнер',where:'Жарнама және креативті агенттіктер: Брендтерге логотип, баннер және жарнамалық науқандар дайындау. IT-компаниялар мен стартаптар: Веб-сайттардың интерфейсін, мобильді қосымшалардың визуалды элементтерін жасау. Баспа үйлері мен БАҚ: Кітап мұқабаларын, журналдардың безендірілуін және иллюстрациялар дайындау. Фриланс: Әлемнің кез келген нүктесінде отырып, жеке тапсырыстармен жұмыс істеу (Upwork, Fiverr және т.б.).',what:'Брендинг және айдентика: Компанияның ерекше стилін (логотип, түстер палитрасы, қаріптер) нөлден бастап жасап шығу. Макеттеу және полиграфия: Баспаға арналған өнімдердің (визиткалар, флаерлер, каталогтар) дизайнын әзірлеу. UI/UX негіздері: Қолданушыға түсінікті әрі әдемі интерфейс элементтерін (түймелер, иконкалар, меню) жасау.'},
      {name:'Қорғаушы',where:'Адвокаттар алқасы: Кәсіби адвокаттық бірлестіктер құрамында жеке және заңды тұлғаларға қызмет көрсету. Бизнес пен корпорациялар: Ірі компаниялардың мүддесін сотта және келіссөздерде қорғайтын заңгер-кеңесші ретінде. Халықаралық құқық қорғау ұйымдары: Адам құқықтарын жаһандық деңгейде қорғайтын институттарда.',what:'Сотта өкілдік ету: Қылмыстық, азаматтық немесе әкімшілік істер бойынша өз клиентінің мүддесін қорғау және ақтау. Дәлелдемелер жинау: Істің мән-жайын зерттеу, куәгерлерден жауап алу және клиенттің кінәсіздігін дәлелдейтін айғақтарды іздеу. Заңгерлік кеңес беру: Азаматтарға олардың құқықтары мен міндеттері туралы түсіндіру, заңды шешімдер ұсыну. Құжаттарды дайындау: Талап арыздар, шағымдар, келісімшарттар мен басқа да ресми заңнамалық актілерді сау'},
      {name:'Мұғалім',where:'Мектепке дейінгі және мектеп мекемелері: Балабақшалар, бастауыш және орта мектептер, лицейлер мен гимназиялар. Арнаулы және жоғары оқу орындары: Колледждер мен университеттер (оқытушы, куратор, эдвайзер). Қосымша білім беру орталықтары: Тіл үйрету курстары, дамыту орталықтары және шығармашылық үйірмелер.',what:'Оқыту және тәрбиелеу: Пән бойынша білім берумен қатар, оқушылардың бойында адамгершілік, жауапкершілік және этика құндылықтарын қалыптастыру. Әдістемелік жұмыс: Сабақ жоспарларын құру, көрнекі құралдар дайындау және оқушылардың жетістіктерін жүйелі түрде бағалау.'},
      {name:'Маркетолог',where:'Жарнама және PR агенттіктері: Көптеген брендтерге креативті идеялар мен жарнамалық науқандар дайындайтын орталықтарда. Халықаралық брендтер: Әлемдік деңгейдегі компаниялардың маркетингтік стратегиясын жергілікті нарыққа бейімдеу бөлімдерінде. Фриланс және жеке консалтинг: Жеке кәсіпкерлер мен стартаптарға брендті дамыту бойынша қызмет көрсету.',what:'Нарықты зерттеу: Тұтынушылардың талғамын, бәсекелестердің қадамдарын және нарықтағы соңғы трендтерді талдау. Брендті дамыту: Өнімнің имиджін қалыптастыру, логотиптен бастап компанияның сөйлеу мәнеріне дейін жоспарлау. Жарнамалық науқандар: Әлеуметтік желілерде (SMM), Google-да немесе дәстүрлі медиада тауарды таныту бойынша жобалар ұйымдастыру. Нәтижені талдау: Жарнаманың тиімділігін сандармен (метрикалармен) тексеру және бюджетті тиімді жұмсауды '},
      {name:'Фармацевт',where:'Дәріханалар мен дәріхана желілері: Тұтынушыларға кеңес беру және дәрі-дәрмектерді сату нүктелерінде. Фармацевтикалық зауыттар мен зертханалар: Дәрілік заттарды өндіру, сапасын тексеру және жаңа препараттарды жасап шығару орталықтарында. Дәрі-дәрмек қоймалары: Препараттарды сақтау және тарату логистикасын басқаратын ірі хабтарда. Медициналық өкілдіктер: Халықаралық фармацевтикалық компаниялардың өнімдерін нарыққа таныту және дәрігерлермен жұмыс іс',what:'Дәрілік заттарды босату: Рецепт бойынша немесе рецептсіз берілетін дәрілерді беру және олардың қолдану тәртібін түсіндіру. Фармацевтикалық кеңес: Клиенттерге дәрілердің құрамы, жанама әсерлері және өзара әрекеттесуі туралы кәсіби мәлімет беру. Сапаны бақылау және сақтау: Дәрілердің жарамдылық мерзімін, сақтау температурасын және түпнұсқалығын қатаң қадағалау. Тауар айналымын басқару: Дәрілік заттарға тапсырыс беру, қабылдап алу және есепке алу жұ'},
      {name:'Косметолог дәрігер',where:'Эстетикалық медицина клиникалары: Күрделі аппараттық және инъекциялық процедуралар жүргізетін мамандандырылған орталықтарда. Сұлулық орталықтары мен SPA-салондар: Тері күтімі мен жасарту терапиясын ұсынатын мекемелерде. Ғылыми-зерттеу орталықтары: Косметикалық өнімдерді сынақтан өткізу және жаңа әдістемелерді әзірлеу зертханаларында.',what:'Диагностика: Пациенттің тері типін, мәселелерін (акне, пигментация, әжімдер) анықтау және емдеу жоспарын құру. Емдеу және алдын алу: Тері ауруларын (дерматологиялық деңгейде) емдеу және қартаю процесін бәсеңдету бойынша кәсіби кеңес беру. Күтім бағдарламаларын таңдау: Үй жағдайында қолданылатын кәсіби косметикалық өнімдерді пациенттің ерекшелігіне сай тағайындау.'},

  ENTJ: {
    ru: [
      {name:'Менеджер проектов',where:'Технологические стартапы и IT: Департаменты по выводу инновационных продуктов на рынок с нуля.\nМеждународные консалтинговые агентства: Проекты по реструктуризации и стратегическому развитию крупных корпораций.\nИнвестиционные и финансовые группы: Проекты по открытию и расширению новых бизнес-направлений.\nГосударственные стратегические реформы: Управление масштабными программами модернизации и национальными проектами развития.',what:'Стратегическое видение: Разработка дорожной карты проекта с учетом не только текущих результатов, но и его долгосрочного влияния на рынок.\nМобилизация команды: Быстрое выявление сильных сторон сотрудников, их вовлечение и вдохновение на достижение амбициозных целей.\nСистемная оптимизация: Поиск «узких мест» в бизнес-процессах и внедрение новых решений для повышения эффективности и скорости работы.\nПереговоры и влияние: Ведение переговоров на высоком уровне с заказчиками и партнерами для достижения максимально выгодных условий.\nУправление изменениями: Превращение непредвиденных трудностей и кризисных ситуаций в новые точки роста и возможности для проекта.'},
      {name:'Предприниматель',where:'Инновационные стартапы: Основание компаний, предлагающих новые технологии и уникальные виды услуг.\nФранчайзинговые сети: Масштабирование готовых бизнес-моделей и управление крупными сетевыми структурами.\nМеждународная торговля: Создание и управление компаниями, работающими на мировом рынке (экспорт и импорт).\nБизнес-инкубаторы и холдинги: Руководство крупными группами компаний, объединяющими бизнес-проекты в разных индустриях.',what:'Проектирование бизнес-процессов: Создание структуры компании «с нуля», разработка операционных алгоритмов и стандартов.\nПривлечение инвестиций: Презентация перспектив проекта инвесторам, ведение переговоров и эффективное распределение привлеченного капитала.\nМасштабирование: Обеспечение постоянного роста бизнеса через открытие новых филиалов, экспансию на новые рынки и запуск новых продуктов.\nУправление рисками: Расчет финансовых и политических рисков, разработка антикризисных стратегий для вывода компании из любых сложных ситуаций.'},
      {name:'Политолог',where:'Государственный аппарат: Отделы внутренней и внешней политики органов госуправления, государственно-административные структуры.\nПравоохранительные органы и безопасность: Аналитические подразделения Комитета национальной безопасности (КНБ) и Министерства внутренних дел (МВД).\nНаука и образование: Научно-исследовательские институты (НИИ), аналитические центры, вузы и колледжи (в качестве преподавателя).\nПолитические организации: Общественно-политические объединения, политические партии и предвыборные штабы.\nМеждународная арена: Международные организации и дипломатические миссии.\nМедиа и PR: Аналитические отделы СМИ (ТВ, пресса), PR-агентства и департаменты по связям с общественностью.',what:'Конфликтология: Изучение общественных и политических конфликтов, разработка эффективных сценариев их урегулирования.\nЭкспертно-аналитическая деятельность: Анализ внутреннего и внешнего курса государства, подготовка политических прогнозов и проведение научных исследований.\nКоммуникации и PR: Регулирование взаимодействия между государственными структурами и населением, создание стратегий влияния на общественное мнение.\nДипломатическая деятельность: Участие в решении политических вопросов на международном уровне и защита геополитических интересов государства.'},
      {name:'Юрист',where:'Правоохранительная и судебная система: Суды, прокуратура, органы внутренних дел.\nГосударственный аппарат: Органы государственной власти, исполнительные и представительные органы (акиматы, маслихаты).\nБизнес и финансы: Государственные и частные предприятия, банки, страховые и аудиторские компании.\nПравовая помощь: Адвокатура и образовательные организации.',what:'Обеспечение правопорядка: Надзор за соблюдением законности, защита безопасности личности, общества и государства.\nПравоохранительная деятельность: Борьба с правонарушениями, контроль исполнения наказаний и проведение правового воспитания в обществе.\nРазработка правовых норм: Участие в подготовке новых законопроектов и контроль их корректной реализации на практике.\nЗащита предпринимательства: Проверка законности контрактов, правовое сопровождение бизнес-процессов и решение сложных юридических ситуаций в банковском и страховом секторах.\nАдвокатская деятельность и консалтинг: Защита прав граждан и организаций в суде, предоставление профессиональных экспертных консультаций.'},
      {name:'Экономист',where:'Государственный и частный сектор: Экономические отделы государственных учреждений и крупных частных корпораций.\nФинансовые институты: Банки, страховые компании и инвестиционные фонды.\nИнвестиционный консалтинг: Специализированные фонды, предоставляющие консультации физическим и юридическим лицам.\nПроизводственная и коммерческая среда: Департаменты маркетинга и стратегического планирования крупных организаций.',what:'Стратегическое планирование (Сотрудник отдела планирования): Расчет вектора развития предприятия, оптимизация расходов и проектирование путей достижения максимальной прибыли.\nАнализ рынка (Маркетолог-аналитик): Исследование спроса и предложения, формирование ценовой политики и разработка стратегий по увеличению рыночной доли компании.\nФинансовые операции (Специалист банка / Бухгалтер): Ведение сложных финансовых расчетов, управление активами и контроль соответствия отчетности законодательным нормам.\nИнвестиционный анализ: Расчет эффективности вложений в инвестиционных фондах и профессиональное управление рисками.'},
      {name:'Финансовый аналитик',where:'Инвестиционные банки и фонды: Департаменты анализа акций и активов, управление крупными инвестиционными портфелями.\nТранснациональные корпорации: Отделы разработки финансовой стратегии компании и оценки инвестиционных рисков.\nКонсалтинговые агентства: Проекты по оздоровлению бизнеса, построению финансовых моделей и рыночному прогнозированию.\nРейтинговые и аналитические центры: Исследование макроэкономических показателей и подготовка обзоров рынка.',what:'Финансовое моделирование: Построение сложных математических и логических моделей для расчета будущих доходов и расходов компании.\nИнвестиционный анализ: Исследование эффективности вложений в конкретные проекты или активы, подготовка обоснованных рекомендаций.\nУправление рисками: Предварительный расчет возможных финансовых потерь и разработка стратегий по их минимизации.\nМониторинг рыночных трендов: Отслеживание изменений в мировой экономике и прогнозирование их влияния на конкретный бизнес.'},
    ],
    kz: [
      {name:'Жоба менеджері',where:'Технологиялық стартаптар мен IT: Инновациялық өнімдерді нөлден бастап нарыққа шығару бөлімдері.\nХалықаралық консалтингтік агенттіктер: Ірі компаниялардың жұмысын қайта құру және дамыту жобалары.\nИнвестициялық және қаржылық топтар: Жаңа бизнес-бағыттарды ашу және кеңейту жобалары.\nМемлекеттік стратегиялық реформалар: Ел көлеміндегі ауқымды өзгерістер мен жаңғырту бағдарламаларын басқару.',what:'Стратегиялық көрініс: Жобаның тек бүгінгі нәтижесін емес, оның болашақтағы әсерін есептеп, стратегиялық жоспар құру.\nКоманданы жұмылдыру: Әр адамның мықты тұсын тез байқап, оларды ортақ мақсатқа бағыттау және шабыттандыру.\nЖүйелі оңтайландыру: Баяу жұмыс істейтін процестерді тауып, оларды жылдам әрі тиімді ететін жаңа шешімдер енгізу.\nКеліссөздер мен билік: Тапсырыс берушілермен, серіктестермен жоғары деңгейде келіссөз жүргізіп, ең тиімді шарттарға қол жеткізу.\nӨзгерістерді басқару: Күтпеген қиындықтар туындағанда оны жаңа мүмкіндікке айналдыру.'},
      {name:'Кәсіпкер',where:'Инновациялық стартаптар: Жаңа технологиялар мен бұрын соңды болмаған қызмет түрлерін ұсынатын компаниялардың негізін қалаушы.\nФранчайзингтік желілер: Дайын бизнес-модельдерді масштабтап, үлкен желілерді басқару.\nХалықаралық сауда: Экспорт пен импортты реттейтін, әлемдік нарықта жұмыс істейтін компаниялар.\nБизнес-инкубаторлар мен холдингтер: Бірнеше түрлі бағыттағы бизнестерді біріктіретін ірі топтардың басшысы.',what:'Бизнес-процестерді құру: Компанияның құрылымын басынан аяғына дейін жобалау.\nИнвестиция тарту: Жобаның болашағына инвесторларды тарту, келіссөздер жүргізу және капиталды дұрыс бағытқа салу.\nМасштабтау: Бизнестің бір орында тұрып қалуына жол бермей, үнемі жаңа филиалдар ашу, жаңа өнімдер шығару.\nТәуекелді басқару: Қаржылық және саяси тәуекелдерді есептеп, кез келген дағдарыстан компанияны алып шығу.'},
      {name:'Саясаттанушы',where:'Мемлекеттік аппарат: Мемлекеттік басқару органдарының ішкі және сыртқы саясат бөлімдері, мемлекеттік-әкімшілік құрылымдар.\nҚұқық қорғау және қауіпсіздік: Ұлттық қауіпсіздік комитеті (ҰҚК) мен Ішкі істер министрлігінің (ІІМ) сараптамалық бөлімдері.\nҒылым және білім: Ғылыми-зерттеу институттары мен орталықтары, жоғары оқу орындары (университеттер мен колледждерде оқытушы).\nСаяси ұйымдар: Қоғамдық саяси ұйымдар, саяси партиялар және сайлау штабтары.\nХалықаралық арена: Халықаралық ұйымдар мен дипломатиялық мекемелер.\nМедиа және PR: Бұқаралық ақпарат құралдарының (теледидар, газет-журнал) сараптама бөлімдері және жұртшылықпен байланыс (PR) агенттіктері.',what:'Саяси технологиялар және имидж: Саяси технолог немесе имиджмейкер ретінде саясаткерлердің беделін қалыптастыру және сайлау науқандарын басқару.\nКонфликтология: Қоғамдық немесе саяси қақтығыстарды зерттеу және оларды тиімді шешу жолдарын ұсыну.\nСараптамалық қызмет: Мемлекеттің ішкі-сыртқы бағытына талдау жасау, саяси болжамдар дайындау және ғылыми зерттеулер жүргізу.\nКоммуникация және PR: Мемлекеттік құрылымдар мен халық арасындағы байланысты реттеу, қоғамдық пікірге әсер ету стратегияларын құру.\nДипломатиялық қызмет: Халықаралық деңгейдегі саяси мәселелерді шешуге қатысу және мемлекеттің геосаяси мүддесін қорғау.'},
      {name:'Заңгер',where:'Құқық қорғау және сот жүйесі: Сот, прокуратура, ішкі істер органдары.\nМемлекеттік аппарат: Мемлекеттік билік, атқарушы және өкілетті органдар (әкімдіктер, мәслихаттар).\nБизнес және қаржы: Мемлекеттік және мемлекеттік емес кәсіпорындар, банктер, сақтандыру және аудиторлық компаниялар.\nҚұқықтық көмек: Адвокатура және білім беру ұйымдары.',what:'Құқықтық тәртіпті қамтамасыз ету: Заңдылық пен тәртіптің сақталуын қадағалау, жеке адамның, қоғам мен мемлекеттің қауіпсіздігін қорғау.\nҚұқық қорғау қызметі: Қылмыспен және құқық бұзушылықтармен күресу, кінәлілерге жазаның орындалуын бақылау және қоғамда құқықтық тәрбие жұмыстарын жүргізу.\nҚұқықтық нормаларды әзірлеу: Жаңа заң жобаларын дайындауға қатысу және олардың іс жүзінде дұрыс жүзеге асырылуын қадағалау.\nКәсіпкерлікті қорғау: Бизнес саласындағы келісімшарттардың заңдылығын тексеру, банк және сақтандырулардағы ситуацияларды құқықтық жолмен шешу.\nАдвокаттық және кеңес беру: Азаматтардың құқықтарын сотта қорғау және оларға құқықтық мәселелер бойынша кәсіби кеңес беру.'},
      {name:'Экономист',where:'Мемлекеттік және жеке сектор: Мемлекеттік мекемелердегі экономикалық бөлімдер мен ірі жеке кәсіпорындар.\nҚаржы институттары: Банктер, сақтандыру компаниялары және инвестициялық қорлар.\nИнвестициялық консалтинг: Жеке және заңды тұлғаларға кеңес беретін мамандандырылған қорлар.\nӨндірістік және коммерциялық орта: Ірі ұйымдардың маркетингтік және стратегиялық жоспарлау бөлімдері.',what:'Стратегиялық жоспарлау (Жоспарлау бөлімінің қызметкері): Кәсіпорынның даму бағытын есептеу, шығындарды оңтайландыру және максималды пайдаға жету жолдарын сызу.\nНарықты талдау (Ірі ұйымдардағы маркетолог): Сұраныс пен ұсынысты зерттеу, баға саясатын қалыптастыру және компанияның нарықтағы үлесін арттыру стратегияларын жасау.\nҚаржылық операциялар (Банктегі қаржы қызметкері, Бухгалтер): Күрделі қаржылық есептерді жүргізу, активтерді басқару және барлық есептіліктің заңға сәйкестігін бақылау.\nИнвестициялық талдау: Инвестициялық қорларда капиталды қайда салу тиімді екенін есептеу және тәуекелдерді басқару.'},
      {name:'Қаржы сарапшысы',where:'Инвестициялық банктер мен қорлар: Акциялар мен активтерді талдау, ірі портфельдерді басқару бөлімдері.\nТрансұлттық корпорациялар: Компанияның қаржылық стратегиясын құру және инвестициялық тәуекелдерді бағалау бөлімі.\nКонсалтингтік агенттіктер: Бизнесті сауықтыру, қаржылық модельдерді құру және нарықтық болжам жасау.\nРейтингтік және сараптамалық орталықтар: Макроэкономикалық көрсеткіштерді зерттеу және нарыққа шолу жасау.',what:'Қаржылық модельдеу: Компанияның болашақтағы табысы мен шығынын есептейтін күрделі математикалық және логикалық модельдер құру.\nИнвестициялық талдау: Қай жобаға немесе активке қаржы салу тиімді екенін зерттеп, негізделген ұсыныстар дайындау.\nТәуекелдерді басқару: Ықтимал қаржылық шығындарды алдын ала есептеп, оларды азайтудың стратегияларын әзірлеу.\nНарықтық трендтерді бақылау: Әлемдік экономикадағы өзгерістерді қадағалап, олардың нақты бизнеске әсерін болжау.'},

      {name:'Финансовый аналитик',where:'Инвестиционные банки и фонды: Департаменты анализа акций и активов, управление крупными инвестиционными портфелями. Транснациональные корпорации: Отделы разработки финансовой стратегии компании и оценки инвестиционных рисков. Консалтинговые агентства: Проекты по оздоровлению бизнеса, построению финансовых моделей и рыночному прогнозированию. Рейтинговые и аналитические центры: Исследование макроэкономических показателей и подготовка обзоров рынка',what:': Финансовое моделирование: Построение сложных математических и логических моделей для расчета будущих доходов и расходов компании. Инвестиционный анализ: Исследование эффективности вложений в конкретные проекты или активы, подготовка обоснованных рекомендаций. Управление рисками: Предварительный расчет возможных финансовых потерь и разработка стратегий по их минимизации. Мониторинг рыночных трендов: Отслеживание изменений в мировой экономике и п'},

      {name:'Дипломат',where:'Мемлекеттік және үкіметтік мекемелер: Сыртқы істер министрлігі, елшіліктер мен консулдықтар. Халықаралық ұйымдар: Б іріккен Ұлттар Ұйымы сияқты ірі құрылымдар. Трансұлттық компаниялар: Әлемнің бірнеше елінде филиалдары бар ірі корпорациялар. Үкіметтік емес және жеке кәсіпорындар: Халықаралық жобалармен жұмыс істейтін компаниялар.',what:'Халықаралық ынтымақтастық: Мемлекетаралық немесе компанияаралық байланыстарды нығайту бойынша кәсіби кеңестер беру. Геосаяси талдау: Аймақтану және геосаясат мәселелерін зерттей отырып, тиімді сыртқы саясатты қалыптастыруға қатысу. Жобаларды үйлестіру: Халықаралық деңгейдегі түрлі экономикалық, әлеуметтік және саяси жобалардың жүзеге асырылуын қадағалау. Келіссөздер жүргізу: Ресми хаттамаларды сақтай отырып, мемлекеттің немесе компанияның мүддесі'},

      {name:'PR - менеджер )',where:'Ірі корпорациялар мен компаниялар: Брендтің танымалдылығын арттыру және ішкі/сыртқы коммуникацияны реттеу. Мемлекеттік мекемелер (Баспасөз қызметі): Мемлекеттік органдар мен халық арасындағы ақпараттық көпір болу. PR және коммуникациялық агенттіктер: Бір уақытта бірнеше клиенттің имидждік жобаларымен жұмыс істеу.',what:'Имидж қалыптастыру: Компанияның немесе тұлғаның қоғам алдындағы жағымды бейнесін (репутациясын) құру және сақтау. БАҚ-пен жұмыс: Журналистермен байланыс орнату, пресс-конференциялар ұйымдастыру және ресми мәлімдемелер (пресс-релиздер) дайындау. Event-менеджмент: Компанияның танымалдылығын арттыратын түрлі іс-шаралар, презентациялар мен қайырымдылық акцияларын ұйымдастыру.'},

      {name:'Қаржы талдаушысы',where:'Инвестициялық компаниялар мен қорлар: Акциялар, облигациялар және басқа да активтердің құнын бағалау, портфельді басқару бөлімдерінде. Банктер мен финтех мекемелері: Несиелік тәуекелдерді талдау, банктің қаржылық тұрақтылығын бақылау және жаңа өнімдерді есептеу. Ірі корпорациялар: Компанияның даму стратегиясын құру, инвестициялық жобалардың тиімділігін есептеу және бюджетті оңтайландыру.',what:'Қаржылық модельдеу: Компанияның болашақтағы жағдайын болжайтын күрделі математикалық модельдер мен кестелер құру. Нарықтық трендтерді зерттеу: Экономикалық жаңалықтарды, валюта бағамдарын және шикізат бағаларын талдап, олардың бизнеске әсерін бағалау. Инвестициялық ұсыныстар дайындау: Активтерді сатып алу немесе сату бойынша негізделген кеңестер беру. Тәуекелдерді басқару: Қаржылық шығындардың алдын алу және компанияның активтерін қорғау стратеги'},
      {name:'Заңгер',where:'Мемлекеттік органдар: Сот, прокуратура, ішкі істер органдары және әділет министрлігі жүйесінде. Корпоративтік сектор: Ірі компаниялар мен банктердің заң бөлімдерінде . Нотариат және адвокатура: Жеке нотариалдық кеңселерде немесе қорғаушы ретінде адвокаттар алқасында. Халықаралық ұйымдар: Адам құқықтарын қорғайтын немесе халықаралық келісімшарттармен айналысатын ұйымдарда.',what:'Құқықтық кеңес беру: Азаматтар мен компанияларға заңнамалық мәселелер бойынша түсіндірме жұмыстарын жүргізу. Құжаттарды сараптау: Келісімшарттардың, бұйрықтардың және өзге де ресми актілердің заңға сәйкестігін тексеру. Мүдделерді қорғау: Сотта немесе мемлекеттік мекемелерде өз клиентінің немесе компанияның мүддесін білдіру. Заң жобаларын әзірлеу: Құқықтық нормаларды жетілдіру және жаңа ережелер мен регламенттерді жазу. Медиация: Даулы мәселелерді'},
      {name:'Ғылыми медицина (Зерттеуші- д әрігер )',where:'Ғылыми-зерттеу институттары мен орталықтар: Онкология, генетика, кардиология немесе нейроғылым бағытындағы заманауи зертханаларда. Фармацевтикалық алпауыттар: Жаңа дәрі-дәрмектер мен вакциналарды клиникаға дейінгі және клиникалық сынақтан өткізу бөлімдерінде. Биотехнологиялық стартаптар: Гендік инженерия, жасушалық терапия жасап шығару жобаларында. Академиялық орта: Университет клиникаларында ғылыми жұмыспен айналыса отырып, болашақ дәрігерлерге ',what:'Патологияларды зерттеу: Аурулардың (мысалы, қатерлі ісік немесе сирек кездесетін генетикалық аурулар) молекулалық және генетикалық себептерін анықтау. Клиникалық зерттеулер: Жаңа емдеу әдістерінің немесе дәрілердің адам ағзасына әсерін, қауіпсіздігі мен тиімділігін зерделеу. Гендік және жасушалық инженерия: Тұқым қуалайтын ауруларды емдеу үшін ДНҚ деңгейіндегі түзету әдістерін немесе діңгекті жасушалар терапиясын дамыту. Деректерді биоинформатика'},
      {name:'Зерттеуші ғалым',where:'Ғылыми-зерттеу институттары (ҒЗИ): Іргелі және қолданбалы ғылыммен айналысатын мемлекеттік және жекеменшік орталықтарда. Университеттер мен зертханалар: Академиялық ортада сабақ берумен қатар, өз бағытыңыз бойынша ғылыми жобаларды жүзеге асыру. Халықаралық ғылыми қорлар мен орталықтар: Жаһандық мәселелерді (экология, ғарыш, медицина) зерттейтін трансұлттық жобаларда.',what:'Деректерді талдау: Жиналған ақпаратты математикалық және статистикалық әдістермен өңдеп, нәтижелерін қорытындылау. Ғылыми мақалалар жазу: Зерттеу нәтижелерін халықаралық журналдарда жариялау және ғылыми қауымдастыққа таныстыру. Жаңа технологияларды әзірлеу: Теориялық білімді практикада қолданып, өнертабыстар жасау немесе ескі әдістерді жетілдіру. Гранттар мен жобаларды басқару: Зерттеуді қаржыландыру үшін өтінімдер беру және ғылыми топтың жұмысын'},

  ENFJ: {
    ru: [
      {name:'Дипломат',where:'Государственные и правительственные учреждения: Министерство иностранных дел, посольства и консульства.\nМеждународные организации: Крупные международные структуры (ООН, ОИС, ШОС и др.).\nНеправительственные и частные предприятия: Компании и фонды, работающие с международными проектами и зарубежными инвестициями.',what:'Международное сотрудничество: Профессиональное консультирование по вопросам укрепления межгосударственных и межкорпоративных связей.\nГеополитический анализ: Участие в формировании внешней политики на основе глубокого анализа региональных и геополитических процессов.\nКоординация проектов: Сопровождение и контроль реализации международных экономических, социальных и политических программ.\nВедение переговоров: Заключение соглашений со строгим соблюдением дипломатического протокола для защиты интересов государства или компании.\nПредставительская деятельность: Установление партнерских отношений с иностранными делегациями и продвижение имиджа страны на мировой арене.'},
      {name:'Психолог',where:'Частная практика и консультационные центры: Открытие собственного кабинета или работа штатным специалистом в центрах психологической помощи.\nОбразовательные учреждения: Оказание поддержки учащимся и студентам в школах, колледжах и университетах.\nКорпоративный сектор (HR): Мониторинг эмоционального состояния сотрудников в крупных компаниях и предотвращение выгорания.\nМедицинские и реабилитационные центры: Работа в больницах, кризисных центрах и учреждениях по оказанию помощи людям, оказавшимся в трудной жизненной ситуации.',what:'Проведение консультаций: Выслушивание внутренних проблем, тревог и трудностей клиентов, предоставление рекомендаций по их решению.\nПсихологическая диагностика: Определение особенностей поведения, способностей и эмоционального состояния человека через тестирование и интервью.\nОрганизация тренингов: Проведение групповых занятий по личностному росту, стрессоустойчивости и развитию навыков коммуникации.\nПоддержка и реабилитация: Оказание эмоциональной помощи людям в состоянии стресса или после травм, помощь в их адаптации к нормальной жизни.\nИсследовательская деятельность: Изучение закономерностей человеческой психологии и поиск новых методов коррекции поведения.'},
      {name:'Маркетолог',where:'Рекламные и PR-агентства: Центры по разработке креативных идей и рекламных кампаний для различных брендов.\nМеждународные бренды: Департаменты по адаптации глобальных маркетинговых стратегий мировых компаний под локальный рынок.\nФриланс и частный консалтинг: Оказание услуг по развитию брендов для индивидуальных предпринимателей и стартапов.',what:'Исследование рынка: Анализ предпочтений потребителей, действий конкурентов и последних рыночных трендов.\nРазвитие бренда: Формирование имиджа продукта – от создания логотипа до разработки уникального голоса компании.\nРекламные кампании: Организация проектов по продвижению товаров в социальных сетях (SMM), Google или традиционных медиа.\nАнализ результатов: Проверка эффективности рекламы через цифровые метрики и контроль за рациональным использованием бюджета.'},
      {name:'Педагог',where:'Дошкольные и школьные учреждения: Детские сады, начальные и средние школы, лицеи и гимназии.\nСпециальные и высшие учебные заведения: Колледжи и университеты (в роли преподавателя, куратора или эдвайзера).\nЦентры дополнительного образования: Языковые курсы, развивающие центры и творческие кружки.',what:'Обучение и воспитание: Передача академических знаний по предмету параллельно с формированием у учащихся моральных ценностей, ответственности и этики.\nМетодическая работа: Составление планов занятий, подготовка наглядных пособий и систематическая оценка достижений учащихся.\nПсихолого-педагогическая поддержка: Создание благоприятной атмосферы для обучения, выявление индивидуальных способностей ребенка и помощь в их развитии.\nВзаимодействие с социумом: Работа с родителями и коллегами для создания единой образовательной среды.'},
      {name:'Политолог',where:'Государственный аппарат: Отделы внутренней и внешней политики органов госуправления, государственно-административные структуры.\nПравоохранительные органы и безопасность: Аналитические подразделения Комитета национальной безопасности (КНБ) и Министерства внутренних дел (МВД).\nНаука и образование: Научно-исследовательские институты (НИИ), аналитические центры, вузы и колледжи (в качестве преподавателя).\nПолитические организации: Общественно-политические объединения, политические партии и предвыборные штабы.\nМеждународная арена: Международные организации и дипломатические миссии.\nМедиа и PR: Аналитические отделы СМИ (ТВ, пресса), PR-агентства и департаменты по связям с общественностью.',what:'Конфликтология: Изучение общественных и политических конфликтов, разработка эффективных сценариев их урегулирования.\nЭкспертно-аналитическая деятельность: Анализ внутреннего и внешнего курса государства, подготовка политических прогнозов и проведение научных исследований.\nКоммуникации и PR: Регулирование взаимодействия между государственными структурами и населением, создание стратегий влияния на общественное мнение.\nДипломатическая деятельность: Участие в решении политических вопросов на международном уровне и защита геополитических интересов государства.'},
      {name:'Переводчик',where:'Международные организации и посольства: Дипломатические представительства, глобальные учреждения, такие как ООН или ЮНЕСКО.\nБюро переводов и издательства: Центры по переводу книг, официальной документации и технических инструкций.\nIT и креативная индустрия: Департаменты локализации игр, веб-сайтов и программного обеспечения.\nТуризм и бизнес: Сопровождение иностранных делегаций, участие в деловых переговорах и международных конференциях.',what:'Письменный перевод: Перевод текстов различных жанров (художественных, технических, юридических) с сохранением точного смысла.\nСинхронный и последовательный перевод: Устный перевод речи спикера в реальном времени на международных форумах и встречах.\nРедактирование и корректура: Проверка качества готовых переводов, исправление стилистических и грамматических ошибок.\nРабота с терминологией: Составление словарей и глоссариев по специальным отраслям (медицина, нефтегазовый сектор, IT).'},

    kz: [
      {name:'Дипломат',where:'Мемлекеттік және үкіметтік мекемелер: Сыртқы істер министрлігі, елшіліктер мен консулдықтар.\nХалықаралық ұйымдар: Біріккен Ұлттар Ұйымы сияқты ірі құрылымдар.\nТрансұлттық компаниялар: Әлемнің бірнеше елінде филиалдары бар ірі корпорациялар.\nҮкіметтік емес және жеке кәсіпорындар: Халықаралық жобалармен жұмыс істейтін компаниялар.',what:'Халықаралық ынтымақтастық: Мемлекетаралық немесе компанияаралық байланыстарды нығайту бойынша кәсіби кеңестер беру.\nГеосаяси талдау: Аймақтану және геосаясат мәселелерін зерттей отырып, тиімді сыртқы саясатты қалыптастыруға қатысу.\nЖобаларды үйлестіру: Халықаралық деңгейдегі түрлі экономикалық, әлеуметтік және саяси жобалардың жүзеге асырылуын қадағалау.\nКеліссөздер жүргізу: Ресми хаттамаларды сақтай отырып, мемлекеттің немесе компанияның мүддесін қорғайтын келісімдер жасасу.\nӨкілдік қызмет: Шетелдік серіктестермен байланыс орнатып, елдің имиджін халықаралық деңгейде ілгерілету.'},
      {name:'Психолог',where:'Жеке практика және консультациялық орталықтар: Жеке кабинет ашу немесе психологиялық көмек көрсету орталықтарында маман болу.\nБілім беру мекемелері: Мектептерде, колледждер мен университеттерде оқушылар мен студенттерге қолдау көрсету.\nКорпоративтік сектор (HR): Ірі компанияларда қызметкерлердің эмоционалдық күйін бақылау.\nМедициналық және оңалту орталықтары: Ауруханаларда, дағдарыс орталықтарында және қиын жағдайға тап болған жандарға көмек көрсету мекемелерінде.',what:'Консультация жүргізу: Адамдардың ішкі мәселелерін, үрейлерін және қиындықтарын тыңдап, оларды шешуге бағыт-бағдар беру.\nПсихологиялық диагностика: Тестілеу мен сұхбат арқылы адамның мінез-құлқын, қабілеттерін және эмоционалдық жағдайын анықтау.\nТренингтер ұйымдастыру: Тұлғалық өсу, стресске төзімділік және қарым-қатынас дағдыларын дамыту бойынша топтық сабақтар өткізу.\nҚолдау және оңалту: Күйзеліске түскен немесе жарақат алған жандарға эмоционалдық көмек көрсетіп, оларды қалыпты өмірге бейімдеу.\nЗерттеу жүргізу: Адам психологиясының заңдылықтарын зерттеп, мінез-құлықты түзетудің жаңа әдістерін іздеу.'},
      {name:'Маркетолог',where:'Жарнама және PR агенттіктері: Көптеген брендтерге креативті идеялар мен жарнамалық науқандар дайындайтын орталықтарда.\nХалықаралық брендтер: Әлемдік деңгейдегі компаниялардың маркетингтік стратегиясын жергілікті нарыққа бейімдеу бөлімдерінде.\nФриланс және жеке консалтинг: Жеке кәсіпкерлер мен стартаптарға брендті дамыту бойынша қызмет көрсету.',what:'Нарықты зерттеу: Тұтынушылардың талғамын, бәсекелестердің қадамдарын және нарықтағы соңғы трендтерді талдау.\nБрендті дамыту: Өнімнің имиджін қалыптастыру, логотиптен бастап компанияның сөйлеу мәнеріне дейін жоспарлау.\nЖарнамалық науқандар: Әлеуметтік желілерде (SMM), Google-да немесе дәстүрлі медиада тауарды таныту бойынша жобалар ұйымдастыру.\nНәтижені талдау: Жарнаманың тиімділігін сандармен (метрикалармен) тексеру және бюджетті тиімді жұмсауды қадағалау.'},
      {name:'Мұғалім',where:'Мектепке дейінгі және мектеп мекемелері: Балабақшалар, бастауыш және орта мектептер, лицейлер мен гимназиялар.\nАрнаулы және жоғары оқу орындары: Колледждер мен университеттер (оқытушы, куратор, эдвайзер).\nҚосымша білім беру орталықтары: Тіл үйрету курстары, дамыту орталықтары және шығармашылық үйірмелер.',what:'Оқыту және тәрбиелеу: Пән бойынша білім берумен қатар, оқушылардың бойында адамгершілік, жауапкершілік және этика құндылықтарын қалыптастыру.\nӘдістемелік жұмыс: Сабақ жоспарларын құру, көрнекі құралдар дайындау және оқушылардың жетістіктерін жүйелі түрде бағалау.'},
      {name:'Саясаттанушы',where:'Мемлекеттік аппарат: Мемлекеттік басқару органдарының ішкі және сыртқы саясат бөлімдері, мемлекеттік-әкімшілік құрылымдар.\nҚұқық қорғау және қауіпсіздік: Ұлттық қауіпсіздік комитеті (ҰҚК) мен Ішкі істер министрлігінің (ІІМ) сараптамалық бөлімдері.\nҒылым және білім: Ғылыми-зерттеу институттары мен орталықтары, жоғары оқу орындары (университеттер мен колледждерде оқытушы).\nСаяси ұйымдар: Қоғамдық саяси ұйымдар, саяси партиялар және сайлау штабтары.\nХалықаралық арена: Халықаралық ұйымдар мен дипломатиялық мекемелер.\nМедиа және PR: Бұқаралық ақпарат құралдарының (теледидар, газет-журнал) сараптама бөлімдері және жұртшылықпен байланыс (PR) агенттіктері.',what:'Саяси технологиялар және имидж: Саяси технолог немесе имиджмейкер ретінде саясаткерлердің беделін қалыптастыру және сайлау науқандарын басқару.\nКонфликтология: Қоғамдық немесе саяси қақтығыстарды зерттеу және оларды тиімді шешу жолдарын ұсыну.\nСараптамалық қызмет: Мемлекеттің ішкі-сыртқы бағытына талдау жасау, саяси болжамдар дайындау және ғылыми зерттеулер жүргізу.\nКоммуникация және PR: Мемлекеттік құрылымдар мен халық арасындағы байланысты реттеу, қоғамдық пікірге әсер ету стратегияларын құру.\nДипломатиялық қызмет: Халықаралық деңгейдегі саяси мәселелерді шешуге қатысу және мемлекеттің геосаяси мүддесін қорғау.'},
      {name:'Аудармашы',where:'Халықаралық ұйымдар мен елшіліктер: Дипломатиялық өкілдіктерде, БҰҰ немесе ЮНЕСКО сияқты жаһандық мекемелерде.\nАударма бюролары мен баспалар: Кітаптарды, ресми құжаттарды және техникалық нұсқаулықтарды аударатын орталықтарда.\nIT және креативті индустрия: Ойындарды, сайттарды және бағдарламалық жасақтамаларды локализациялау бөлімдерінде.\nТуризм және бизнес: Шетелдік делегацияларды сүйемелдеу, іскерлік келіссөздер мен халықаралық конференцияларда.',what:'Жазбаша аударма: Түрлі жанрдағы мәтіндерді (көркем, техникалық, заңдық) мағынасын бұзбай бір тілден екінші тілге аудару.\nСинхронды және ілеспе аударма: Халықаралық форумдар мен жиындарда спикердің сөзін сол сәтте ауызша жеткізу.\nРедакциялау және корректура: Дайын аудармалардың сапасын тексеру, стилистикалық және грамматикалық қателерін түзету.\nТерминологиямен жұмыс: Арнайы салалар (медицина, мұнай-газ, IT) бойынша сөздіктер мен глоссарийлер жасақтау.'},
